<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuidado · Ministerio de Hombres</title>
<meta name="description" content="Plataforma de cuidado del ministerio de hombres de Semillas de Vida.">
<meta name="theme-color" content="#F5F7F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --fondo:#EEF2EC; --fondo2:#F7F9F5;
  --panel:rgba(255,255,255,.72); --panel-solido:#FFFFFF;
  --alto:rgba(255,255,255,.55); --velo:rgba(22,32,22,.045);
  --linea:rgba(22,40,24,.10); --linea-suave:rgba(22,40,24,.055);
  --texto:#141A13; --suave:#555D52; --tenue:#838B7F;
  --verde:#2F6C48; --verde-vivo:#3C8A5B; --verde-tenue:rgba(47,108,72,.12);
  --ambar:#8A6511; --ambar-tenue:rgba(190,146,38,.16);
  --barro:#9C4028; --barro-tenue:rgba(156,64,40,.13);
  --azul:#34608F;  --azul-tenue:rgba(52,96,143,.13);
  --sombra:0 1px 2px rgba(18,32,20,.05), 0 8px 24px -10px rgba(18,32,20,.14);
  --sombra-alta:0 2px 6px rgba(18,32,20,.07), 0 24px 56px -18px rgba(18,32,20,.26);
  --r:22px; --r-med:15px; --r-chico:11px;
  --brinco:cubic-bezier(.22,1,.36,1);
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}
:root[data-tema="oscuro"]{
  --fondo:#0C100B; --fondo2:#141A13;
  --panel:rgba(30,38,29,.62); --panel-solido:#1A211A;
  --alto:rgba(255,255,255,.07); --velo:rgba(255,255,255,.04);
  --linea:rgba(255,255,255,.10); --linea-suave:rgba(255,255,255,.055);
  --texto:#EBEFE8; --suave:#9BA596; --tenue:#737C6F;
  --verde:#6AB487; --verde-vivo:#7FC79A; --verde-tenue:rgba(106,180,135,.17);
  --ambar:#D4AB58; --ambar-tenue:rgba(212,171,88,.16);
  --barro:#CB6B53; --barro-tenue:rgba(203,107,83,.16);
  --azul:#86ADD8;  --azul-tenue:rgba(134,173,216,.15);
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  --sombra-alta:0 2px 8px rgba(0,0,0,.4), 0 28px 60px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--texto);
  font-family:var(--sans);
  font-size:15.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 12% -5%,  var(--verde-tenue), transparent 60%),
    radial-gradient(900px 600px at 95% 8%,    var(--azul-tenue),  transparent 55%),
    radial-gradient(800px 800px at 70% 105%,  var(--ambar-tenue), transparent 60%),
    linear-gradient(170deg, var(--fondo2), var(--fondo));
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde-vivo);outline-offset:2px;border-radius:8px}
a{color:var(--verde);text-decoration-color:color-mix(in srgb, var(--verde) 35%, transparent)}

/* ============================================================
   Movimiento — una entrada por pantalla, nada más
   ============================================================ */
@keyframes surgir{ from{opacity:0;transform:translateY(14px) scale(.985)} to{opacity:1;transform:none} }
@keyframes asomar{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes aparecer{ from{opacity:0} to{opacity:1} }

#app > *{animation:surgir .5s var(--brinco) both}
#app > *:nth-child(1){animation-delay:0s}
#app > *:nth-child(2){animation-delay:.045s}
#app > *:nth-child(3){animation-delay:.085s}
#app > *:nth-child(4){animation-delay:.12s}
#app > *:nth-child(5){animation-delay:.15s}
#app > *:nth-child(n+6){animation-delay:.175s}

@media (prefers-reduced-motion: reduce){
  *,#app > *{animation:none!important;transition:none!important}
}

/* ============================================================
   Estructura
   ============================================================ */
.lado{display:none}
.principal{padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.lienzo{max-width:1020px;margin:0 auto}

@media (min-width:960px){
  .lado{
    display:flex;flex-direction:column;position:fixed;inset:12px auto 12px 12px;width:242px;
    background:var(--panel);
    -webkit-backdrop-filter:blur(26px) saturate(170%); backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--linea);border-radius:var(--r);
    padding:20px 12px 12px;z-index:30;box-shadow:var(--sombra);
  }
  .principal{margin-left:266px;padding:0 30px 60px}
  .barra{display:none}
}

.marca{display:flex;align-items:center;gap:11px;padding:0 10px 20px}
.marca-sello{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
  box-shadow:0 4px 12px -3px color-mix(in srgb, var(--verde) 55%, transparent);
}
.marca-sello svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8}
.marca b{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.1;display:block}
.marca span{font-size:11.5px;color:var(--tenue);display:block;line-height:1.2}

.grupo-nav{margin-bottom:18px}
.grupo-nav p{
  font-size:10.5px;font-weight:700;color:var(--tenue);
  letter-spacing:.07em;margin:0 0 5px;padding:0 10px;
}
.grupo-nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-radius:var(--r-chico);
  padding:9px 10px;cursor:pointer;color:var(--suave);
  font-size:14.5px;font-weight:500;text-align:left;
  transition:background .22s var(--brinco), color .22s var(--brinco);
}
.grupo-nav button:hover{background:var(--velo);color:var(--texto)}
.grupo-nav button[aria-current=page]{
  background:var(--verde-tenue);color:var(--verde);font-weight:600;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--verde) 18%, transparent);
}
.grupo-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 auto}

.pie-lado{margin-top:auto;border-top:1px solid var(--linea-suave);padding-top:11px;display:flex;align-items:center;gap:6px}
.quien{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;
  background:none;border:0;border-radius:var(--r-chico);padding:8px 10px;cursor:pointer;text-align:left;
  transition:background .22s var(--brinco);
}
.quien:hover{background:var(--velo)}
.inicial{
  width:33px;height:33px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
}
.quien div{min-width:0}
/* En oscuro el verde se aclara, así que lo que va encima debe oscurecerse */
:root[data-tema="oscuro"] .inicial{color:#0B0F0A}
:root[data-tema="oscuro"] .marca-sello svg{stroke:#0B0F0A}
:root[data-tema="oscuro"] .btn{color:#0B0F0A}
:root[data-tema="oscuro"] .btn.seco{color:var(--texto)}
:root[data-tema="oscuro"] .btn.rojo{color:var(--barro)}
:root[data-tema="oscuro"] .chip[aria-pressed=true]{color:#0B0F0A}
:root[data-tema="oscuro"] .cal-celda.hoy{color:#0B0F0A}
:root[data-tema="oscuro"] .grada-punto.actual .grada-bola{color:#0B0F0A}
:root[data-tema="oscuro"] .paso.hecho .paso-num{color:#0B0F0A}

.quien b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quien span{display:block;font-size:11.5px;color:var(--tenue)}

/* ============================================================
   Encabezado
   ============================================================ */
.cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 18px;flex-wrap:wrap}
.cabeza h1{
  font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.08;margin:0;
  letter-spacing:-.018em;
}
.cabeza p{margin:6px 0 0;color:var(--suave);font-size:14.5px}
.cabeza-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tema{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-chico);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--suave);
  transition:transform .3s var(--brinco), color .2s;
}
.tema:hover{color:var(--texto);transform:rotate(25deg)}
.tema svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ============================================================
   Widgets
   ============================================================ */
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:16px}
@media (min-width:720px){ .rejilla{grid-template-columns:repeat(4,minmax(0,1fr))} }
.ancho2{grid-column:span 2}
@media (min-width:720px){ .ancho2{grid-column:span 2} }

.wid{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(165%); backdrop-filter:blur(22px) saturate(165%);
  box-shadow:var(--sombra);padding:16px 17px;position:relative;overflow:hidden;
}
.wid::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.28), transparent 42%);
}
:root[data-tema="oscuro"] .wid::after{background:linear-gradient(160deg, rgba(255,255,255,.07), transparent 42%)}

.cifra-icono{
  width:31px;height:31px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;
}
.cifra-icono svg{width:16px;height:16px;fill:none;stroke-width:1.9}
.wid b.num{display:block;font-size:31px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wid span.pie{display:block;font-size:12.5px;color:var(--suave);margin-top:6px}
.i-verde{background:var(--verde-tenue)}  .i-verde svg{stroke:var(--verde)}
.i-ambar{background:var(--ambar-tenue)}  .i-ambar svg{stroke:var(--ambar)}
.i-barro{background:var(--barro-tenue)}  .i-barro svg{stroke:var(--barro)}
.i-azul{background:var(--azul-tenue)}    .i-azul svg{stroke:var(--azul)}

/* ---------- calendario ---------- */
.cal-alto{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.cal-alto h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;text-transform:capitalize}
.cal-nav{display:flex;gap:4px}
.cal-nav button{
  width:27px;height:27px;border-radius:8px;border:1px solid var(--linea);background:var(--alto);
  cursor:pointer;color:var(--suave);display:grid;place-items:center;font-size:13px;line-height:1;
  transition:background .2s var(--brinco);
}
.cal-nav button:hover{background:var(--velo);color:var(--texto)}
.cal-rejilla{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dia-nom{
  text-align:center;font-size:10px;font-weight:700;color:var(--tenue);
  padding-bottom:5px;text-transform:uppercase;
}
.cal-celda{
  position:relative;height:33px;display:grid;place-items:center;border-radius:9px;
  font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--suave);border:0;background:none;
  cursor:default;padding:0;
}
.cal-celda.fuera{color:var(--tenue);opacity:.35}
.cal-celda.hoy{background:var(--verde);color:#fff;font-weight:700}
.cal-celda.tiene{cursor:pointer;font-weight:700;color:var(--texto)}
.cal-celda.tiene:hover{background:var(--velo)}
.cal-celda.tiene.hoy:hover{background:var(--verde-vivo)}
.cal-celda i{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--verde-vivo);
}
.cal-celda.hoy i{background:#fff}
.cal-pie{margin-top:11px;font-size:12.5px;color:var(--suave);min-height:18px}

/* ---------- versículo ---------- */
.verso{
  background:
    radial-gradient(420px 220px at 85% 0%, var(--verde-tenue), transparent 70%),
    var(--panel);
  display:flex;flex-direction:column;justify-content:center;
}
.mitad{grid-column:1 / -1}
@media (min-width:720px){ .mitad{grid-column:span 2} }
.verso .etq{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--verde);
  text-transform:uppercase;display:block;margin-bottom:9px;
}
.verso p{
  font-family:var(--serif);font-size:19px;line-height:1.45;margin:0;letter-spacing:-.005em;
}
.verso cite{
  display:block;margin-top:11px;font-size:13px;font-style:normal;font-weight:600;color:var(--suave);
}
.verso .tema-v{font-size:11.5px;color:var(--tenue);font-weight:500}

/* ============================================================
   Tarjetas
   ============================================================ */
.tarjeta{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(165%); backdrop-filter:blur(22px) saturate(165%);
  box-shadow:var(--sombra);margin-bottom:15px;overflow:hidden;
}
.tarjeta-alto{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 19px;border-bottom:1px solid var(--linea-suave);flex-wrap:wrap;
}
.tarjeta-alto h2{font-family:var(--serif);font-size:18.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.tarjeta-cuerpo{padding:18px 19px}

.registro{list-style:none;margin:0;padding:0}
.fila{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--linea-suave);padding:14px 19px;cursor:pointer;
  transition:background .2s var(--brinco);
}
.fila:first-child{border-top:0}
.fila:hover{background:var(--velo)}
.fila-alto{display:flex;align-items:baseline;gap:12px}
.nombre{
  font-family:var(--serif);font-size:19.5px;font-weight:500;flex:1;min-width:0;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em;
}
.cuenta{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.cuenta small{font-size:11px;font-weight:500;margin-left:3px;color:var(--tenue)}
.cuenta.v-cuidado{color:var(--verde)} .cuenta.v-alerta{color:var(--ambar)} .cuenta.v-desconectado{color:var(--barro)}
.sub{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:13px;color:var(--suave);flex-wrap:wrap}
.marca-est{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.m-cuidado{background:var(--verde-tenue);color:var(--verde)}
.m-alerta{background:var(--ambar-tenue);color:var(--ambar)}
.m-desconectado{background:var(--barro-tenue);color:var(--barro)}

.medida{display:block;position:relative;height:4px;margin-top:10px;background:var(--linea-suave);border-radius:3px}
.medida i{position:absolute;inset:0 auto 0 0;border-radius:3px;display:block;animation:crecer .7s var(--brinco) both}
@keyframes crecer{ from{width:0 !important} }
.medida b{position:absolute;top:-2px;width:1px;height:8px;background:var(--linea)}
.medida.v-cuidado i{background:var(--verde)} .medida.v-alerta i{background:var(--ambar)} .medida.v-desconectado i{background:var(--barro)}

.vacio{
  border:1px dashed var(--linea);border-radius:var(--r);background:var(--panel);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  padding:36px 22px;text-align:center;color:var(--suave);font-size:14.5px;line-height:1.6;margin-bottom:15px;
}
.vacio strong{display:block;color:var(--texto);font-size:18px;font-weight:600;margin-bottom:7px;font-family:var(--serif)}

/* ============================================================
   Procesos
   ============================================================ */
.escala{display:flex;align-items:center;padding:4px 0 2px;overflow-x:auto}
.grada-punto{display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 4px;min-width:94px;flex:0 0 auto}
.grada-bola{
  width:32px;height:32px;border-radius:50%;border:2px solid var(--linea);
  background:var(--panel-solido);display:grid;place-items:center;color:var(--tenue);
  font-size:13px;font-weight:700;transition:transform .4s var(--brinco);
}
.grada-punto.hecho .grada-bola{border-color:var(--verde);background:var(--verde-tenue);color:var(--verde)}
.grada-punto.actual .grada-bola{
  border-color:var(--verde);color:#fff;transform:scale(1.12);
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
  box-shadow:0 5px 14px -4px color-mix(in srgb, var(--verde) 60%, transparent);
}
.grada-punto span{font-size:12.5px;color:var(--tenue);font-weight:500}
.grada-punto.hecho span,.grada-punto.actual span{color:var(--texto);font-weight:600}
.grada-raya{width:40px;height:2px;background:var(--linea);flex:0 0 auto;border-radius:2px}
.grada-raya.hecha{background:var(--verde)}

.ruta{border-top:1px solid var(--linea-suave);padding:15px 19px}
.ruta:first-child{border-top:0}
.ruta-alto{display:flex;align-items:center;gap:11px;cursor:pointer}
.ruta-alto h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;flex:1;min-width:0}
.ruta-conteo{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
.ruta p{font-size:13.5px;color:var(--suave);margin:4px 0 0;line-height:1.5}
.barra-prog{display:block;height:6px;background:var(--linea-suave);border-radius:4px;margin-top:11px;overflow:hidden}
.barra-prog i{display:block;height:100%;border-radius:4px;animation:crecer .7s var(--brinco) both;
  background:linear-gradient(90deg, var(--verde), var(--verde-vivo))}
.pasos{list-style:none;margin:14px 0 0;padding:0}
.paso{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--linea-suave);animation:asomar .35s var(--brinco) both}
.paso-num{
  width:23px;height:23px;border-radius:50%;border:1.5px solid var(--linea);flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--tenue);margin-top:1px;
  transition:background .3s var(--brinco), border-color .3s;
}
.paso.hecho .paso-num{background:var(--verde);border-color:var(--verde);color:#fff}
.paso.curso .paso-num{border-color:var(--ambar);color:var(--ambar)}
.paso-txt{flex:1;min-width:0}
.paso-txt b{display:block;font-size:14.5px;font-weight:600}
.paso.hecho .paso-txt b{color:var(--suave)}
.paso-txt span{display:block;font-size:13px;color:var(--tenue);line-height:1.45;margin-top:1px}
.paso-acc{display:flex;gap:5px;flex:0 0 auto;flex-wrap:wrap}

/* ============================================================
   Hilo
   ============================================================ */
.hilo{list-style:none;margin:0;padding:0}
.anota{border-left:2px solid var(--linea);padding:0 0 18px 15px;position:relative}
.anota:last-child{padding-bottom:0}
.anota::before{content:'';position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--linea)}
.anota.es-reunion::before{background:var(--verde);box-shadow:0 0 0 3px var(--verde-tenue)}
.anota-alto{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.anota-fecha{font-size:12.5px;color:var(--tenue);font-variant-numeric:tabular-nums}
.anota-tema{font-family:var(--serif);font-size:17px;font-weight:500;margin:2px 0 0}
.anota-cuerpo{font-size:14.5px;color:var(--suave);margin:4px 0 0;line-height:1.55;white-space:pre-wrap}
.sello{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--alto);color:var(--suave);
  box-shadow:inset 0 0 0 1px var(--linea-suave)}

/* ============================================================
   Controles
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
  color:#fff;border:0;border-radius:var(--r-chico);
  padding:11px 18px;font-weight:600;font-size:14.5px;cursor:pointer;
  box-shadow:0 3px 10px -3px color-mix(in srgb, var(--verde) 55%, transparent);
  transition:transform .2s var(--brinco), filter .2s, box-shadow .2s;
}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn.ancho{width:100%;padding:13px 18px;font-size:15px}
.btn.seco{background:var(--panel-solido);color:var(--texto);border:1px solid var(--linea);box-shadow:var(--sombra)}
.btn.seco:hover{background:var(--alto);filter:none}
.btn.chico{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.rojo{background:none;color:var(--barro);border:1px solid var(--barro-tenue);box-shadow:none}
.btn.rojo:hover{background:var(--barro-tenue);filter:none}

label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin:15px 0 6px}
.tarjeta-cuerpo label:first-child,form label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],select,textarea{

input:focus,select:focus,textarea:focus{

}
textarea{resize:vertical;min-height:88px;line-height:1.5}
.ayuda{font-size:12.5px;color:var(--tenue);margin:7px 0 0;line-height:1.55}
.par{display:grid;gap:0 14px}
@media (min-width:640px){.par{grid-template-columns:1fr 1fr}}

.opciones{display:grid;gap:9px;grid-template-columns:1fr 1fr}
.opcion{
  background:var(--panel-solido);border:1px solid var(--linea);border-radius:var(--r-med);
  padding:15px 14px;cursor:pointer;text-align:left;font-size:15px;font-weight:600;
  transition:transform .2s var(--brinco), border-color .2s, background .2s;
}
.opcion:hover{transform:translateY(-1px)}
.opcion[aria-pressed=true]{border-color:var(--verde);background:var(--verde-tenue);color:var(--verde)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--panel-solido);border:1px solid var(--linea);border-radius:99px;
  padding:7px 14px;font-size:13.5px;cursor:pointer;
  transition:transform .18s var(--brinco), background .2s;
}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed=true]{
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
  border-color:transparent;color:#fff;font-weight:600;
}

.casilla{display:flex;gap:10px;align-items:center;cursor:pointer;margin-top:16px}
.casilla input{width:19px;height:19px;accent-color:var(--verde);flex:0 0 auto}
.casilla div b{display:block;font-size:14.5px;font-weight:600}

.datos{list-style:none;margin:0;padding:0;font-size:14.5px}
.datos li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--linea-suave)}
.datos li:first-child{border-top:0;padding-top:0}
.datos span{color:var(--suave)}
.datos b{font-weight:600;text-align:right}

.volver{
  background:none;border:0;color:var(--suave);font-size:14px;font-weight:600;
  padding:22px 0 0;cursor:pointer;transition:color .2s, transform .2s var(--brinco);
}
.volver:hover{color:var(--texto);transform:translateX(-2px)}

/* ============================================================
   Barra inferior
   ============================================================ */
.barra{
  position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;
  background:var(--panel);border:1px solid var(--linea);border-radius:20px;
  -webkit-backdrop-filter:blur(26px) saturate(170%); backdrop-filter:blur(26px) saturate(170%);
  box-shadow:var(--sombra-alta);
}
.barra ul{display:flex;list-style:none;margin:0;padding:0}
.barra button{
  flex:1;background:none;border:0;padding:9px 3px 10px;cursor:pointer;color:var(--tenue);
  font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;
  border-radius:16px;transition:color .25s var(--brinco), transform .25s var(--brinco);
}
.barra button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.barra button[aria-current=page]{color:var(--verde)}
.barra button[aria-current=page] svg{transform:translateY(-1px) scale(1.08)}

/* ============================================================
   Varios
   ============================================================ */
.aviso{
  position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));
  max-width:430px;margin:0 auto;z-index:50;
  background:var(--panel-solido);border:1px solid var(--linea);
  border-left:3px solid var(--verde);border-radius:var(--r-med);
  padding:13px 16px;font-size:14px;box-shadow:var(--sombra-alta);
  animation:surgir .4s var(--brinco) both;
}
.aviso.mal{border-left-color:var(--barro);color:var(--barro)}
@media (min-width:960px){.aviso{bottom:24px;left:auto;right:24px}}

.error{
  background:var(--barro-tenue);border:1px solid var(--barro);color:var(--barro);
  border-radius:var(--r-med);padding:12px 14px;font-size:14px;margin:12px 0;line-height:1.5;
}
.cargando{text-align:center;color:var(--tenue);padding:70px 0;font-size:14px;animation:aparecer .4s both}

.entrada{max-width:400px;margin:0 auto;padding:12vh 20px 40px;animation:surgir .6s var(--brinco) both}
.entrada .marca{justify-content:center;padding-bottom:24px}
.entrada h1{font-family:var(--serif);font-weight:500;font-size:29px;margin:0 0 6px;text-align:center;letter-spacing:-.02em}

.entrada form{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:24px;
  -webkit-backdrop-filter:blur(22px) saturate(165%); backdrop-filter:blur(22px) saturate(165%);
  box-shadow:var(--sombra-alta);
}
</style>

<body>

<aside class="lado" id="lado" hidden></aside>
<main class="principal"><div class="lienzo" id="app"><p class="cargando">Abriendo…</p></div></main>
<nav class="barra" id="barra" hidden></nav>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const SB = createClient(
  'https://gmgiciabtqvvzmzsnjis.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZ2ljaWFidHF2dnptenNuamlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTYwMjgsImV4cCI6MjEwNjk3MjAyOH0.oT_LeB3_Uh-HhpAzI-VJoDOBRukc4f5WbBaQWCbPkL8'
);

const app   = document.getElementById('app');
const lado  = document.getElementById('lado');
const barra = document.getElementById('barra');

const S = { yo:null, vista:'inicio', nombres:new Map(), gente:[],
            procPersona:null, rutaAbierta:null, evento:null, rol:'real' };

/* ============================================================
   Vista de rol
   ------------------------------------------------------------
   Cambia lo que la PANTALLA muestra, no lo que la base permite
   leer. Las reglas de verdad viven en Supabase y se evalúan con
   la sesión real: desde aquí solo se puede ver MENOS, nunca más.
   Sirve para comprobar cómo le queda la plataforma a un líder o
   a un hombre sin gente a cargo. Al recargar vuelve a lo real.
   ============================================================ */
const ROLES = {
  real:   'Mi rol real',
  admin:  'Súper administrador',
  pastor: 'Pastor o director',
  lider:  'Líder con gente a cargo',
  hombre: 'Hombre sin gente a cargo'
};

function V(){
  const y = S.yo;
  switch (S.rol){
    case 'admin':  return { ...y, es_admin:true,  ve_todo:true,  puede_cuidar:true };
    case 'pastor': return { ...y, es_admin:false, ve_todo:true,  puede_cuidar:true };
    case 'lider':  return { ...y, es_admin:false, ve_todo:false, puede_cuidar:true };
    case 'hombre': return { ...y, es_admin:false, ve_todo:false, puede_cuidar:false, a_cargo:0 };
    default:       return y;
  }
}

// Solo se ofrecen los roles iguales o por debajo del real.
function rolesDisponibles(){
  const y = S.yo, r = ['real'];
  if (y.es_admin) r.push('admin');
  if (y.ve_todo || y.es_admin) r.push('pastor');
  if (y.puede_cuidar || y.es_admin || y.ve_todo) r.push('lider');
  r.push('hombre');
  return r;
}

/* ============================================================
   Tema
   ============================================================ */
function leerTema(){
  try { return localStorage.getItem('tema'); } catch { return null; }
}
function ponerTema(t){
  document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem('tema', t); } catch {}
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', t === 'oscuro' ? '#0F130E' : '#F5F7F3');
}
ponerTema(leerTema() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'));
const girarTema = () => ponerTema(document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro');

/* ============================================================
   Utilidades
   ============================================================ */
const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function haceCuanto(d){
  if (d === null || d === undefined) return '';
  if (d <= 0) return 'hoy';
  if (d === 1) return 'ayer';
  if (d < 7)  return `hace ${d} días`;
  if (d < 60) { const s = Math.round(d/7); return `hace ${s} ${s===1?'semana':'semanas'}`; }
  if (d < 365){ const m = Math.round(d/30); return `hace ${m} ${m===1?'mes':'meses'}`; }
  const a = Math.floor(d/365); return `hace ${a} ${a===1?'año':'años'}`;
}
const claseEstado = s => 'v-' + ({'cuidado':'cuidado','en alerta':'alerta','desconectado':'desconectado'}[s] || 'alerta');

function fechaCorta(f){
  if (!f) return '';
  const [a,m,d] = f.split('-').map(Number);
  return `${d} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m-1]} ${a}`;
}
const hoy = () => new Date().toLocaleDateString('en-CA', { timeZone:'America/Bogota' });
const iniciales = n => (n||'').split(' ').filter(Boolean).slice(0,2).map(p => p[0]).join('').toUpperCase();

function avisar(texto, mal=false){
  document.querySelectorAll('.aviso').forEach(n => n.remove());
  const n = document.createElement('div');
  n.className = 'aviso' + (mal ? ' mal' : '');
  n.setAttribute('role', mal ? 'alert' : 'status');
  n.textContent = texto;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 4500);
}
const cargando = () => { app.innerHTML = '<p class="cargando">Un momento…</p>'; };

const I = {
  inicio:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round"/></svg>',
  ministerio:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5" stroke-linecap="round"/><path d="M16 11a3 3 0 1 0 0-6M18 20c0-2.5-1-4-2.5-4.6" stroke-linecap="round"/></svg>',
  procesos:'<svg viewBox="0 0 24 24"><path d="M5 19V5M5 19h14" stroke-linecap="round"/><path d="M9 15l3.5-4 3 2.5L19 8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  material:'<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z" stroke-linejoin="round"/></svg>',
  yo:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6" stroke-linecap="round"/></svg>',
  sello:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-9.6V5.6L12 3l7 2.6v5.8C19 16.6 12 21 12 21z" stroke-linejoin="round"/></svg>',
  reloj:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2" stroke-linecap="round"/></svg>',
  alerta:'<svg viewBox="0 0 24 24"><path d="M12 4.5l8 14H4z" stroke-linejoin="round"/><path d="M12 10v3.5M12 16.2v.3" stroke-linecap="round"/></svg>',
  corte:'<svg viewBox="0 0 24 24"><path d="M9.5 6.5L6 10l3.5 3.5M14.5 17.5L18 14l-3.5-3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20L20 4" stroke-linecap="round"/></svg>',
  luz:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke-linecap="round"/></svg>',
  eventos:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3" stroke-linecap="round"/></svg>',
  servicio:'<svg viewBox="0 0 24 24"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 8.7l5.4-.8z" stroke-linejoin="round"/></svg>',
  area:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  puerta:'<svg viewBox="0 0 24 24"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4" stroke-linecap="round"/><path d="M11 8l4 4-4 4M15 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ============================================================
   Arranque
   ============================================================ */
async function arrancar(){
  const { data:{ session } } = await SB.auth.getSession();
  session ? await entrar() : pantallaEntrada();
  SB.auth.onAuthStateChange(e => {
    if (e === 'SIGNED_OUT'){ S.yo = null; lado.hidden = true; barra.hidden = true; pantallaEntrada(); }
  });
}

async function entrar(){
  cargando();
  const { data, error } = await SB.rpc('quien_soy');
  if (error) return app.innerHTML = `<div class="error">No se pudo abrir la sesión: ${esc(error.message)}</div>`;

  if (!data || !data.length){
    app.innerHTML = `<div class="cabeza"><div><h1>Tu correo no está en el ministerio</h1>
      <p>Entraste bien, pero este correo todavía no corresponde a ningún hombre registrado.
         Avísale a quien administra la plataforma para que te agregue.</p></div></div>
      <button class="btn seco" id="salir">Cerrar sesión</button>`;
    document.getElementById('salir').onclick = () => SB.auth.signOut();
    return;
  }

  S.yo = data[0];
  S.procPersona = S.yo.persona_id;
  const { data:gente } = await SB.from('personas').select('id,nombre');
  S.nombres = new Map((gente||[]).map(p => [p.id, p.nombre]));
  pintarNav();
  ir('inicio');
}

/* ============================================================
   Entrada
   ============================================================ */
function pantallaEntrada(){
  lado.hidden = true; barra.hidden = true;
  document.querySelector('.principal').style.marginLeft = '0';
  app.innerHTML = `
  <div class="entrada">
    <div class="marca"><span class="marca-sello">${I.sello}</span>
      <span><b>Cuidado</b><span>Ministerio de hombres</span></span></div>
    <h1>Entra con tu correo</h1>
    <p class="lema">Semillas de Vida</p>
    <form id="f">
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required>
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <div id="err"></div>
      <div style="margin-top:20px"><button class="btn ancho" type="submit" id="b">Entrar</button></div>
    </form>
  </div>`;

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById('b');
    b.disabled = true; b.textContent = 'Entrando…';
    const { error } = await SB.auth.signInWithPassword({
      email: document.getElementById('correo').value.trim(),
      password: document.getElementById('clave').value
    });
    if (error){
      document.getElementById('err').innerHTML = '<div class="error">El correo o la contraseña no coinciden.</div>';
      b.disabled = false; b.textContent = 'Entrar';
      return;
    }
    document.querySelector('.principal').style.marginLeft = '';
    await entrar();
  };
}

/* ============================================================
   Navegacion
   ============================================================ */
function pintarNav(){
  const mando = V().es_admin || V().ve_todo;
  const grupos = [
    ['Cuidado',  [['inicio','Inicio'], ...(mando ? [['ministerio','Ministerio']] : [])]],
    ['Procesos', [['procesos','Procesos']]],
    ['Encuentros', [['eventos','Eventos']]],
    ['Servicio',   [['servicio','Mi servicio']]],
    ['Recursos',   [['material','Material']]]
  ];

  const opciones = rolesDisponibles();
  const selector = opciones.length > 2 ? `
    <div class="grupo-nav" style="margin-bottom:14px">
      <p>VISTA</p>
      <select id="selrol" style="font-size:13.5px;padding:8px 10px">
        ${opciones.map(r => `<option value="${r}"${r === S.rol ? ' selected' : ''}>${ROLES[r]}</option>`).join('')}
      </select>
    </div>` : '';

  lado.hidden = false;
  lado.innerHTML = `
    <div class="marca"><span class="marca-sello">${I.sello}</span>
      <span><b>Cuidado</b><span>Ministerio de hombres</span></span></div>
    ${grupos.map(([t, items]) => `<div class="grupo-nav"><p>${t.toUpperCase()}</p>
      ${items.map(([v,n]) => `<button data-v="${v}">${I[v]}<span>${n}</span></button>`).join('')}
    </div>`).join('')}
    ${selector}
    <div class="pie-lado">
      <button class="quien" data-v="yo">
        <span class="inicial">${esc(iniciales(S.yo.nombre))}</span>
        <div><b>${esc(S.yo.nombre)}</b><span>${esc(S.yo.rango || 'sin rango')}</span></div>
      </button>
      <button class="tema" id="btema" title="Cambiar entre claro y oscuro"
        aria-label="Cambiar entre claro y oscuro">${I.luz}</button>
    </div>`;

  const movil = [['inicio','Inicio'], ['procesos','Procesos'], ['eventos','Eventos'],
                 ['servicio','Servicio'], ['yo','Yo']];
  barra.hidden = false;
  barra.innerHTML = '<ul>' + movil.map(([v,n]) =>
    `<li><button data-v="${v}">${I[v]}<span>${n}</span></button></li>`).join('') + '</ul>';

  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => ir(b.dataset.v));
  document.getElementById('btema').onclick = girarTema;
  const sr = document.getElementById('selrol');
  if (sr) sr.onchange = e => { S.rol = e.target.value; pintarNav(); ir('inicio'); };
}

function marcar(v){
  document.querySelectorAll('[data-v]').forEach(b =>
    b.dataset.v === v ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
}

function ir(vista, arg){
  S.vista = vista; marcar(vista); window.scrollTo(0,0);
  ({ inicio:vInicio, ministerio:vMinisterio, procesos:vProcesos, material:vMaterial,
     eventos:vEventos, evento:vEvento, servicio:vServicio, area:vArea,
     yo:vYo, ficha:vFicha, registrar:vRegistrar }[vista])(arg);
}

function cabeza(titulo, bajada, acciones=''){
  return `<div class="cabeza"><div><h1>${titulo}</h1>${bajada ? `<p>${bajada}</p>` : ''}</div>
    ${acciones ? `<div class="cabeza-acc">${acciones}</div>` : ''}</div>`;
}
function cifras(lista){
  return `<div class="rejilla">${lista.map(c => `<div class="wid">
    <div class="cifra-icono i-${c.color}">${I[c.icono]}</div>
    <b class="num" style="color:var(--${c.color})">${c.valor}</b><span class="pie">${c.texto}</span>
  </div>`).join('')}</div>`;
}

/* ============================================================
   Palabra — versículos sobre hombría e identidad
   Reina-Valera 1909 (dominio público)
   ============================================================ */
const VERSOS = [
  ['Josué 1:9','Mira que te mando que te esfuerces y seas valiente: no temas ni desmayes, porque Jehová tu Dios será contigo en donde quiera que fueres.','Valentía'],
  ['1 Corintios 16:13','Velad, estad firmes en la fe; portaos varonilmente, y esforzaos.','Firmeza'],
  ['Proverbios 27:17','Hierro con hierro se aguza; y el hombre aguza el rostro de su amigo.','Amistad'],
  ['Miqueas 6:8','Oh hombre, él te ha declarado qué sea lo bueno, y qué pida de ti Jehová: solamente hacer juicio, y amar misericordia, y humillarte para andar con tu Dios.','Identidad'],
  ['Salmo 1:1','Bienaventurado el varón que no anduvo en consejo de malos, ni estuvo en camino de pecadores, ni en silla de escarnecedores se ha sentado.','Camino'],
  ['Proverbios 4:23','Sobre toda cosa guardada guarda tu corazón; porque de él mana la vida.','Corazón'],

// El mismo versículo todo el día para todos, distinto cada día.
function versoDeHoy(){
  const d = hoy();
  const semilla = Number(d.slice(0,4)) * 372 + Number(d.slice(5,7)) * 31 + Number(d.slice(8,10));
  return VERSOS[semilla % VERSOS.length];
}

function widgetVerso(){
  const [ref, texto, tema] = versoDeHoy();
  return `<div class="wid verso mitad">
    <span class="etq">Palabra de hoy</span>
    <p>${esc(texto)}</p>
    <cite>${esc(ref)} <span class="tema-v">· ${esc(tema)} · RV1909</span></cite>
  </div>`;
}

/* ============================================================
   Calendario
   ============================================================ */
const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];

function widgetCalendario(eventos){
  const hoyF = hoy();
  const [ha, hm] = [Number(hoyF.slice(0,4)), Number(hoyF.slice(5,7))];
  if (!S.calMes) S.calMes = { a:ha, m:hm };
  const { a, m } = S.calMes;

  const primero = new Date(Date.UTC(a, m-1, 1));
  const dias    = new Date(Date.UTC(a, m, 0)).getUTCDate();
  const arranca = (primero.getUTCDay() + 6) % 7;   // lunes = 0

  const porDia = new Map();
  (eventos || []).forEach(e => {
    if (e.fecha.slice(0,7) === `${a}-${String(m).padStart(2,'0')}`)
      porDia.set(Number(e.fecha.slice(8,10)), e);
  });

  let celdas = '';
  for (let i = 0; i < arranca; i++) celdas += `<span class="cal-celda fuera"></span>`;
  for (let d = 1; d <= dias; d++){
    const f = `${a}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = porDia.get(d);
    celdas += `<${ev ? 'button' : 'span'} class="cal-celda${f === hoyF ? ' hoy' : ''}${ev ? ' tiene' : ''}"
      ${ev ? `data-caldia="${ev.id}" title="${esc(ev.nombre)}"` : ''}>${d}${ev ? '<i></i>' : ''}</${ev ? 'button' : 'span'}>`;
  }

  const delMes = [...porDia.entries()].sort((x,y) => x[0]-y[0]);
  const pie = delMes.length
    ? delMes.slice(0,3).map(([d,e]) => `${d} · ${esc(e.nombre)}`).join('<br>')
    : 'Sin eventos este mes.';

  return `<div class="wid mitad">
    <div class="cal-alto"><h3>${MESES[m-1]} ${a}</h3>
      <div class="cal-nav"><button data-cal="-1" aria-label="Mes anterior">‹</button>
        <button data-cal="0" aria-label="Este mes">·</button>
        <button data-cal="1" aria-label="Mes siguiente">›</button></div></div>
    <div class="cal-rejilla">
      ${['L','M','M','J','V','S','D'].map(d => `<span class="cal-dia-nom">${d}</span>`).join('')}
      ${celdas}
    </div>
    <div class="cal-pie">${pie}</div>
  </div>`;
}

function enlazarCalendario(){
  app.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const paso = Number(b.dataset.cal);
    if (paso === 0){ const h = hoy(); S.calMes = { a:Number(h.slice(0,4)), m:Number(h.slice(5,7)) }; }
    else {
      let { a, m } = S.calMes; m += paso;
      if (m < 1){ m = 12; a--; } if (m > 12){ m = 1; a++; }
      S.calMes = { a, m };
    }
    ir(S.vista);
  });
  app.querySelectorAll('[data-caldia]').forEach(b => b.onclick = () => ir('evento', b.dataset.caldia));
}

function fila(p){
  const c = claseEstado(p.situacion);
  const cuando = p.ultima_reunion ? haceCuanto(p.dias) : 'Sin registro';
  const g = (p.situacion !== 'cuidado' && p.gestion === 'con intentos') ? ' · lo han buscado' : '';
  return `<li><button class="fila" data-id="${p.persona_id}">
    <span class="fila-alto"><span class="nombre">${esc(p.nombre)}</span>
      <span class="cuenta ${c}">${p.dias}<small>días</small></span></span>
    <span class="sub"><span class="marca-est m-${c.slice(2)}">${esc(p.situacion)}</span>
      <span>${cuando}${g}</span></span>
    <span class="medida ${c}"><i style="width:${Math.min(100,Math.round(p.dias/90*100))}%"></i><b style="left:33.3%"></b></span>
  </button></li>`;
}

async function vInicio(){
  cargando();
  const yo = V();

  const { data, error } = S.rol === 'hombre'
    ? { data:[], error:null }
    : await SB.from('mi_gente').select('*').order('dias', { ascending:false });
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;
  if (S.rol === 'real' || S.rol === 'admin') S.gente = data || [];

  const [{ data:aperturas }, { data:eventos }, { data:fechas }] = await Promise.all([
    SB.from('accesos_a_mis_notas').select('*').order('cuando', { ascending:false }).limit(3),
    SB.from('eventos').select('id,nombre,fecha,hora,lugar,tipo').order('fecha'),
    SB.from('mis_fechas_servicio').select('*').order('fecha')
  ]);

  const n = e => data.filter(p => p.situacion === e).length;
  const primero = (S.yo.nombre || '').split(' ')[0];
  const hoyF = hoy();
  const proxima = (fechas || []).find(f => f.fecha >= hoyF);

  let html = cabeza(`Hola, ${esc(primero)}`,
    data.length ? 'Tu gente, empezando por quien lleva más tiempo sin que se vean' : 'Tu espacio en el ministerio');

  html += `<div class="rejilla">`;
  if (data.length){
    html += [
      { icono:'ministerio', color:'azul',  valor:data.length,       texto:'a tu cargo' },
      { icono:'reloj',      color:'verde', valor:n('cuidado'),      texto:'cuidados' },
      { icono:'alerta',     color:'ambar', valor:n('en alerta'),    texto:'en alerta' },
      { icono:'corte',      color:'barro', valor:n('desconectado'), texto:'desconectados' }
    ].map(c => `<div class="wid"><div class="cifra-icono i-${c.color}">${I[c.icono]}</div>
      <b class="num" style="color:var(--${c.color})">${c.valor}</b><span class="pie">${c.texto}</span></div>`).join('');
  }
  html += `</div>`;

  html += `<div class="rejilla">${widgetVerso()}${widgetCalendario(eventos)}</div>`;

  if (proxima)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Te toca servir</h2>
        <span class="sello">${proxima.rol === 'encargado' ? 'Encargado' : esc(proxima.area || 'Servidor')}</span></div>
      <div class="tarjeta-cuerpo"><p style="margin:0 0 4px;font-family:var(--serif);font-size:19px">${esc(proxima.nombre)}</p>
      <p style="margin:0;color:var(--suave);font-size:14px">${fechaCorta(proxima.fecha)}${proxima.hora ? ' · ' + esc(proxima.hora.slice(0,5)) : ''}${proxima.lugar ? ' · ' + esc(proxima.lugar) : ''}</p>
      <div style="margin-top:14px"><button class="btn seco chico" data-ir="servicio">Ver mi servicio</button></div></div></div>`;

  if (aperturas && aperturas.length){
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Abrieron una nota tuya</h2></div>
      <div class="tarjeta-cuerpo">${aperturas.map(a => `<p class="ayuda" style="margin:0 0 7px">
        <b style="color:var(--texto)">${esc(a.abierto_por)}</b> abrió la nota reservada sobre
        ${esc(a.sobre_quien)} · ${esc(a.motivo)}</p>`).join('')}</div></div>`;
  }

  if (!data.length){
    html += `<div class="vacio"><strong>Todavía no cuidas a nadie</strong>
      Cuando te asignen hombres, aquí vas a ver cómo va cada uno.</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn seco" data-ir="procesos">Ver mi proceso</button>
        <button class="btn seco" data-ir="material">Ver el material</button></div>`;
  } else {
    html += `<div class="tarjeta"><ul class="registro">${data.map(fila).join('')}</ul></div>`;
  }

  app.innerHTML = html;
  enlazarFilas(); enlazarCalendario();
  app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
}

async function vFicha(id){

         { data:rangos }, { data:hist }, { data:dir }, { data:todasAreas }] = await Promise.all([
    SB.from('ficha_persona').select('*').eq('id', id).maybeSingle(),
    SB.from('persona_area').select('id, rol_en_area, area_id, areas(nombre)').eq('persona_id', id).is('hasta', null),
    SB.from('contactos_visibles').select('*').eq('persona_id', id).order('fecha', { ascending:false }),
    SB.from('rutas').select('*').eq('activa', true).order('orden'),
    SB.from('pasos').select('*').order('orden'),
    SB.from('avances').select('*').eq('persona_id', id),
    SB.from('rangos').select('*').eq('persona_id', id).order('desde'),
    SB.from('historial').select('*').eq('persona_id', id).order('cuando', { ascending:false }).limit(40),
    SB.from('directorio').select('*').order('nombre'),
    SB.from('areas').select('*').eq('activa', true).order('nombre')

  if (error || !p) return app.innerHTML = `<div class="error">No se encontró a esa persona, o está fuera de lo que puedes ver.</div>`;

  const c = claseEstado(p.situacion);
  const esMio   = p.id === S.yo.persona_id;
  const puedo   = yo.puede_cuidar && !esMio;
  const mando   = yo.es_admin || yo.ve_todo;
  const porPaso = new Map((avances || []).map(a => [a.paso_id, a]));
  const iActual = ESCALA.indexOf(p.rango);
  const puedoMarcar = !esMio && (mando || (S.gente || []).some(g => g.persona_id === id));

  let html = `<button class="volver" id="atras">← Volver</button>` +
    cabeza(esc(p.nombre), `${esc(p.rango || 'sin rango')}${p.lider ? ` · cuidado por ${esc(p.lider)}` : ''}`,
      puedo ? `<button class="btn" id="reg">Registrar encuentro</button>` : '');

  /* ---------- estado ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-cuerpo">
    <div class="fila-alto"><div style="flex:1">
      <span class="marca-est m-${c.slice(2)}">${esc(p.situacion)}</span>
      <p class="ayuda">${p.ultima_reunion
        ? `Se vieron ${haceCuanto(p.dias)}, el ${fechaCorta(p.ultima_reunion)}.`
        : 'Nunca se ha registrado una reunión.'}</p>
    </div><span class="cuenta ${c}">${p.dias}<small>días</small></span></div>
    <span class="medida ${c}" style="margin-top:14px"><i style="width:${Math.min(100,Math.round(p.dias/90*100))}%"></i><b style="left:33.3%"></b></span>
  </div></div>`;

  /* ---------- camino y rutas ---------- */

      <span class="ruta-conteo">${esc(p.rango || 'sin rango')}</span></div>
    <div class="tarjeta-cuerpo">
      <div class="escala">${ESCALA.map((r,i) => {

      <b style="font-weight:500;color:var(--tenue);font-size:12.5px;white-space:nowrap">
        ${fechaCorta(h.cuando.slice(0,10))}<br>${esc(h.quien)}</b></li>`).join('')}</ul>`;
  }
  html += `</div></div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir(V().a_cargo > 0 ? 'inicio' : 'ministerio');
  const r = document.getElementById('reg');
  if (r) r.onclick = () => ir('registrar', { id:p.id, nombre:p.nombre });

  app.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => abrirReservada(b.dataset.abrir, id));

  app.querySelectorAll('[data-rutaf]').forEach(b => {
    const abrir = () => { S.rutaFicha = S.rutaFicha === b.dataset.rutaf ? null : b.dataset.rutaf; ir('ficha', id); };
    b.onclick = abrir;
    b.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abrir(); } };
  });

  app.querySelectorAll('[data-pf]').forEach(b => b.onclick = async () => {
    const ruta = (rutas || []).find(x => x.id === b.dataset.rf);
    await marcarPaso(id, b.dataset.pf, b.dataset.ef, ruta, p.nombre.split(' ')[0], 'ficha');
  });

  const ed = document.getElementById('editar');
  if (ed) ed.onclick = () => {
    document.getElementById('verDatos').hidden   = true;
    document.getElementById('formDatos').hidden  = false;
    ed.hidden = true;
  };
  const cd = document.getElementById('cancelarDatos');
  if (cd) cd.onclick = () => ir('ficha', id);

  const gd = document.getElementById('guardarDatos');
  if (gd) gd.onclick = async () => {
    gd.disabled = true;
    const { error:e1 } = await SB.from('personas').update({
      nombre:  document.getElementById('dn').value.trim(),
      celular: document.getElementById('dc').value.trim() || null,
      correo:  document.getElementById('dm').value.trim() || null,
      estado:  document.getElementById('de').value
    }).eq('id', id);
    if (e1){ avisar(e1.message, true); gd.disabled = false; return; }
    avisar('Datos actualizados.');
    ir('ficha', id);
  };

  const mc = document.getElementById('moverCuidado');
  if (mc) mc.onclick = async () => {
    const nuevo = document.getElementById('nuevoLider').value;
    const { data:actual } = await SB.from('coberturas').select('id').eq('persona_id', id).is('hasta', null).maybeSingle();
    const { error } = actual
      ? await SB.from('coberturas').update({ lider_id:nuevo, asignado_por:S.yo.persona_id }).eq('id', actual.id)
      : await SB.from('coberturas').insert({ persona_id:id, lider_id:nuevo, asignado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Cuidado reasignado.');
    ir('ficha', id);
  };

  const aa = document.getElementById('addArea');
  if (aa) aa.onclick = async () => {
    const { error } = await SB.from('persona_area').insert({
      persona_id:id, area_id:document.getElementById('nuevaArea').value });
    if (error) return avisar(error.message, true);
    avisar('Área agregada.');
    ir('ficha', id);
  };

  app.querySelectorAll('[data-quitararea]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('persona_area').delete().eq('id', b.dataset.quitararea);
    if (error) return avisar(error.message, true);
    avisar('Área quitada.');
    ir('ficha', id);
  });

  app.querySelectorAll('[data-subir]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('rangos').insert({
      persona_id:id, rango:b.dataset.subir, asignado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar(`Ahora es ${b.dataset.subir}.`);
    ir('ficha', id);
  });

  app.querySelectorAll('[data-bajarrango]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Deshacer el último rango asignado?')) return;
    const { error } = await SB.from('rangos').delete().eq('id', b.dataset.bajarrango);
    if (error) return avisar(error.message, true);
    avisar('Rango deshecho.');
    ir('ficha', id);
  });

  app.querySelectorAll('[data-borrarnota]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Eliminar este registro de cuidado? Queda anotado en el historial.')) return;
    const { error } = await SB.from('contactos').delete().eq('id', b.dataset.borrarnota);
    if (error) return avisar(error.message, true);
    avisar('Registro eliminado.');
    ir('ficha', id);
  });
}

async function abrirReservada(contactoId, personaId){
  const motivo = prompt('¿Por qué necesitas abrir esta nota? Queda registrado junto con tu nombre.');
  if (motivo === null) return;
  if (!motivo.trim()) return avisar('Escribe el motivo para poder abrirla.', true);
  const { data, error } = await SB.rpc('abrir_reservada', { p_contacto:contactoId, p_motivo:motivo.trim() });
  if (error) return avisar(error.message, true);
  const n = (data && data[0]) || {};
  alert(`${n.tema || ''}\n\n${n.resumen || ''}`);
  avisar('Nota abierta. Le queda el registro al autor.');
  ir('ficha', personaId);
}

        <span>Quien está arriba va a ver que escribiste algo y cuándo, pero no el contenido.
              Si de verdad necesita leerlo puede abrirlo, y a ti te queda el aviso de quién fue.</span></div></label>

    ir('ficha', quien.id);
  };
}

/* ============================================================
   Procesos
   ============================================================ */
const ESCALA = ['paje','escudero','caballero'];

async function vProcesos(){
  cargando();
  const quien = S.procPersona || S.yo.persona_id;
  const yo    = V();
  const mando = yo.es_admin || yo.ve_todo;
  const propio = quien === S.yo.persona_id;

  const [{ data:rutas }, { data:pasos }, { data:avances }, { data:rangos }, { data:lista }] = await Promise.all([
    SB.from('rutas').select('*').eq('activa', true).order('orden'),
    SB.from('pasos').select('*').order('orden'),
    SB.from('avances').select('*').eq('persona_id', quien),
    SB.from('rangos').select('*').eq('persona_id', quien).order('desde'),
    S.rol === 'hombre' ? Promise.resolve({ data:[] })
      : mando ? SB.from('estado_cuidado').select('persona_id,nombre').order('nombre')
              : SB.from('mi_gente').select('persona_id,nombre').order('nombre')
  ]);

  const gente = [{ persona_id:S.yo.persona_id, nombre:S.yo.nombre + ' (tú)' },
                 ...(lista || []).filter(p => p.persona_id !== S.yo.persona_id)];
  const nombre = propio ? S.yo.nombre : (S.nombres.get(quien) || 'esa persona');
  const primero = nombre.split(' ')[0];

  // Marcar pasos de OTRO exige ser su líder (o admin/pastor).
  const puedoAjeno = !propio && (mando || (S.gente || []).some(g => g.persona_id === quien));

  const porPaso = new Map((avances || []).map(a => [a.paso_id, a]));
  const rangoActual = (rangos && rangos.length) ? rangos[rangos.length-1].rango : null;
  const iActual = ESCALA.indexOf(rangoActual);

  let html = cabeza('Procesos', propio ? 'Tu camino en el ministerio' : `El camino de ${esc(primero)}`);

  html += `<div class="tarjeta"><div class="tarjeta-cuerpo">
    <label for="sel" style="margin-top:0">¿De quién?</label>
    <select id="sel">${gente.map(g =>
      `<option value="${g.persona_id}"${g.persona_id === quien ? ' selected' : ''}>${esc(g.nombre)}</option>`).join('')}</select>
  </div></div>`;

  // Escala del ministerio
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Camino en el ministerio</h2>
      <span class="ruta-conteo">${rangoActual ? esc(rangoActual) : 'sin rango'}</span></div>
    <div class="tarjeta-cuerpo"><div class="escala">
    ${ESCALA.map((r,i) => {
      const cls = i < iActual ? 'hecho' : (i === iActual ? 'actual' : '');
      const f = (rangos || []).find(x => x.rango === r);
      return (i ? `<span class="grada-raya${i <= iActual ? ' hecha' : ''}"></span>` : '') +
        `<span class="grada-punto ${cls}"><span class="grada-bola">${i+1}</span>
          <span>${r[0].toUpperCase()+r.slice(1)}</span>
          ${f ? `<span style="font-size:11.5px;color:var(--tenue);font-weight:400">${fechaCorta(f.desde)}</span>` : ''}
        </span>`;
    }).join('')}
    </div></div></div>`;

  const bloques = [['libertad','Rutas de libertad','Acompañamiento en lo que está pesando'],
                   ['formacion','Formación','El proceso propio del ministerio'],
                   ['otro','Otras rutas','']];

  for (const [tipo, titulo, bajada] of bloques){
    const rs = (rutas || []).filter(r => r.tipo === tipo);
    if (!rs.length) continue;
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>${titulo}</h2>
      ${bajada ? `<span class="ruta-conteo">${bajada}</span>` : ''}</div>`;

    for (const r of rs){
      const ps = (pasos || []).filter(p => p.ruta_id === r.id);
      const hechos = ps.filter(p => porPaso.get(p.id)?.estado === 'completado').length;
      const curso  = ps.filter(p => porPaso.get(p.id)?.estado === 'en curso').length;
      const pct = ps.length ? Math.round(hechos / ps.length * 100) : 0;
      const abierta = S.rutaAbierta === r.id;
      // En una ruta de escuela cada uno marca lo suyo; en una
      // acompañada la marca su líder.
      const marco = r.auto_marca ? (propio || puedoAjeno) : puedoAjeno;

      html += `<div class="ruta">
        <div class="ruta-alto" data-ruta="${r.id}" role="button" tabindex="0">
          <h3>${esc(r.nombre)}</h3>
          <span class="sello">${r.auto_marca ? 'Escuela' : 'Acompañada'}</span>
          <span class="ruta-conteo">${hechos === 0 && curso === 0 ? 'sin empezar' : `${hechos} de ${ps.length}`}</span>
        </div>
        ${r.descripcion ? `<p>${esc(r.descripcion)}</p>` : ''}
        <span class="barra-prog"><i style="width:${pct}%"></i></span>`;

      if (abierta){
        if (!ps.length){
          html += `<p class="ayuda">Esta ruta todavía no tiene pasos.${
            yo.es_admin ? ' Agrégalos abajo.' : ''}</p>`;
        }
        if (marco && !r.auto_marca)
          html += `<label class="casilla" style="margin:13px 0 2px">
            <input type="checkbox" id="cuenta" ${S.contarEncuentro !== false ? 'checked' : ''}>
            <div><b>Contar como encuentro</b></div></label>`;

        html += `<ul class="pasos">${ps.map((p,i) => {
          const a = porPaso.get(p.id);
          const est = a?.estado;
          return `<li class="paso ${est === 'completado' ? 'hecho' : (est === 'en curso' ? 'curso' : '')}">
            <span class="paso-num">${est === 'completado' ? '✓' : i+1}</span>
            <span class="paso-txt"><b>${esc(p.nombre)}</b>
              ${p.descripcion ? `<span>${esc(p.descripcion)}</span>` : ''}
              ${a ? `<span>${est === 'completado' ? 'Completado' : 'En curso'} · ${fechaCorta(a.fecha)}</span>` : ''}</span>
            ${marco ? `<span class="paso-acc">
              <button class="btn ${est === 'en curso' ? '' : 'seco'} chico" data-paso="${p.id}" data-ruta2="${r.id}" data-est="en curso">En curso</button>
              <button class="btn ${est === 'completado' ? '' : 'seco'} chico" data-paso="${p.id}" data-ruta2="${r.id}" data-est="completado">Hecho</button>
            </span>` : ''}
            ${yo.es_admin ? `<button class="btn rojo chico" data-borrarpaso="${p.id}">✕</button>` : ''}
          </li>`;
        }).join('')}</ul>`;

        if (yo.es_admin)
          html += `<div style="margin-top:14px;padding-top:13px;border-top:1px solid var(--linea-suave)">
            <label style="margin-top:0" for="np-${r.id}">Agregar un paso a esta ruta</label>
            <input type="text" id="np-${r.id}" placeholder="Nombre del paso">
            <input type="text" id="nd-${r.id}" placeholder="Qué pasa en este paso (opcional)" style="margin-top:7px">
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
              <button class="btn chico" data-nuevopaso="${r.id}" data-orden="${ps.length+1}">Agregar paso</button>
              <button class="btn seco chico" data-auto="${r.id}" data-val="${r.auto_marca ? 'false' : 'true'}">
                ${r.auto_marca ? 'Pasar a acompañada' : 'Pasar a escuela'}</button>
              <button class="btn rojo chico" data-borrarruta="${r.id}" data-nomruta="${esc(r.nombre)}">Eliminar ruta</button>
            </div>
            </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  if (yo.es_admin)
    html += `<div style="margin-top:4px"><button class="btn seco" id="admRutas">Crear una ruta nueva</button></div>
      <div id="formRuta" hidden class="tarjeta" style="margin-top:12px"><div class="tarjeta-cuerpo">
        <label for="rn">Nombre de la ruta</label><input id="rn" type="text" placeholder="Escuela de hombría, módulo 1">
        <div class="par"><div><label for="rt">Tipo</label>
          <select id="rt"><option value="libertad">Ruta de libertad</option>
            <option value="formacion">Formación</option><option value="otro">Otra</option></select></div>
          <div><label for="rm">¿Quién marca los pasos?</label>
          <select id="rm"><option value="false">Su líder (cuenta como cuidado)</option>
            <option value="true">La persona misma (escuela)</option></select></div></div>
        <label for="rd">Descripción</label><input id="rd" type="text">
        <div style="margin-top:16px"><button class="btn" id="guardarRuta">Crear ruta</button></div>
      </div></div>`;

  app.innerHTML = html;

  document.getElementById('sel').onchange = e => { S.procPersona = e.target.value; S.rutaAbierta = null; ir('procesos'); };

  app.querySelectorAll('[data-ruta]').forEach(b => {
    const abrir = () => { S.rutaAbierta = S.rutaAbierta === b.dataset.ruta ? null : b.dataset.ruta; ir('procesos'); };
    b.onclick = abrir;
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(); } };
  });

  const casilla = document.getElementById('cuenta');
  if (casilla) casilla.onchange = e => { S.contarEncuentro = e.target.checked; };

  app.querySelectorAll('[data-paso]').forEach(b => b.onclick = () => {
    const r = (rutas || []).find(x => x.id === b.dataset.ruta2);
    marcarPaso(quien, b.dataset.paso, b.dataset.est, r, primero);
  });

  app.querySelectorAll('[data-nuevopaso]').forEach(b => b.onclick = async () => {
    const id = b.dataset.nuevopaso;
    const nombre = document.getElementById('np-'+id).value.trim();
    if (!nombre) return avisar('Ponle nombre al paso.', true);
    b.disabled = true;
    const { error } = await SB.from('pasos').insert({
      ruta_id:id, nombre,
      descripcion: document.getElementById('nd-'+id).value.trim() || null,
      orden: Number(b.dataset.orden) });
    if (error){ avisar(error.message, true); b.disabled = false; return; }
    avisar('Paso agregado.');
    ir('procesos');
  });

  app.querySelectorAll('[data-borrarruta]').forEach(b => b.onclick = async () => {
    if (!confirm(`¿Eliminar la ruta «${b.dataset.nomruta}»? Se van sus pasos y los avances de todos.`)) return;
    const { error } = await SB.from('rutas').delete().eq('id', b.dataset.borrarruta);
    if (error) return avisar(error.message, true);
    avisar('Ruta eliminada.'); ir('procesos');
  });
  app.querySelectorAll('[data-borrarpaso]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Eliminar este paso? Se van los avances que tenga marcados.')) return;
    const { error } = await SB.from('pasos').delete().eq('id', b.dataset.borrarpaso);
    if (error) return avisar(error.message, true);
    avisar('Paso eliminado.'); ir('procesos');
  });
  app.querySelectorAll('[data-auto]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('rutas').update({ auto_marca: b.dataset.val === 'true' }).eq('id', b.dataset.auto);
    if (error) return avisar(error.message, true);
    avisar(b.dataset.val === 'true' ? 'Ahora la persona marca sus propios pasos.' : 'Ahora los marca su líder.');
    ir('procesos');
  });

  const ar = document.getElementById('admRutas');
  if (ar) ar.onclick = () => {
    const f = document.getElementById('formRuta');
    f.hidden = !f.hidden;
    ar.textContent = f.hidden ? 'Crear una ruta nueva' : 'Cancelar';
  };
  const gr = document.getElementById('guardarRuta');
  if (gr) gr.onclick = async () => {
    const nombre = document.getElementById('rn').value.trim();
    if (!nombre) return avisar('Ponle nombre a la ruta.', true);
    gr.disabled = true;
    const { error } = await SB.from('rutas').insert({
      nombre, tipo: document.getElementById('rt').value,
      auto_marca: document.getElementById('rm').value === 'true',
      descripcion: document.getElementById('rd').value.trim() || null,
      orden: (rutas || []).length + 1 });
    if (error){ avisar(error.message, true); gr.disabled = false; return; }
    avisar('Ruta creada. Ábrela para agregarle pasos.');
    ir('procesos');
  };
}

async function marcarPaso(personaId, pasoId, estado, ruta, primero, volverA){
  const { data:ya } = await SB.from('avances').select('id,estado')
    .eq('persona_id', personaId).eq('paso_id', pasoId).maybeSingle();

  let error, quitado = false;
  if (ya && ya.estado === estado){
    ({ error } = await SB.from('avances').delete().eq('id', ya.id));
    quitado = true;
  } else if (ya){
    ({ error } = await SB.from('avances')
      .update({ estado, fecha:hoy(), registrado_por:S.yo.persona_id, actualizado_en:new Date().toISOString() })
      .eq('id', ya.id));
  } else {
    ({ error } = await SB.from('avances').insert({
      persona_id:personaId, paso_id:pasoId, estado, registrado_por:S.yo.persona_id }));
  }
  if (error) return avisar(error.message, true);

  // Un paso de escuela lo marca la persona sola: hizo el proceso,
  // nadie se sentó con ella. Uno acompañado lo marca su líder
  // después de preguntarle cómo le fue, y eso sí es un encuentro.
  const esEncuentro = !quitado && estado === 'completado' && ruta && !ruta.auto_marca
                      && personaId !== S.yo.persona_id && S.contarEncuentro !== false;

  if (esEncuentro){
    const { data:paso } = await SB.from('pasos').select('nombre').eq('id', pasoId).maybeSingle();
    const { error:e2 } = await SB.from('contactos').insert({
      persona_id:personaId, lider_id:S.yo.persona_id, fecha:hoy(),
      tipo:'reunion', medio:'otro',
      tema:`${ruta.nombre}: ${paso?.nombre || 'un paso'}`,
      resumen:'Registrado al marcar el paso como completado.' });
    avisar(e2 ? 'Paso marcado, pero el encuentro no se guardó: ' + e2.message
              : `Paso marcado y encuentro guardado con ${primero}.`, !!e2);
  } else {
    avisar(quitado ? 'Marca quitada.' : 'Paso marcado.');
  }
  volverA === 'ficha' ? ir('ficha', personaId) : ir('procesos');
}

const TIPOS_MAT = { predica:'Prédica', libro:'Libro', escrito:'Escrito', audio:'Audio', video:'Video', otro:'Otro' };

async function vMaterial(){
  cargando();
  const { data, error } = await SB.from('materiales').select('*').order('creado_en', { ascending:false });
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;
  const puede = V().es_admin || V().ve_todo || V().puede_cuidar;

  let html = cabeza('Material', 'Prédicas, libros y escritos del ministerio',
    puede ? `<button class="btn" id="nuevo">Agregar</button>` : '');

  if (puede) html += `<div id="formNuevo" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <label for="mt">Título</label><input id="mt" type="text">
      <div class="par"><div><label for="mtipo">Tipo</label>
        <select id="mtipo">${Object.entries(TIPOS_MAT).map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select></div>
        <div><label for="mtema">Tema</label><input id="mtema" type="text" placeholder="Integridad, paternidad…"></div></div>
      <div class="par"><div><label for="mautor">Autor</label><input id="mautor" type="text"></div>
        <div><label for="menlace">Enlace</label><input id="menlace" type="url" placeholder="https://"></div></div>
      <div style="margin-top:16px"><button class="btn" id="guardarMat">Guardar material</button></div>
    </div></div>`;

  if (!data.length){
    html += `<div class="vacio"><strong>Todavía no hay material</strong>
      Aquí van a estar las prédicas, los libros y los escritos que los líderes quieran tener a la mano.</div>`;
  } else {
    html += '<div class="tarjeta"><ul class="registro">' + data.map(m => `
      <li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(m.titulo)}</span></span>
        <span class="sub"><span class="sello">${esc(TIPOS_MAT[m.tipo] || m.tipo)}</span>
          ${m.tema ? `<span>${esc(m.tema)}</span>` : ''}${m.autor ? `<span>· ${esc(m.autor)}</span>` : ''}</span>
        <span style="display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap">
        ${m.enlace ? `<a href="${esc(m.enlace)}" target="_blank" rel="noopener"
           style="font-size:14px;font-weight:600">Abrir →</a>` : ''}
        ${puede ? `<button class="btn rojo chico" data-borrarmat="${m.id}">Eliminar</button>` : ''}</span>
      </div></li>`).join('') + '</ul></div>';
  }

  app.innerHTML = html;
  app.querySelectorAll('[data-borrarmat]').forEach(b => b.onclick = async () => {

    const { error } = await SB.from('materiales').delete().eq('id', b.dataset.borrarmat);
    if (error) return avisar(error.message, true);
    avisar('Material eliminado.'); ir('material');
  });
  const n = document.getElementById('nuevo');
  if (n) n.onclick = () => {
    const f = document.getElementById('formNuevo');
    f.hidden = !f.hidden; n.textContent = f.hidden ? 'Agregar' : 'Cancelar';
  };
  const g = document.getElementById('guardarMat');
  if (g) g.onclick = async () => {
    const titulo = document.getElementById('mt').value.trim();
    if (!titulo) return avisar('Ponle un título.', true);
    g.disabled = true;
    const { error } = await SB.from('materiales').insert({
      titulo, tipo:document.getElementById('mtipo').value,
      tema:  document.getElementById('mtema').value.trim()   || null,
      autor: document.getElementById('mautor').value.trim()  || null,
      enlace:document.getElementById('menlace').value.trim() || null,
      creado_por:S.yo.persona_id
    });
    if (error){ avisar(error.message, true); g.disabled = false; return; }
    avisar('Material guardado.');
    ir('material');
  };
}

async function vMinisterio(){
  cargando();
  const [{ data:todos, error }, { data:fichas }, { data:areas }] = await Promise.all([
    SB.from('estado_cuidado').select('*').order('dias', { ascending:false }),
    SB.from('ficha_persona').select('id,nombre,rango'),
    SB.from('areas').select('*').eq('activa', true).order('nombre')
  ]);
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;

  const n = e => todos.filter(p => p.situacion === e).length;
  const lideres = (fichas || []).filter(f => f.rango === 'escudero' || f.rango === 'caballero')
                                .sort((a,b) => a.nombre.localeCompare(b.nombre,'es'));

  let html = cabeza('Ministerio', `${todos.length} hombres registrados`,
    V().es_admin ? `<button class="btn" id="nuevo">Agregar hombre</button>` : '');

  html += cifras([
    { icono:'ministerio', color:'azul',  valor:todos.length,      texto:'en total' },
    { icono:'reloj',      color:'verde', valor:n('cuidado'),      texto:'cuidados' },
    { icono:'alerta',     color:'ambar', valor:n('en alerta'),    texto:'en alerta' },
    { icono:'corte',      color:'barro', valor:n('desconectado'), texto:'desconectados' }
  ]);

  if (V().es_admin) html += `<div id="formNuevo" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="par"><div><label for="pn">Nombre</label><input id="pn" type="text" placeholder="Como lo llaman"></div>
        <div><label for="pdoc">Cédula</label><input id="pdoc" type="text" inputmode="numeric" placeholder="Opcional"></div></div>
      <div class="par"><div><label for="pc">Correo</label><input id="pc" type="email" placeholder="Con este entra"></div>
        <div><label for="pt">Celular</label><input id="pt" type="text" inputmode="numeric"></div></div>
      <div class="par"><div><label for="pr">Rango</label>
        <select id="pr"><option value="paje">Paje</option><option value="escudero">Escudero</option><option value="caballero">Caballero</option></select></div>
        <div><label for="pl">¿Quién lo cuida?</label>
        <select id="pl">${lideres.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select></div></div>
      <label for="pa">Área</label>
      <select id="pa"><option value="">Ninguna por ahora</option>${(areas||[]).map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select>
      <div style="margin-top:16px"><button class="btn" id="guardarP">Guardar</button></div>
    </div></div>`;

  html += `<div class="tarjeta"><ul class="registro">${todos.map(fila).join('')}</ul></div>`;
  app.innerHTML = html; enlazarFilas();

  const nb = document.getElementById('nuevo');
  if (nb) nb.onclick = () => {
    const f = document.getElementById('formNuevo');
    f.hidden = !f.hidden; nb.textContent = f.hidden ? 'Agregar hombre' : 'Cancelar';
  };

  const g = document.getElementById('guardarP');
  if (g) g.onclick = async () => {
    const nombre = document.getElementById('pn').value.trim();
    if (!nombre) return avisar('Falta el nombre.', true);
    g.disabled = true; g.textContent = 'Guardando…';

    const { data:creada, error:e1 } = await SB.from('personas').insert({
      nombre,
      documento: document.getElementById('pdoc').value.trim() || null,
      correo:    document.getElementById('pc').value.trim()   || null,
      celular:   document.getElementById('pt').value.trim()   || null
    }).select('id').single();
    if (e1){ avisar('No se pudo crear: ' + e1.message, true); g.disabled = false; g.textContent = 'Guardar'; return; }

    const { error:e2 } = await SB.from('rangos').insert({
      persona_id:creada.id, rango:document.getElementById('pr').value, asignado_por:S.yo.persona_id });
    if (e2){ avisar('Quedó creado, pero sin rango: ' + e2.message, true); g.disabled = false; g.textContent = 'Guardar'; return; }

    const { error:e3 } = await SB.from('coberturas').insert({
      persona_id:creada.id, lider_id:document.getElementById('pl').value, asignado_por:S.yo.persona_id });
    if (e3){ avisar('Quedó creado, pero sin líder: ' + e3.message, true); g.disabled = false; g.textContent = 'Guardar'; return; }

    const area = document.getElementById('pa').value;
    if (area) await SB.from('persona_area').insert({ persona_id:creada.id, area_id:area });

    avisar(`${nombre.split(' ')[0]} quedó registrado.`);
    ir('ministerio');
  };
}
