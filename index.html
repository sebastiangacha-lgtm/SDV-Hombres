<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --fondo:#EEF2EC; --fondo2:#F7F9F5;
  --panel:rgba(255,255,255,.72); --panel-solido:#FFFFFF;
  --alto:rgba(255,255,255,.55); --velo:rgba(22,32,22,.045);
  --linea:rgba(22,40,24,.10); --linea-suave:rgba(22,40,24,.055);
  --texto:#141A13; --suave:#555D52; --tenue:#838B7F;
  --verde:#0A8E5E; --verde-vivo:#0FBF81; --verde-tenue:rgba(15,191,129,.13);
  --marca-verde:#0FBF81; --marca-teal:#2A6067;
  --ambar:#8A6511; --ambar-tenue:rgba(190,146,38,.16);
  --barro:#9C4028; --barro-tenue:rgba(156,64,40,.13);
  --azul:#34608F;  --azul-tenue:rgba(52,96,143,.13);
  --sombra:0 1px 2px rgba(18,32,20,.05), 0 8px 24px -10px rgba(18,32,20,.14);
  --sombra-alta:0 2px 6px rgba(18,32,20,.07), 0 24px 56px -18px rgba(18,32,20,.26);
  --r:22px; --r-med:15px; --r-chico:11px;
  --brinco:cubic-bezier(.22,1,.36,1);
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}
:root[data-tema="oscuro"]{
  --fondo:#0C100B; --fondo2:#141A13;
  --panel:rgba(30,38,29,.62); --panel-solido:#1A211A;
  --alto:rgba(255,255,255,.07); --velo:rgba(255,255,255,.04);
  --linea:rgba(255,255,255,.10); --linea-suave:rgba(255,255,255,.055);
  --texto:#EBEFE8; --suave:#9BA596; --tenue:#737C6F;
  --verde:#2FD39A; --verde-vivo:#0FBF81; --verde-tenue:rgba(47,211,154,.16);
  --marca-verde:#0FBF81; --marca-teal:#54909A;
  --ambar:#D4AB58; --ambar-tenue:rgba(212,171,88,.16);
  --barro:#CB6B53; --barro-tenue:rgba(203,107,83,.16);
  --azul:#86ADD8;  --azul-tenue:rgba(134,173,216,.15);
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  --sombra-alta:0 2px 8px rgba(0,0,0,.4), 0 28px 60px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--texto);
  font-family:var(--sans);
  font-size:15.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 12% -5%,  var(--verde-tenue), transparent 60%),
    radial-gradient(900px 600px at 95% 8%,    var(--azul-tenue),  transparent 55%),
    radial-gradient(800px 800px at 70% 105%,  var(--ambar-tenue), transparent 60%),
    linear-gradient(170deg, var(--fondo2), var(--fondo));
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde-vivo);outline-offset:2px;border-radius:8px}
a{color:var(--verde);text-decoration-color:color-mix(in srgb, var(--verde) 35%, transparent)}

/* ============================================================
   Movimiento — una entrada por pantalla, nada más
   ============================================================ */
@keyframes surgir{ from{opacity:0;transform:translateY(14px) scale(.985)} to{opacity:1;transform:none} }
@keyframes asomar{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes aparecer{ from{opacity:0} to{opacity:1} }

#app > *{animation:surgir .5s var(--brinco) both}
#app > *:nth-child(1){animation-delay:0s}
#app > *:nth-child(2){animation-delay:.045s}
#app > *:nth-child(3){animation-delay:.085s}
#app > *:nth-child(4){animation-delay:.12s}
#app > *:nth-child(5){animation-delay:.15s}
#app > *:nth-child(n+6){animation-delay:.175s}

@media (prefers-reduced-motion: reduce){
  *,#app > *{animation:none!important;transition:none!important}
}

/* ============================================================
   Estructura
   ============================================================ */
.lado{display:none}
.principal{padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.lienzo{max-width:1020px;margin:0 auto}

@media (min-width:960px){
  .lado{
    display:flex;flex-direction:column;position:fixed;inset:12px auto 12px 12px;width:242px;
    background:var(--panel);
    -webkit-backdrop-filter:blur(26px) saturate(170%); backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--linea);border-radius:var(--r);
    padding:20px 12px 12px;z-index:30;box-shadow:var(--sombra);
  }
  .principal{margin-left:266px;padding:0 30px 60px}
  .barra{display:none}
}

.marca{display:flex;align-items:center;gap:11px;padding:0 10px 20px}
/* El logo va suelto, sin caja de color: es la marca misma, no un
   icono dentro de un cuadro. */
.marca-sello{
  width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--marca-verde);
}
.marca-sello svg{width:34px;height:34px;stroke:none;fill:currentColor}
.marca b{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.1;display:block}
.marca span{font-size:11.5px;color:var(--tenue);display:block;line-height:1.2}

/* ---------- quién soy y en qué rol estoy ---------- */
.yo-caja{
  border:1px solid var(--linea-suave);border-radius:var(--r-chico);
  padding:10px;margin:0 0 16px;background:var(--velo);
}
.yo-caja.previendo{
  border-color:color-mix(in srgb, var(--ambar) 45%, transparent);
  background:var(--ambar-tenue);
}
.yo-fila{display:flex;align-items:center;gap:9px;min-width:0}
.yo-fila .inicial{width:30px;height:30px;font-size:12px}
.yo-fila div{min-width:0;flex:1}
.yo-fila b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yo-rol{
  display:block;font-size:11.5px;font-weight:600;color:var(--verde);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.yo-caja.previendo .yo-rol{color:var(--ambar)}
.yo-caja select{margin-top:9px;font-size:12.5px;padding:7px 9px}
.yo-aviso{
  display:block;margin-top:7px;font-size:11.5px;line-height:1.4;
  color:var(--ambar);font-weight:600;
}

/* ---------- acordeón ---------- */
.grupo-nav{margin-bottom:4px}
.grupo-nav > p{
  font-size:10.5px;font-weight:700;color:var(--tenue);
  letter-spacing:.07em;margin:0 0 5px;padding:0 10px;
}
.grupo-nav > summary{
  display:flex;align-items:center;gap:10px;
  list-style:none;cursor:pointer;border-radius:var(--r-chico);
  padding:9px 10px;color:var(--suave);font-size:14.5px;font-weight:500;
  transition:background .22s var(--brinco), color .22s var(--brinco);
}
.grupo-nav > summary::-webkit-details-marker{display:none}
.grupo-nav > summary:hover{background:var(--velo);color:var(--texto)}
.grupo-nav > summary svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 auto}
.grupo-nav > summary .flecha{
  margin-left:auto;width:14px;height:14px;opacity:.55;
  transition:transform .22s var(--brinco);
}
.grupo-nav[open] > summary{color:var(--texto)}
.grupo-nav[open] > summary .flecha{transform:rotate(90deg)}
/* El grupo que tiene la página abierta se marca aunque esté plegado */
.grupo-nav.aqui > summary{color:var(--verde);font-weight:600}
.grupo-nav .dentro{padding:2px 0 6px 12px;margin-left:8px;border-left:1px solid var(--linea-suave)}
.grupo-nav .dentro button, .grupo-nav .dentro a{font-size:14px;padding:8px 10px}

/* Lo que se puede abrir en otra pestaña va como enlace de verdad,
   no como botón: así el navegador ofrece «abrir en pestaña nueva»,
   el clic con rueda funciona y se puede copiar la dirección. */
a.fila, a.pcard, a.ccard, .grupo-nav a, .barra a{ text-decoration:none;color:inherit }
a.fila{display:block;box-sizing:border-box}
a.pcard, a.ccard{display:flex}
a.pcard:visited, a.ccard:visited, a.fila:visited{color:inherit}

/* ============================================================
   La escuela
   ============================================================ */
.ccards{display:grid;gap:12px}
@media (min-width:720px){.ccards{grid-template-columns:1fr 1fr}}
.ccard{
  display:flex;flex-direction:column;background:var(--panel-solido);border:1px solid var(--linea);
  border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;
  transition:transform .22s var(--brinco), box-shadow .22s var(--brinco), border-color .22s;
}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--sombra);border-color:var(--verde)}
.ccard-img{
  display:block;height:112px;background-size:cover;background-position:center;
  background-color:var(--alto);display:grid;place-items:center;
}
.ccard-sin svg{width:30px;height:30px;stroke:var(--tenue);fill:none;stroke-width:1.5}
.ccard-cuerpo{display:block;padding:13px 15px 15px}
.ccard-alto{display:flex;align-items:flex-start;gap:9px;margin-bottom:5px}
.ccard-nom{flex:1;font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.25}
.ccard-desc{
  display:block;font-size:13.5px;color:var(--suave);line-height:1.5;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ccard-pie{display:flex;gap:5px;flex-wrap:wrap;font-size:12.5px;color:var(--tenue)}
.ccard .barra-prog{margin-top:10px}
.prog-desc{margin:0 0 12px;font-size:14.5px;color:var(--suave);line-height:1.55}
.prog-ritmo{
  margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ambar);
  background:var(--ambar-tenue);padding:8px 11px;border-radius:var(--r-chico);
}

/* ---------- la clase ---------- */
.marco-video{
  position:relative;width:100%;aspect-ratio:16/9;background:#000;
  border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--sombra);
}
.marco-video iframe,.marco-video > div{position:absolute;inset:0;width:100%;height:100%;border:0}
.progreso-clase{display:flex;align-items:center;gap:11px;margin-bottom:7px}
.progreso-clase .barra-prog{flex:1;margin:0}
.progreso-clase span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--verde)}
.estado-clase{margin:0 0 20px;font-size:13.5px;color:var(--suave)}
.estado-clase.ok{color:var(--verde);font-weight:600}
.estado-clase.aviso-ritmo{color:var(--ambar);font-weight:600}
.clase-num{
  width:25px;height:25px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--alto);color:var(--suave);
}
.clase-num.hecha{background:var(--verde-tenue);color:var(--verde)}
.sesion-marcas{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

/* ---------- el quiz ---------- */
.num-preg{margin:0 0 5px;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--tenue);text-transform:uppercase}
.enunciado{margin:0 0 14px;font-family:var(--serif);font-size:18px;line-height:1.4}
.opciones-quiz{display:grid;gap:8px}
.op-quiz{
  display:block;width:100%;text-align:left;padding:13px 15px;cursor:pointer;
  background:var(--panel-solido);border:1.5px solid var(--linea);border-radius:var(--r-chico);
  font-size:15px;color:var(--texto);transition:all .18s var(--brinco);
}
.op-quiz:hover{border-color:var(--verde);background:var(--velo)}
.op-quiz[aria-pressed=true]{border-color:var(--verde);background:var(--verde-tenue);color:var(--verde);font-weight:600}
.ayuda-quiz{margin:9px 0 0;font-size:12.5px;color:var(--tenue)}
.op-lista{display:flex;gap:9px;padding:7px 0;font-size:14.5px;color:var(--suave);align-items:flex-start}
.op-lista.buena{color:var(--verde);font-weight:600}
.op-lista span:first-child{width:14px;flex:0 0 auto;text-align:center}

/* ---------- cómo le fue ---------- */
.remate.bien{border-color:color-mix(in srgb, var(--verde) 45%, transparent)}
.remate.falta{border-color:color-mix(in srgb, var(--ambar) 45%, transparent)}
.nota-grande{
  margin:0;font-size:68px;font-weight:800;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.remate.bien .nota-grande{color:var(--verde)}
.remate.falta .nota-grande{color:var(--ambar)}
.nota-pie{margin:8px 0 0;font-size:13.5px;color:var(--tenue)}
.remate-texto{margin:16px auto 18px;max-width:430px;font-size:15.5px;line-height:1.6;color:var(--suave)}

/* ---------- el certificado ---------- */
.diploma{
  background:var(--panel-solido);border:1px solid var(--linea);border-radius:var(--r);
  padding:50px 36px;text-align:center;margin-bottom:18px;box-shadow:var(--sombra);
  background-image:radial-gradient(540px 300px at 50% 0%, var(--verde-tenue), transparent 70%);
}
.diploma-sello{display:block;width:52px;height:52px;margin:0 auto 20px;color:var(--marca-verde)}
.diploma-sello svg{width:52px;height:52px;fill:currentColor;stroke:none}
.diploma-iglesia{margin:0 0 26px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.diploma-linea{margin:0;font-size:14px;color:var(--suave)}
.diploma-nombre{margin:9px 0 18px;font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.diploma-curso{margin:9px 0 26px;font-family:var(--serif);font-size:25px;font-weight:600;color:var(--verde)}
.diploma-fecha{margin:0;font-size:13.5px;color:var(--suave)}
.diploma-codigo{margin:7px 0 0;font-size:11px;letter-spacing:.14em;color:var(--tenue);font-variant-numeric:tabular-nums}

@media print{
  .lado,.barra,.no-imprimir,.aviso{display:none !important}
  .principal{margin:0 !important;padding:0 !important}
  body{background:#fff}
  .diploma{border:2px solid #0FBF81;box-shadow:none;background-image:none;page-break-inside:avoid}
}
/* Si la barra se queda corta, que ruede ella y no la página */
.nav-rollo{overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -4px;padding:0 4px}
.nav-rollo::-webkit-scrollbar{width:5px}
.nav-rollo::-webkit-scrollbar-thumb{background:var(--linea);border-radius:3px}
.grupo-nav button, .grupo-nav .dentro a{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-radius:var(--r-chico);
  padding:9px 10px;cursor:pointer;color:var(--suave);
  font-size:14.5px;font-weight:500;text-align:left;
  transition:background .22s var(--brinco), color .22s var(--brinco);
}
.grupo-nav button:hover, .grupo-nav .dentro a:hover{background:var(--velo);color:var(--texto)}
.grupo-nav button[aria-current=page], .grupo-nav .dentro a[aria-current=page]{
  background:var(--verde-tenue);color:var(--verde);font-weight:600;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--verde) 18%, transparent);
}
.grupo-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 auto}

.pie-lado{margin-top:auto;border-top:1px solid var(--linea-suave);padding-top:11px;display:flex;align-items:center;gap:6px}
.quien{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;
  background:none;border:0;border-radius:var(--r-chico);padding:8px 10px;cursor:pointer;text-align:left;
  transition:background .22s var(--brinco);
}
.quien:hover{background:var(--velo)}
.inicial{
  width:33px;height:33px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
}
.quien div{min-width:0}
/* En oscuro el verde se aclara, así que lo que va encima debe oscurecerse */
:root[data-tema="oscuro"] .inicial{color:#0B0F0A}
:root[data-tema="oscuro"] .btn{color:#0B0F0A}
:root[data-tema="oscuro"] .btn.seco{color:var(--texto)}
:root[data-tema="oscuro"] .btn.rojo{color:var(--barro)}
:root[data-tema="oscuro"] .chip[aria-pressed=true]{color:#0B0F0A}
:root[data-tema="oscuro"] .cal-celda.hoy{color:#0B0F0A}
:root[data-tema="oscuro"] .grada-punto.actual .grada-bola{color:#0B0F0A}
:root[data-tema="oscuro"] .paso.hecho .paso-num{color:#0B0F0A}

.quien b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quien span{display:block;font-size:11.5px;color:var(--tenue)}

/* ============================================================
   Encabezado
   ============================================================ */
.cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 18px;flex-wrap:wrap}
.cabeza h1{
  font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.08;margin:0;
  letter-spacing:-.018em;
}
.cabeza p{margin:6px 0 0;color:var(--suave);font-size:14.5px}
.cabeza-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tema{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-chico);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--suave);
  transition:transform .3s var(--brinco), color .2s;
}
.tema:hover{color:var(--texto);transform:rotate(25deg)}
.tema svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ============================================================
   Widgets
   ============================================================ */
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:16px}
@media (min-width:720px){ .rejilla{grid-template-columns:repeat(4,minmax(0,1fr))} }
.ancho2{grid-column:span 2}
@media (min-width:720px){ .ancho2{grid-column:span 2} }

.wid{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(165%); backdrop-filter:blur(22px) saturate(165%);
  box-shadow:var(--sombra);padding:16px 17px;position:relative;overflow:hidden;
}
.wid::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.28), transparent 42%);
}
:root[data-tema="oscuro"] .wid::after{background:linear-gradient(160deg, rgba(255,255,255,.07), transparent 42%)}

.cifra-icono{
  width:31px;height:31px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;
}
.cifra-icono svg{width:16px;height:16px;fill:none;stroke-width:1.9}
.wid b.num{display:block;font-size:31px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wid span.pie{display:block;font-size:12.5px;color:var(--suave);margin-top:6px}
.i-verde{background:var(--verde-tenue)}  .i-verde svg{stroke:var(--verde)}
.i-ambar{background:var(--ambar-tenue)}  .i-ambar svg{stroke:var(--ambar)}
.i-barro{background:var(--barro-tenue)}  .i-barro svg{stroke:var(--barro)}
.i-azul{background:var(--azul-tenue)}    .i-azul svg{stroke:var(--azul)}

/* ---------- calendario ---------- */
.cal-alto{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.cal-alto h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;text-transform:capitalize}
.cal-nav{display:flex;gap:4px}
.cal-nav button{
  width:27px;height:27px;border-radius:8px;border:1px solid var(--linea);background:var(--alto);
  cursor:pointer;color:var(--suave);display:grid;place-items:center;font-size:13px;line-height:1;
  transition:background .2s var(--brinco);
}
.cal-nav button:hover{background:var(--velo);color:var(--texto)}
.cal-rejilla{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dia-nom{
  text-align:center;font-size:10px;font-weight:700;color:var(--tenue);
  padding-bottom:5px;text-transform:uppercase;
}
.cal-celda{
  position:relative;height:33px;display:grid;place-items:center;border-radius:9px;
  font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--suave);border:0;background:none;
  cursor:default;padding:0;
}
.cal-celda.fuera{color:var(--tenue);opacity:.35}
.cal-celda.hoy{background:var(--verde);color:#fff;font-weight:700}
.cal-celda.tiene{cursor:pointer;font-weight:700;color:var(--texto)}
.cal-celda.tiene:hover{background:var(--velo)}
.cal-celda.tiene.hoy:hover{background:var(--verde-vivo)}
.cal-celda i{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--verde-vivo);
}
.cal-celda.hoy i{background:#fff}
.cal-pie{margin-top:11px;font-size:12.5px;color:var(--suave);min-height:18px}

/* ---------- versículo ---------- */
.verso{
  background:
    radial-gradient(420px 220px at 85% 0%, var(--verde-tenue), transparent 70%),
    var(--panel);
  display:flex;flex-direction:column;justify-content:center;
}
.mitad{grid-column:1 / -1}
@media (min-width:720px){ .mitad{grid-column:span 2} }
.verso .etq{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--verde);
  text-transform:uppercase;display:block;margin-bottom:9px;
}
.verso p{
  font-family:var(--serif);font-size:19px;line-height:1.45;margin:0;letter-spacing:-.005em;
}
.verso cite{
  display:block;margin-top:11px;font-size:13px;font-style:normal;font-weight:600;color:var(--suave);
}
.verso .tema-v{font-size:11.5px;color:var(--tenue);font-weight:500}

/* ============================================================
   Tarjetas
   ============================================================ */
.tarjeta{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(165%); backdrop-filter:blur(22px) saturate(165%);
  box-shadow:var(--sombra);margin-bottom:15px;overflow:hidden;
}
.tarjeta-alto{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 19px;border-bottom:1px solid var(--linea-suave);flex-wrap:wrap;
}
.tarjeta-alto h2{font-family:var(--serif);font-size:18.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.tarjeta-cuerpo{padding:18px 19px}

.registro{list-style:none;margin:0;padding:0}
.fila{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--linea-suave);padding:14px 19px;cursor:pointer;
  transition:background .2s var(--brinco);
}
.fila:first-child{border-top:0}
.fila:hover{background:var(--velo)}
.fila-alto{display:flex;align-items:baseline;gap:12px}
.nombre{
  font-family:var(--serif);font-size:19.5px;font-weight:500;flex:1;min-width:0;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em;
}
.cuenta{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.cuenta small{font-size:11px;font-weight:500;margin-left:3px;color:var(--tenue)}
.cuenta.v-cuidado{color:var(--verde)} .cuenta.v-alerta{color:var(--ambar)} .cuenta.v-desconectado{color:var(--barro)}
.sub{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:13px;color:var(--suave);flex-wrap:wrap}
.marca-est{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.m-cuidado{background:var(--verde-tenue);color:var(--verde)}
.m-alerta{background:var(--ambar-tenue);color:var(--ambar)}
.m-desconectado{background:var(--barro-tenue);color:var(--barro)}

.medida{display:block;position:relative;height:4px;margin-top:10px;background:var(--linea-suave);border-radius:3px}
.medida i{position:absolute;inset:0 auto 0 0;border-radius:3px;display:block;animation:crecer .7s var(--brinco) both}
@keyframes crecer{ from{width:0 !important} }
.medida b{position:absolute;top:-2px;width:1px;height:8px;background:var(--linea)}
.medida.v-cuidado i{background:var(--verde)} .medida.v-alerta i{background:var(--ambar)} .medida.v-desconectado i{background:var(--barro)}

.vacio{
  border:1px dashed var(--linea);border-radius:var(--r);background:var(--panel);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  padding:36px 22px;text-align:center;color:var(--suave);font-size:14.5px;line-height:1.6;margin-bottom:15px;
}
.vacio strong{display:block;color:var(--texto);font-size:18px;font-weight:600;margin-bottom:7px;font-family:var(--serif)}

/* ============================================================
   Personas
   ============================================================ */
.buscador{position:relative;margin-bottom:12px}
.buscador input[type=text]{
  padding:11px 40px 11px 42px;font-size:15.5px;height:46px;border-radius:var(--r-med);
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
}
.buscador svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:2;
  width:17px;height:17px;stroke:var(--tenue);fill:none;stroke-width:2;pointer-events:none;
}
.buscador .limpiar{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:2;
  background:none;border:0;cursor:pointer;color:var(--tenue);font-size:17px;
  width:30px;height:30px;border-radius:50%;line-height:1;
}
.buscador .limpiar:hover{background:var(--velo);color:var(--texto)}

.wid.tocable{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;
  transition:transform .22s var(--brinco), box-shadow .22s var(--brinco), border-color .2s}
.wid.tocable:hover{transform:translateY(-2px);box-shadow:var(--sombra-alta)}
.wid.tocable[aria-pressed=true]{
  border-color:currentColor;box-shadow:var(--sombra-alta), inset 0 0 0 1px currentColor;
}

.avanzada{
  display:grid;gap:0 14px;grid-template-columns:1fr;
}
@media (min-width:560px){ .avanzada{grid-template-columns:1fr 1fr} }
@media (min-width:900px){ .avanzada{grid-template-columns:repeat(3,1fr)} }

.conteo-res{font-size:13px;color:var(--suave);margin:0 0 12px;padding:0 2px}

.personas{
  display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  margin-bottom:16px;
}
.pcard{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(20px) saturate(165%); backdrop-filter:blur(20px) saturate(165%);
  box-shadow:var(--sombra);padding:16px 16px 15px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;
  transition:transform .22s var(--brinco), box-shadow .22s var(--brinco);
  animation:surgir .42s var(--brinco) both;
}
.pcard::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.26), transparent 44%);
}
:root[data-tema="oscuro"] .pcard::after{background:linear-gradient(160deg, rgba(255,255,255,.06), transparent 44%)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.pcard-alto{display:flex;align-items:center;gap:11px}
.pcard-ini{
  width:40px;height:40px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
}
:root[data-tema="oscuro"] .pcard-ini{color:#0B0F0A}
.pcard-ini.e-alerta{background:linear-gradient(145deg,#D9B35C,var(--ambar))}
.pcard-ini.e-desconectado{background:linear-gradient(145deg,#C9735C,var(--barro))}
.pcard-nom{flex:1;min-width:0}
.pcard-nom b{
  display:block;font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.2;
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pcard-nom span{display:block;font-size:12px;color:var(--tenue);margin-top:1px}
.pcard-fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--suave)}
.pcard-pie{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--tenue);
  border-top:1px solid var(--linea-suave);padding-top:10px;margin-top:auto;
}
.anillo{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.anillo i{
  width:28px;height:4px;border-radius:3px;background:var(--linea-suave);
  position:relative;overflow:hidden;display:inline-block;
}
.anillo i b{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:3px}

/* ============================================================
   Cursos
   ============================================================ */
.cursos{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-bottom:16px}
.ccard{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(20px) saturate(165%); backdrop-filter:blur(20px) saturate(165%);
  box-shadow:var(--sombra);cursor:pointer;text-align:left;overflow:hidden;
  display:flex;flex-direction:column;padding:0;
  transition:transform .22s var(--brinco), box-shadow .22s var(--brinco);
  animation:surgir .42s var(--brinco) both;
}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.ccard-foto{
  height:118px;background-size:cover;background-position:center;position:relative;flex:0 0 auto;
  background-image:linear-gradient(140deg,
    color-mix(in srgb, var(--verde) 30%, var(--panel-solido)),
    color-mix(in srgb, var(--azul) 16%, var(--panel-solido)));
}
.ccard-foto span{
  position:absolute;left:12px;bottom:11px;font-size:10.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:#fff;
  background:rgba(0,0,0,.32);padding:3px 9px;border-radius:7px;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.ccard-cuerpo{padding:14px 16px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.ccard-cuerpo h3{
  font-family:var(--serif);font-size:18px;font-weight:600;margin:0;line-height:1.22;letter-spacing:-.01em;
}
.ccard-cuerpo p{
  font-size:13px;color:var(--suave);margin:0;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ccard-pie{
  display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--tenue);
  border-top:1px solid var(--linea-suave);padding-top:10px;margin-top:auto;
}

.portada{
  height:190px;border-radius:var(--r);margin-bottom:16px;
  background-size:cover;background-position:center;box-shadow:var(--sombra);
  background-image:linear-gradient(140deg,
    color-mix(in srgb, var(--verde) 30%, var(--panel-solido)),
    color-mix(in srgb, var(--azul) 16%, var(--panel-solido)));
}

.sesion{
  display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--linea-suave);
}
.sesion:first-child{border-top:0}
.sesion-n{
  width:26px;height:26px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--verde-tenue);color:var(--verde);margin-top:1px;
}
.sesion-txt{flex:1;min-width:0}
.sesion-txt b{display:block;font-size:15px;font-weight:600}
.sesion-txt span{display:block;font-size:13px;color:var(--tenue);line-height:1.45;margin-top:2px}

.asignar-lista{max-height:280px;overflow-y:auto;margin-top:12px;border:1px solid var(--linea-suave);
  border-radius:var(--r-chico);padding:4px}
.asignar-fila{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;
  transition:background .18s var(--brinco);
}
.asignar-fila:hover{background:var(--velo)}
.asignar-fila input{width:18px;height:18px;accent-color:var(--verde);flex:0 0 auto}
.asignar-fila b{font-size:14.5px;font-weight:600;flex:1;min-width:0}
.asignar-fila span{font-size:12.5px;color:var(--tenue)}

/* ============================================================
   Procesos
   ============================================================ */
.escala{display:flex;align-items:center;padding:4px 0 2px;overflow-x:auto}
.grada-punto{display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 4px;min-width:94px;flex:0 0 auto}
.grada-bola{
  width:32px;height:32px;border-radius:50%;border:2px solid var(--linea);
  background:var(--panel-solido);display:grid;place-items:center;color:var(--tenue);
  font-size:13px;font-weight:700;transition:transform .4s var(--brinco);
}
.grada-punto.hecho .grada-bola{border-color:var(--verde);background:var(--verde-tenue);color:var(--verde)}
.grada-punto.actual .grada-bola{
  border-color:var(--verde);color:#fff;transform:scale(1.12);
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
  box-shadow:0 5px 14px -4px color-mix(in srgb, var(--verde) 60%, transparent);
}
.grada-punto span{font-size:12.5px;color:var(--tenue);font-weight:500}
.grada-punto.hecho span,.grada-punto.actual span{color:var(--texto);font-weight:600}
.grada-raya{width:40px;height:2px;background:var(--linea);flex:0 0 auto;border-radius:2px}
.grada-raya.hecha{background:var(--verde)}

.ruta{border-top:1px solid var(--linea-suave);padding:15px 19px}
.ruta:first-child{border-top:0}
.ruta-alto{display:flex;align-items:center;gap:11px;cursor:pointer}
.ruta-alto h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;flex:1;min-width:0}
.ruta-conteo{font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
.ruta p{font-size:13.5px;color:var(--suave);margin:4px 0 0;line-height:1.5}
.barra-prog{display:block;height:6px;background:var(--linea-suave);border-radius:4px;margin-top:11px;overflow:hidden}
.barra-prog i{display:block;height:100%;border-radius:4px;animation:crecer .7s var(--brinco) both;
  background:linear-gradient(90deg, var(--verde), var(--verde-vivo))}
.pasos{list-style:none;margin:14px 0 0;padding:0}
.paso{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--linea-suave);animation:asomar .35s var(--brinco) both}
.paso-num{
  width:23px;height:23px;border-radius:50%;border:1.5px solid var(--linea);flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--tenue);margin-top:1px;
  transition:background .3s var(--brinco), border-color .3s;
}
.paso.hecho .paso-num{background:var(--verde);border-color:var(--verde);color:#fff}
.paso.curso .paso-num{border-color:var(--ambar);color:var(--ambar)}
.paso-txt{flex:1;min-width:0}
.paso-txt b{display:block;font-size:14.5px;font-weight:600}
.paso.hecho .paso-txt b{color:var(--suave)}
.paso-txt span{display:block;font-size:13px;color:var(--tenue);line-height:1.45;margin-top:1px}
.paso-acc{display:flex;gap:5px;flex:0 0 auto;flex-wrap:wrap}

/* ============================================================
   Hilo
   ============================================================ */
.hilo{list-style:none;margin:0;padding:0}
.anota{border-left:2px solid var(--linea);padding:0 0 18px 15px;position:relative}
.anota:last-child{padding-bottom:0}
.anota::before{content:'';position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--linea)}
.anota.es-reunion::before{background:var(--verde);box-shadow:0 0 0 3px var(--verde-tenue)}

  box-shadow:inset 0 0 0 1px var(--linea-suave)}

/* ============================================================
   Controles
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
  color:#fff;border:0;border-radius:var(--r-chico);
  padding:11px 18px;font-weight:600;font-size:14.5px;cursor:pointer;
  box-shadow:0 3px 10px -3px color-mix(in srgb, var(--verde) 55%, transparent);
  transition:transform .2s var(--brinco), filter .2s, box-shadow .2s;
}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn.ancho{width:100%;padding:13px 18px;font-size:15px}
.btn.seco{background:var(--panel-solido);color:var(--texto);border:1px solid var(--linea);box-shadow:var(--sombra)}
.btn.seco:hover{background:var(--alto);filter:none}
.btn.chico{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.rojo{background:none;color:var(--barro);border:1px solid var(--barro-tenue);box-shadow:none}
.btn.rojo:hover{background:var(--barro-tenue);filter:none}

label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin:15px 0 6px}
.tarjeta-cuerpo label:first-child,form label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],select,textarea{
  width:100%;background:var(--panel-solido);border:1px solid var(--linea);
  border-radius:var(--r-chico);padding:11px 12px;font-size:16px;
  transition:border-color .2s, box-shadow .2s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-tenue);outline:none;
}
textarea{resize:vertical;min-height:88px;line-height:1.5}
.ayuda{font-size:12.5px;color:var(--tenue);margin:7px 0 0;line-height:1.55}
.par{display:grid;gap:0 14px}
@media (min-width:640px){.par{grid-template-columns:1fr 1fr}}

.opciones{display:grid;gap:9px;grid-template-columns:1fr 1fr}
.opcion{

   Barra inferior
   ============================================================ */
.barra{
  position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;

/* ============================================================

  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;

.modal-alto p{margin:7px 0 0;color:var(--suave);font-size:14.5px;line-height:1.55}

.campos-lista{

/* ============================================================
   Tema
   ============================================================ */
function leerTema(){
  try { return localStorage.getItem('tema'); } catch { return null; }
}
function ponerTema(t){
  document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem('tema', t); } catch {}
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', t === 'oscuro' ? '#0F130E' : '#F5F7F3');
}
ponerTema(leerTema() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'));
const girarTema = () => ponerTema(document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro');

/* ============================================================

   ============================================================ */
const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function haceCuanto(d){
  if (d === null || d === undefined) return '';
  if (d <= 0) return 'hoy';
  if (d === 1) return 'ayer';
  if (d < 7)  return `hace ${d} días`;
  if (d < 60) { const s = Math.round(d/7); return `hace ${s} ${s===1?'semana':'semanas'}`; }
  if (d < 365){ const m = Math.round(d/30); return `hace ${m} ${m===1?'mes':'meses'}`; }
  const a = Math.floor(d/365); return `hace ${a} ${a===1?'año':'años'}`;
}
const claseEstado = s => 'v-' + ({'cuidado':'cuidado','en alerta':'alerta','desconectado':'desconectado'}[s] || 'alerta');

function fechaLarga(f){
  if (!f) return '';
  const [a,m,d] = f.split('-').map(Number);
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio',
                 'agosto','septiembre','octubre','noviembre','diciembre'];
  return `${d} de ${meses[m-1]} de ${a}`;
}

function fechaCorta(f){
  if (!f) return '';
  const [a,m,d] = f.split('-').map(Number);
  return `${d} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m-1]} ${a}`;
}
const hoy = () => new Date().toLocaleDateString('en-CA', { timeZone:'America/Bogota' });

const mayus = t => t ? t[0].toUpperCase() + t.slice(1) : '';

function edadDe(f){
  if (!f) return null;
  const h = hoy();
  let e = Number(h.slice(0,4)) - Number(f.slice(0,4));
  if (h.slice(5) < f.slice(5)) e--;
  return e;
}
const iniciales = n => (n||'').split(' ').filter(Boolean).slice(0,2).map(p => p[0]).join('').toUpperCase();

function avisar(texto, mal=false){
  document.querySelectorAll('.aviso').forEach(n => n.remove());

}
const cargando = () => { app.innerHTML = '<p class="cargando">Un momento…</p>'; };

/* ============================================================
   Diálogos
   ============================================================ */
function dialogo({ titulo, texto = '', cuerpo = '', aceptar = 'Aceptar',
                   cancelar = 'Cancelar', peligro = false, ancho = false, alMontar }){
  return new Promise(resolver => {
    const velo = document.createElement('div');
    velo.className = 'velo-modal';
    velo.innerHTML = `<div class="modal ${ancho ? 'ancho' : ''}" role="dialog" aria-modal="true">
      <div class="modal-alto"><h2>${titulo}</h2>${texto ? `<p>${texto}</p>` : ''}</div>
      ${cuerpo ? `<div class="modal-cuerpo">${cuerpo}</div>` : '<div style="height:10px"></div>'}
      <div class="modal-pie">
        ${cancelar ? `<button class="btn seco" data-no>${cancelar}</button>` : ''}
        <button class="btn ${peligro ? 'rojo' : ''}" data-si>${aceptar}</button>
      </div></div>`;
    document.body.appendChild(velo);

    const cerrar = v => { velo.remove(); document.removeEventListener('keydown', tecla); resolver(v); };
    const tecla = e => {
      if (e.key === 'Escape') cerrar(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); aceptarlo(); }
    };
    let leer = () => true;
    const aceptarlo = () => { const v = leer(); if (v !== undefined) cerrar(v); };

    velo.querySelector('[data-si]').onclick = aceptarlo;
    const no = velo.querySelector('[data-no]');
    if (no) no.onclick = () => cerrar(null);
    velo.onclick = e => { if (e.target === velo) cerrar(null); };
    document.addEventListener('keydown', tecla);

    if (alMontar) leer = alMontar(velo) || leer;
    const foco = velo.querySelector('input, select, textarea');
    (foco || velo.querySelector('[data-si]')).focus();
  });
}

const confirmar = (titulo, texto, peligro = true) =>
  dialogo({ titulo, texto, aceptar: peligro ? 'Eliminar' : 'Sí, hazlo', peligro })

const pedirTexto = (titulo, { texto = '', valor = '', marcador = '' } = {}) =>

function engancharBusqueda(id, alEscribir){
  const caja = document.getElementById(id), x = document.getElementById(id + 'X');

}

/* ============================================================
   Arranque
   ============================================================ */
async function arrancar(){
  const { data:{ session } } = await SB.auth.getSession();
  session ? await entrar() : pantallaEntrada();
  SB.auth.onAuthStateChange(e => {
    if (e === 'SIGNED_OUT'){ S.yo = null; lado.hidden = true; barra.hidden = true; pantallaEntrada(); }
  });
}

async function entrar(){
  cargando();
  const { data, error } = await SB.rpc('quien_soy');
  if (error) return app.innerHTML = `<div class="error">No se pudo abrir la sesión: ${esc(error.message)}</div>`;

  if (!data || !data.length){
    app.innerHTML = `<div class="cabeza"><div><h1>Tu correo no está en el ministerio</h1>
      <p>Entraste bien, pero este correo todavía no corresponde a ningún hombre registrado.
         Avísale a quien administra la plataforma para que te agregue.</p></div></div>
      <button class="btn seco" id="salir">Cerrar sesión</button>`;
    document.getElementById('salir').onclick = () => SB.auth.signOut();
    return;
  }

  S.yo = data[0];
  S.procPersona = S.yo.persona_id;
  const { data:gente } = await SB.from('personas').select('id,nombre');
  S.nombres = new Map((gente||[]).map(p => [p.id, p.nombre]));

  // Primer ingreso: la clave de arranque no sirve para quedarse.
  if (S.yo.debe_cambiar_clave) return pantallaCambioClave();

  pintarNav();
  // Si llegó por un enlace directo (una ficha, un evento), se abre
  // eso. Si no, quien cuida a alguien aterriza en el formulario de
  // cuidado y quien todavía no, en el inicio.
  const r = leerDireccion();
  if (r) pintarVista(r.vista, r.arg);
  else   ir(S.yo.a_cargo > 0 ? 'registrar' : 'inicio');
}

/* ============================================================
   Primer ingreso: cambiar la clave de arranque
   ============================================================ */
function pantallaCambioClave(){
  lado.hidden = true; barra.hidden = true;
  document.querySelector('.principal').style.marginLeft = '0';
  app.innerHTML = `
  <div class="entrada">
    <div class="marca"><span class="marca-sello">${I.sello}</span>
      <span><b>Cuidado</b><span>Ministerio de hombres</span></span></div>
    <h1>Ponle tu propia clave</h1>
    <p class="lema">${esc((S.yo.nombre || '').split(' ')[0])}, entraste con la clave de arranque</p>
    <form id="f" novalidate>
      <label for="c1">Clave nueva</label>
      <input id="c1" type="password" autocomplete="new-password">
      <label for="c2">Escríbela otra vez</label>
      <input id="c2" type="password" autocomplete="new-password">
      <div id="err"></div>
      <div style="margin-top:20px"><button class="btn ancho" type="submit" id="b">Guardar y entrar</button></div>
    </form>
    <div style="margin-top:14px"><button class="btn seco ancho" type="button" id="salir">Cerrar sesión</button></div>
  </div>`;

  document.getElementById('salir').onclick = () => SB.auth.signOut();

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const b   = document.getElementById('b');
    const err = document.getElementById('err');
    const c1  = document.getElementById('c1').value;
    const c2  = document.getElementById('c2').value;
    const malo = c1.length < 6                   ? 'La clave necesita al menos 6 caracteres.'
               : c1 !== c2                       ? 'Las dos claves no coinciden.'
               : c1 === CLAVE_ARRANQUE           ? 'Esa es la clave de arranque. Ponle una tuya.'
               : '';
    if (malo) return err.innerHTML = `<div class="error">${malo}</div>`;

    b.disabled = true; b.textContent = 'Guardando…';
    const { error } = await SB.auth.updateUser({ password:c1 });
    if (error){
      err.innerHTML = `<div class="error">No se pudo cambiar: ${esc(error.message)}</div>`;
      b.disabled = false; b.textContent = 'Guardar y entrar';
      return;
    }
    await SB.rpc('clave_cambiada');
    S.yo.debe_cambiar_clave = false;
    pintarNav();
    avisar('Clave cambiada.');
    ir(S.yo.a_cargo > 0 ? 'registrar' : 'inicio');
  };
}

/* ============================================================
   Entrada
   ============================================================ */
function pantallaEntrada(){
  lado.hidden = true; barra.hidden = true;
  document.querySelector('.principal').style.marginLeft = '0';
  app.innerHTML = `
  <div class="entrada">
    <div class="marca"><span class="marca-sello">${I.sello}</span>
      <span><b>Cuidado</b><span>Ministerio de hombres</span></span></div>
    <h1>Entra con tu correo</h1>
    <p class="lema">Semillas de Vida</p>
    <form id="f" novalidate>
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password">
      <div id="err"></div>
      <div style="margin-top:20px"><button class="btn ancho" type="submit" id="b">Entrar</button></div>
    </form>
  </div>`;

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById('b');
    b.disabled = true; b.textContent = 'Entrando…';
    const correoV = document.getElementById('correo').value.trim();
    const claveV  = document.getElementById('clave').value;
    if (!correoV || !claveV){
      document.getElementById('err').innerHTML =
        `<div class="error">${!correoV ? 'Falta el correo.' : 'Falta la contraseña.'}</div>`;
      b.disabled = false; b.textContent = 'Entrar';
      return;
    }
    const { error } = await SB.auth.signInWithPassword({
      email: correoV,
      password: document.getElementById('clave').value
    });
    if (error){
      document.getElementById('err').innerHTML = '<div class="error">El correo o la contraseña no coinciden.</div>';
      b.disabled = false; b.textContent = 'Entrar';
      return;
    }
    document.querySelector('.principal').style.marginLeft = '';
    await entrar();
  };
}

   ============================================================ */
function pintarNav(){
  const mando = V().es_admin || V().ve_todo;
  const cuida = V().puede_cuidar && V().a_cargo > 0;

  // Cada grupo: [titulo, icono del grupo, opciones]
  const grupos = [
    ['Cuidado', 'registrar',
      [...(cuida ? [['registrar','Registrar cuidado']] : []), ['inicio','Inicio'],
       ...(mando ? [['personas','Personas'], ['listas','Listas'],
                    ['nuevaPersona','Registrar persona']] : [])]],
    ['Escuela', 'procesos',
      [['procesos','Cursos y procesos'],
       ...(mando ? [['solicitudes','Solicitudes'], ['revisar','Por revisar']] : [])]],
    ['Encuentros', 'eventos',  [['eventos','Eventos'], ['oracion','Oración']]],
    ['Servicio',   'servicio', [['servicio','Mi servicio']]],
    ['Recursos',   'material', [['material','Material']]],
    ...(mando ? [['Administrar', 'usuarios',
      [['usuarios','Usuarios'], ['permisos','Permisos'],
       ['jerarquias','Jerarquías'], ['fusionar','Fusionar']]]] : [])
  ];

  // El grupo que contiene la vista abierta arranca desplegado.
  const aqui = t => grupos.find(([tt]) => tt === t)[2].some(([v]) => v === S.vista);

  const opciones = rolesDisponibles();
  const previendo = S.rol !== 'real';
  const rolReal = S.yo.es_admin ? 'Súper administrador'
                : S.yo.ve_todo  ? 'Pastor o director'
                : S.yo.a_cargo  ? `Líder · cuida a ${S.yo.a_cargo}`
                : 'Hombre del ministerio';

  const cajaYo = `
    <div class="yo-caja${previendo ? ' previendo' : ''}">
      <button class="yo-fila" data-v="yo" style="background:none;border:0;padding:0;width:100%;cursor:pointer;text-align:left">
        <span class="inicial">${esc(iniciales(S.yo.nombre))}</span>
        <div><b>${esc(S.yo.nombre)}</b>
          <span class="yo-rol">${previendo ? 'Viendo como: ' + esc(ROLES[S.rol]) : esc(rolReal)}</span></div>
      </button>
      ${opciones.length > 2 ? `
        <select id="selrol" aria-label="Cambiar la vista de rol">
          ${opciones.map(r => `<option value="${r}"${r === S.rol ? ' selected' : ''}>${ROLES[r]}</option>`).join('')}
        </select>
        ${previendo ? `<span class="yo-aviso">Estás viendo la plataforma como otro rol. Vuelve a «Mi rol real» para trabajar.</span>` : ''}` : ''}
    </div>`;

  lado.hidden = false;
  lado.innerHTML = `
    <div class="marca"><span class="marca-sello">${I.sello}</span>
      <span><b>Cuidado</b><span>Ministerio de hombres</span></span></div>
    ${cajaYo}
    <div class="nav-rollo">
      ${grupos.map(([t, ic, items]) => `
        <details class="grupo-nav${aqui(t) ? ' aqui' : ''}" data-grupo="${t}">
          <summary>${I[ic]}<span>${t}</span>${I.flecha}</summary>
          <div class="dentro">
            ${items.map(([v,n]) => `<a href="${direccion(v)}" data-v="${v}">${I[v]}<span>${n}</span></a>`).join('')}
          </div>
        </details>`).join('')}
    </div>
    <div class="pie-lado">
      <button class="quien" id="salirSesion" style="flex:1">
        <span class="inicial" style="background:var(--velo);color:var(--suave)">${I.salir}</span>
        <div><b>Cerrar sesión</b><span>${esc((S.yo.nombre || '').split(' ')[0])}</span></div>
      </button>
      <button class="tema" id="btema" title="Cambiar entre claro y oscuro"
        aria-label="Cambiar entre claro y oscuro">${I.luz}</button>
    </div>`;

  const movil = [...(cuida ? [['registrar','Cuidado']] : []), ['inicio','Inicio'],
                 ...(mando ? [['personas','Personas']] : []),
                 ['procesos','Procesos'], ['eventos','Eventos'], ['yo','Yo']];
  barra.hidden = false;
  barra.innerHTML = '<ul>' + movil.map(([v,n]) =>
    `<li><a href="${direccion(v)}" data-v="${v}">${I[v]}<span>${n}</span></a></li>`).join('') + '</ul>';

  // Clic normal: navega sin recargar. Con Ctrl, Cmd o la rueda el
  // navegador se encarga y abre la pestaña nueva, por eso no se toca.
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    ir(b.dataset.v);
  });
  document.getElementById('btema').onclick = girarTema;

  document.getElementById('salirSesion').onclick = async () => {
    if (!await confirmar('¿Cerrar sesión?', 'Vas a tener que entrar otra vez con tu correo y tu clave.', false)) return;
    await SB.auth.signOut();
  };

  // Un clic en el nombre del grupo lo abre, otro lo cierra. Antes se
  // abría al pasar el cursor, y eso hacía que al bajar la mano hacia
  // otro grupo el de arriba se replegara y todo saltara de sitio.
  // Abierto se queda uno solo, para que la barra no se alargue.
  lado.querySelectorAll('.grupo-nav').forEach(d => {
    d.querySelector('summary').onclick = e => {
      e.preventDefault();
      const abrir = !d.open;
      lado.querySelectorAll('.grupo-nav').forEach(o => { o.open = false; });
      d.open = abrir;
    };
  });

  // El grupo donde está la página abierta arranca desplegado: si no,
  // al entrar no se ve en qué renglón se está parado.
  const grupoActivo = lado.querySelector('.grupo-nav.aqui');
  if (grupoActivo) grupoActivo.open = true;

  const sr = document.getElementById('selrol');
  if (sr) sr.onchange = e => { S.rol = e.target.value; pintarNav(); ir('inicio'); };
}

/* Las pantallas de detalle no están en el menú (una ficha, un evento,
   una clase). Para que el menú no quede sin nada marcado al abrirlas
   —sobre todo si se llega por un enlace directo— cada una apunta al
   renglón del que cuelga. */
const PADRE = {
  ficha:'personas', lista:'listas', registrar:'registrar',
  evento:'eventos', area:'servicio', lista_oracion:'oracion',
  bajoSuCargo:'jerarquias', areaGente:'jerarquias',
  curso:'procesos', clase:'procesos', quiz:'procesos', resultado:'procesos',
  certificado:'procesos', cursoAdmin:'procesos', quizEditor:'procesos',
  nuevaLista:'listas'
};

function marcar(v){
  // Si la vista no está en el menú, se marca la de la que cuelga.
  const enMenu = document.querySelector(`.lado [data-v="${v}"]`) ? v : (PADRE[v] || v);
  document.querySelectorAll('[data-v]').forEach(b =>
    b.dataset.v === enMenu ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  // El grupo que contiene la vista abierta se marca en verde, aunque
  // esté plegado. Sin esto el verde se quedaría donde estaba al entrar.
  document.querySelectorAll('.lado .grupo-nav').forEach(d => {
    const suyo = !!d.querySelector(`[data-v="${enMenu}"]`);
    d.classList.toggle('aqui', suyo);
    // Si se navegó a una pantalla de otro grupo (por un enlace o por el
    // botón de atrás), ese grupo se abre y los demás se cierran.
    if (suyo && !d.open){
      document.querySelectorAll('.lado .grupo-nav').forEach(o => { o.open = false; });
      d.open = true;
    }
  });
}

  inicio:vInicio, personas:vPersonas, procesos:vProcesos, material:vMaterial,
  eventos:vEventos, evento:vEvento, servicio:vServicio, area:vArea, curso:vCursoAlumno,

  nuevaPersona:vRegistrarPersona, nuevaLista:vNuevaLista,
  usuarios:vUsuarios, permisos:vPermisos, fusionar:vFusionar,

/* ============================================================
   Direcciones
   ------------------------------------------------------------
   Cada pantalla tiene su propia dirección (#/ficha/<id>). Eso es
   lo que permite abrir un perfil en otra pestaña, mandar un enlace
   por WhatsApp y que el botón de atrás del navegador funcione.
   Sin esto todo vive en la misma URL y no hay nada que abrir aparte.
   ============================================================ */
const direccion = (vista, arg) => {
  const id = typeof arg === 'string' ? arg : (arg && arg.id) || '';
  return '#/' + vista + (id ? '/' + encodeURIComponent(id) : '');
};

function leerDireccion(){
  const h = (location.hash || '').replace(/^#\/?/, '');
  if (!h) return null;
  const [vista, ...resto] = h.split('/');
  if (!VISTAS[vista]) return null;
  return { vista, arg: resto.length ? decodeURIComponent(resto.join('/')) : undefined };
}

// Dónde quedó la pantalla la última vez que se pintó, para saber si
// lo que viene es una pantalla nueva o la misma de nuevo.
let vistaAnterior = null, argAnterior = null;

async function pintarVista(vista, arg){
  if (!S.yo) return;
  const f = VISTAS[vista] || VISTAS.inicio;

  // Repintar la MISMA pantalla casi siempre es «acabo de guardar
  // algo aquí». Saltar al principio en ese caso obliga a bajar otra
  // vez hasta la fila que se acaba de tocar, y en una lista de
  // cuarenta nombres eso la vuelve inservible. Solo se sube cuando
  // de verdad se cambió de pantalla.
  const mismaPantalla = vista === vistaAnterior &&
                        String(arg ?? '') === String(argAnterior ?? '');
  const altura = mismaPantalla ? window.scrollY : 0;

  vistaAnterior = vista; argAnterior = arg;
  S.vista = vista; marcar(vista);
  if (!mismaPantalla) window.scrollTo(0,0);

  await f(arg);

  // Después de pintar, no antes: el contenido tiene que existir para
  // que el navegador pueda bajar hasta donde estaba.
  if (mismaPantalla && altura)
    requestAnimationFrame(() => window.scrollTo(0, altura));
}

function ir(vista, arg){
  const nueva = direccion(vista, arg);
  // El objeto completo (cuando trae más que el id) se guarda aparte:
  // en la dirección solo cabe el id, y si llegan por enlace directo
  // la vista lo vuelve a buscar en la base.
  S.argLargo = (arg && typeof arg === 'object') ? arg : null;
  if (location.hash === nueva) return pintarVista(vista, arg);
  location.hash = nueva;   // el cambio de dirección dispara el pintado
}

window.addEventListener('hashchange', () => {
  const r = leerDireccion();
  if (!r) return;
  const arg = (S.argLargo && S.argLargo.id === r.arg) ? S.argLargo : r.arg;
  S.argLargo = null;
  pintarVista(r.vista, arg);
});

function versoDeHoy(){
  const d = hoy();
  const semilla = Number(d.slice(0,4)) * 372 + Number(d.slice(5,7)) * 31 + Number(d.slice(8,10));
  return VERSOS[semilla % VERSOS.length];
}

/* ============================================================
   Calendario
   ============================================================ */
const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];

function widgetCalendario(eventos){
  const hoyF = hoy();
  const [ha, hm] = [Number(hoyF.slice(0,4)), Number(hoyF.slice(5,7))];
  if (!S.calMes) S.calMes = { a:ha, m:hm };
  const { a, m } = S.calMes;

  const primero = new Date(Date.UTC(a, m-1, 1));
  const dias    = new Date(Date.UTC(a, m, 0)).getUTCDate();
  const arranca = (primero.getUTCDay() + 6) % 7;   // lunes = 0

  const porDia = new Map();
  (eventos || []).forEach(e => {
    if (e.fecha.slice(0,7) === `${a}-${String(m).padStart(2,'0')}`)
      porDia.set(Number(e.fecha.slice(8,10)), e);
  });

  let celdas = '';
  for (let i = 0; i < arranca; i++) celdas += `<span class="cal-celda fuera"></span>`;
  for (let d = 1; d <= dias; d++){
    const f = `${a}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = porDia.get(d);
    celdas += `<${ev ? 'button' : 'span'} class="cal-celda${f === hoyF ? ' hoy' : ''}${ev ? ' tiene' : ''}"
      ${ev ? `data-caldia="${ev.id}" title="${esc(ev.nombre)}"` : ''}>${d}${ev ? '<i></i>' : ''}</${ev ? 'button' : 'span'}>`;
  }

  const delMes = [...porDia.entries()].sort((x,y) => x[0]-y[0]);
  const pie = delMes.length
    ? delMes.slice(0,3).map(([d,e]) => `${d} · ${esc(e.nombre)}`).join('<br>')
    : 'Sin eventos este mes.';

  return `<div class="wid mitad">
    <div class="cal-alto"><h3>${MESES[m-1]} ${a}</h3>
      <div class="cal-nav"><button data-cal="-1" aria-label="Mes anterior">‹</button>
        <button data-cal="0" aria-label="Este mes">·</button>
        <button data-cal="1" aria-label="Mes siguiente">›</button></div></div>
    <div class="cal-rejilla">
      ${['L','M','M','J','V','S','D'].map(d => `<span class="cal-dia-nom">${d}</span>`).join('')}
      ${celdas}
    </div>
    <div class="cal-pie">${pie}</div>
  </div>`;
}

function enlazarCalendario(){
  app.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const paso = Number(b.dataset.cal);
    if (paso === 0){ const h = hoy(); S.calMes = { a:Number(h.slice(0,4)), m:Number(h.slice(5,7)) }; }
    else {
      let { a, m } = S.calMes; m += paso;
      if (m < 1){ m = 12; a--; } if (m > 12){ m = 1; a++; }
      S.calMes = { a, m };
    }
    ir(S.vista);
  });
  app.querySelectorAll('[data-caldia]').forEach(b => b.onclick = () => ir('evento', b.dataset.caldia));
}

      <div style="margin-top:14px"><button class="btn seco chico" data-ir="servicio">Ver mi servicio</button></div></div></div>`;

  if (aperturas && aperturas.length){
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Abrieron una nota tuya</h2></div>
      <div class="tarjeta-cuerpo">${aperturas.map(a => `<p class="ayuda" style="margin:0 0 7px">

        ${esc(a.sobre_quien)} · ${esc(a.motivo)}</p>`).join('')}</div></div>`;
  }

  if (!data.length){
    html += `<div class="vacio"><strong>Todavía no cuidas a nadie</strong>
      Cuando te asignen hombres, aquí vas a ver cómo va cada uno.</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">

    html += `<div class="tarjeta"><ul class="registro">${data.map(fila).join('')}</ul></div>`;

  app.innerHTML = html;
  enlazarFilas(); enlazarCalendario();

}
