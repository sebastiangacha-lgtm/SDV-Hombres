        <div class="par"><div><label for="rr" style="margin-top:0">Rango</label>
          <select id="rr"><option value="paje">Paje</option><option value="escudero">Escudero</option>
            <option value="caballero">Caballero</option></select></div>
          <div><label for="rl" style="margin-top:0">¿Quién lo cuida?</label>
          <select id="rl">${lideres.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select></div></div>
      </div></div>

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px">
      <button class="btn" id="guardarReg">Registrar</button>
      <button class="btn seco" id="cancelarReg">Cancelar</button></div>`;

  app.querySelectorAll('[data-tipo-reg]').forEach(b => b.onclick = () => {
    S.tipoReg = b.dataset.tipoReg; ir('nuevaPersona');
  });
  document.getElementById('cancelarReg').onclick = () => ir('personas');

  document.getElementById('guardarReg').onclick = async () => {
    const g = document.getElementById('guardarReg');
    const val = x => (document.getElementById(x)?.value || '').trim();
    const nombre = val('rn');
    if (!nombre)      return avisar('Falta el nombre.', true);
    if (!val('rcel')) return avisar('Falta el celular.', true);
    if (!val('rnac')) return avisar('Falta la fecha de nacimiento.', true);
    if (!val('rcor') && !(menor && val('acor')))
      return avisar(menor ? 'Falta el correo, o el del acudiente.' : 'Falta el correo.', true);

    if (menor){
      if (!val('an'))    return avisar('Falta el nombre del acudiente.', true);
      if (!val('acel'))  return avisar('Falta el celular del acudiente.', true);
      if (!document.getElementById('aok').checked)
        return avisar('Falta marcar que el acudiente autorizó.', true);
      const e = edadDe(val('rnac'));
      if (e >= 18 && !await confirmar('Esa fecha da ' + e + ' años',
          'Lo estás registrando como menor pero ya es mayor de edad. ¿Sigo de todas formas?', false)) return;
    }

    // ---- ¿ya está? ----
    g.disabled = true; g.textContent = 'Revisando…';
    const { data:choques } = await SB.rpc('posibles_duplicados', {
      p_nombre:nombre, p_correo:val('rcor') || null, p_documento:val('rdoc') || null });
    g.disabled = false; g.textContent = 'Registrar';

    if (choques && choques.length){
      const duro = choques.find(c => c.choca !== 'nombre');
      const c = duro || choques[0];
      const donde = c.lider ? ` (lo cuida ${c.lider})` : '';

      if (duro){
        // Correo y cédula identifican de verdad: aquí se para.
        const esa = c.choca === 'cédula';
        return mostrar(`${esa ? 'Esa cédula' : 'Ese correo'} ya está registrad${esa ? 'a' : 'o'}`,
          `${c.nombre}${donde} ya ${esa ? 'tiene esa cédula' : 'tiene ese correo'}. Si es la misma persona, fusiona las dos fichas desde Administrar; si no, revisa el dato.`);
      }
      // Mismo nombre: en una iglesia pasa. Lo decide quien registra.
      if (!await confirmar(`Ya hay un ${c.nombre}`,
        `${c.nombre}${donde} ya está en el sistema. ¿Es otra persona distinta?`, false)) return;
    }

    g.disabled = true; g.textContent = 'Guardando…';
    const autoriza = document.getElementById('dok').checked;

    const { data:creada, error:e1 } = await SB.from('personas').insert({
      nombre,
      nombre_completo:  val('rnc')   || null,
      documento:        val('rdoc')  || null,
      celular:          val('rcel')  || null,
      telefono:         val('rfijo') || null,
      correo:           val('rcor')  || null,
      como_llego:       val('rcomo') || null,
      fecha_nacimiento: val('rnac')  || null,
      acudiente_nombre:     menor ? val('an')   || null : null,
      acudiente_parentesco: menor ? val('ap')   || null : null,
      acudiente_celular:    menor ? val('acel') || null : null,
      acudiente_correo:     menor ? val('acor') || null : null,
      permiso_acudiente:    menor,
      permiso_medio:        menor ? val('amed') || null : null,
      datos_autoriza:  autoriza,
      datos_medio:     autoriza ? val('dmed') || null : null,
      datos_version:   autoriza ? TEXTO_DATOS : null
    }).select('id').single();

    if (e1){ avisar('No se pudo crear: ' + e1.message, true); g.disabled = false; g.textContent = 'Registrar'; return; }

    const { error:e2 } = await SB.from('rangos').insert({
      persona_id:creada.id, rango:val('rr'), asignado_por:S.yo.persona_id });
    if (e2) avisar('Quedó creado, pero sin rango: ' + e2.message, true);

    const { error:e3 } = await SB.from('coberturas').insert({
      persona_id:creada.id, lider_id:val('rl'), asignado_por:S.yo.persona_id });
    if (e3) avisar('Quedó creado, pero sin líder: ' + e3.message, true);

    if (val('rar')) await SB.from('persona_area').insert({ persona_id:creada.id, area_id:val('rar') });

    // La entrada se abre sola. Antes había que ir después a Usuarios
    // y activarlos uno por uno, y eso se olvida. Los menores quedan
    // por fuera a propósito: están registrados porque alguien los
    // cuida, no porque vayan a entrar, y el correo de su ficha suele
    // ser el del acudiente.
    let aviso = `${nombre.split(' ')[0]} quedó registrado.`;
    if (!menor && val('rcor')){
      const { data:acc, error:e4 } = await SB.functions.invoke('claves',
        { body:{ accion:'crear', persona_id:creada.id } });
      aviso += (e4 || (acc && acc.error))
        ? ` No se le pudo abrir la entrada: ${(acc && acc.error) || e4.message}`
        : ` Ya puede entrar con su correo y la clave ${CLAVE_ARRANQUE}.`;
    }

    avisar(aviso);
    ir('ficha', creada.id);
  };
}

/* Filtro común de las pantallas de administrar: nombre, correo,
   celular, cédula, área, rango. Sin tildes, por partes. */
function calza(u, q){
  if (!q) return true;
  const N = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const todo = N([u.nombre, u.nombre_completo, u.correo, u.celular,
                  u.documento, u.areas, u.rango, u.rol_institucional].join(' '));
  return N(q).split(/\s+/).filter(Boolean).every(t => todo.includes(t));
}

async function vUsuarios(){
  cargando();
  const yo = V();
  if (!yo.es_admin && !yo.ve_todo)
    return app.innerHTML = `<div class="error">Esto lo manejan la dirección y el pastorado.</div>`;

  const { data:us, error } = await SB.from('usuarios').select('*').order('nombre');
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;
  const todos = us || [];
  if (S.qUsuarios == null) S.qUsuarios = '';

  const fila = u => `<li><div class="fila" style="cursor:default">
    <span class="fila-alto">
      <span class="nombre">${esc(u.nombre)}</span>
      ${!u.tiene_entrada
        ? (u.correo ? '' : `<span class="marca-est m-desconectado">falta correo</span>`)
        : (u.debe_cambiar_clave ? `<span class="marca-est m-alerta">clave de arranque</span>`
                                : `<span class="marca-est m-cuidado">clave propia</span>`)}
    </span>
    <span class="sub">
      <span>${u.correo ? esc(u.correo) : 'sin correo'}</span>
      ${u.a_cargo ? `<span>· cuida a ${u.a_cargo}</span>` : ''}
      ${u.rango ? `<span class="sello">${esc(mayus(u.rango))}</span>` : ''}
    </span>
    <span style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
      ${!u.tiene_entrada
        ? (u.correo ? `<button class="btn chico" data-abrir="${u.id}" data-nom="${esc(u.nombre)}">Darle entrada</button>` : '')
        : `<button class="btn seco chico" data-reiniciar="${u.id}" data-nom="${esc(u.nombre)}">Reiniciar clave</button>`}
      ${u.correo ? `<button class="btn seco chico" data-correo="${u.id}" data-nom="${esc(u.nombre)}"
         data-cor="${esc(u.correo)}">Cambiar correo</button>` : ''}
    </span></div></li>`;

  // Cuántos están esperando entrada: si son varios, se abren todas
  // de una vez en vez de ir uno por uno.
  const faltan = todos.filter(u => !u.tiene_entrada && u.correo).length;

  app.innerHTML = cabeza('Usuarios', `Todos entran con la clave ${CLAVE_ARRANQUE} y la cambian al entrar`,
    faltan > 1 ? `<button class="btn" id="abrirTodas">Darles entrada a ${faltan}</button>` : '') + `
    <div class="buscador">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
      <input id="qu" type="text" autocomplete="off" placeholder="Buscar por nombre, correo, celular…" value="${esc(S.qUsuarios)}">
      <button class="limpiar" id="limpiarU" ${S.qUsuarios ? '' : 'hidden'} aria-label="Limpiar">✕</button>
    </div>
    <div id="listaU"></div>`;

  const pintar = () => {
    const q = S.qUsuarios;
    const v = todos.filter(u => calza(u, q));
    const sin    = v.filter(u => !u.tiene_entrada);
    const deben  = v.filter(u =>  u.tiene_entrada &&  u.debe_cambiar_clave);
    const listos = v.filter(u =>  u.tiene_entrada && !u.debe_cambiar_clave);

    const bloque = (titulo, lista) => lista.length
      ? `<div class="tarjeta"><div class="tarjeta-alto"><h2>${titulo}</h2>
           <span class="sello">${lista.length}</span></div>
         <div class="tarjeta-cuerpo" style="padding-top:4px">
           <ul class="registro">${lista.map(fila).join('')}</ul></div></div>` : '';

    document.getElementById('listaU').innerHTML = v.length
      ? bloque('Todavía no pueden entrar', sin) +
        bloque('Siguen con la clave de arranque', deben) +
        bloque('Ya tienen su propia clave', listos)
      : `<div class="vacio"><strong>Nadie con «${esc(q)}»</strong>
           Prueba con otra parte del nombre o del correo.</div>`;
    enlazarU();
  };

  const llamar = async (accion, id, nombre, b) => {
    const ant = b.textContent;
    b.disabled = true; b.textContent = 'Un momento…';
    const { data, error } = await SB.functions.invoke('claves', { body:{ accion, persona_id:id } });
    b.disabled = false; b.textContent = ant;
    if (error || (data && data.error)){
      const m = (data && data.error) || error.message || '';
      return mostrar('No se pudo',
        /Function not found|not found|Failed to send/i.test(m)
          ? `Todavía no está publicada la función «claves» en Supabase. Mientras tanto, la clave de ${nombre} se cambia desde el panel de Supabase, en Authentication.`
          : m);
    }
    avisar((data && data.mensaje) || 'Listo.');
    ir('usuarios');
  };

  // ---------- abrirles la entrada a todos los que faltan ----------
  const bTodas = document.getElementById('abrirTodas');
  if (bTodas) bTodas.onclick = async () => {
    if (!await confirmar(`¿Darles entrada a ${faltan}?`,
      `Van a poder entrar con su correo y la clave ${CLAVE_ARRANQUE}. Los menores de edad y los visitantes no entran.`, false)) return;
    bTodas.disabled = true; bTodas.textContent = 'Un momento…';
    const { data, error } = await SB.functions.invoke('claves', { body:{ accion:'crear_faltantes' } });
    bTodas.disabled = false;
    if (error || (data && data.error))
      return mostrar('No se pudo', (data && data.error) || error.message);

    // Se cuenta lo que pasó de verdad, no «listo»: si tres se
    // saltaron por ser menores, eso hay que decirlo.
    const s = (data.saltados || []), f = (data.fallaron || []);
    await mostrar('Listo', [esc(data.mensaje || ''),
      s.length ? esc(`Se saltaron ${s.length}: ${s.map(x => `${x.nombre} (${x.porque})`).join(', ')}.`) : '',
      f.length ? esc(`No se pudo con ${f.length}: ${f.map(x => `${x.nombre} (${x.porque})`).join(', ')}.`) : ''
    ].filter(Boolean).join('<br><br>'));
    ir('usuarios');
  };

  function enlazarU(){
    // ---------- cambiar el correo ----------
    // Pasa por la función y no por un update a la ficha: el correo
    // es también con lo que se entra, y cambiarlo solo en un lado
    // deja a la persona por fuera sin que nadie se entere.
    app.querySelectorAll('[data-correo]').forEach(b => b.onclick = async () => {
      const nuevo = await pedirTexto(`Cambiarle el correo a ${b.dataset.nom}`, {
        texto: 'Con este correo va a entrar a la plataforma. Su clave no cambia.',
        valor: b.dataset.cor, marcador: 'alguien@correo.com' });
      if (nuevo == null) return;
      const limpio = nuevo.trim().toLowerCase();
      if (!limpio || limpio === b.dataset.cor.toLowerCase()) return;
      const ant = b.textContent;
      b.disabled = true; b.textContent = 'Un momento…';
      const { data, error } = await SB.functions.invoke('claves',
        { body:{ accion:'cambiar_correo', persona_id:b.dataset.correo, correo:limpio } });
      b.disabled = false; b.textContent = ant;
      if (error || (data && data.error))
        return mostrar('No se pudo', (data && data.error) || error.message);
      avisar(data.mensaje);
      ir('usuarios');
    });

    app.querySelectorAll('[data-abrir]').forEach(b => b.onclick = async () => {
      if (!await confirmar(`¿Darle entrada a ${b.dataset.nom}?`,
        `Va a poder entrar con su correo y la clave ${CLAVE_ARRANQUE}, y la plataforma le va a pedir que la cambie.`, false)) return;
      llamar('crear', b.dataset.abrir, b.dataset.nom, b);
    });
    app.querySelectorAll('[data-reiniciar]').forEach(b => b.onclick = async () => {
      if (!await confirmar(`¿Reiniciar la clave de ${b.dataset.nom}?`,
        `Su clave vuelve a ser ${CLAVE_ARRANQUE} y tendrá que cambiarla la próxima vez que entre.`)) return;
      llamar('reiniciar', b.dataset.reiniciar, b.dataset.nom, b);
    });
  }

  const caja = document.getElementById('qu');
  caja.oninput = e => {
    S.qUsuarios = e.target.value;
    document.getElementById('limpiarU').hidden = !S.qUsuarios;
    pintar();
  };
  document.getElementById('limpiarU').onclick = () => {
    S.qUsuarios = ''; caja.value = ''; caja.focus();
    document.getElementById('limpiarU').hidden = true; pintar();
  };
  pintar();
}

/* ============================================================
   Permisos — quién manda qué
   ============================================================ */
const ROLES_INST = { ninguno:'Sin rol', director:'Director', pastor:'Pastor' };

async function vPermisos(){
  cargando();
  const yo = V();
  if (!yo.es_admin && !yo.ve_todo)
    return app.innerHTML = `<div class="error">Esto lo manejan la dirección y el pastorado.</div>`;

  const { data:us, error } = await SB.from('usuarios').select('*').order('nombre');
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;
  const todos = us || [];
  if (S.qPermisos == null) S.qPermisos = '';

  // Solo un admin de verdad reparte el permiso de administrar.
  const soyAdminReal = !!S.yo.es_admin && S.rol === 'real';

  const fila = u => {
    const yoMismo = u.soy_yo;
    return `<li><div class="fila" style="cursor:default">
      <span class="fila-alto">
        <span class="nombre">${esc(u.nombre)}</span>
        ${u.es_admin ? `<span class="marca-est m-cuidado">administrador</span>` : ''}
        ${u.rol_institucional !== 'ninguno'
          ? `<span class="marca-est m-alerta">${esc(ROLES_INST[u.rol_institucional] || u.rol_institucional)}</span>` : ''}
      </span>
      <span class="sub">
        <span>${u.correo ? esc(u.correo) : 'sin correo'}</span>
        ${u.a_cargo ? `<span>· cuida a ${u.a_cargo}</span>` : ''}
        ${u.rango ? `<span class="sello">${esc(mayus(u.rango))}</span>` : ''}
      </span>
      ${yoMismo
        ? `<span class="sub"><span>Tus propios permisos los cambia otro administrador.</span></span>`
        : `<span class="avanzada" style="margin-top:12px">
            <span><label style="margin-top:0">Rol</label>
              <select data-rol="${u.id}" data-nom="${esc(u.nombre)}">
                ${Object.entries(ROLES_INST).map(([v,t]) =>
                  `<option value="${v}"${v === u.rol_institucional ? ' selected' : ''}>${t}</option>`).join('')}
              </select></span>
            <span><label style="margin-top:0">Administrador</label>
              <select data-adm="${u.id}" data-nom="${esc(u.nombre)}"${soyAdminReal ? '' : ' disabled'}>
                <option value="no"${u.es_admin ? '' : ' selected'}>No</option>
                <option value="si"${u.es_admin ? ' selected' : ''}>Sí</option>
              </select></span>
          </span>`}
    </div></li>`;
  };

  app.innerHTML = cabeza('Permisos', 'Quién ve todo y quién administra la plataforma') + `
    <div class="buscador">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
      <input id="qp" type="text" autocomplete="off" placeholder="Buscar por nombre, correo, área…" value="${esc(S.qPermisos)}">
      <button class="limpiar" id="limpiarP" ${S.qPermisos ? '' : 'hidden'} aria-label="Limpiar">✕</button>
    </div>
    <div id="listaP"></div>`;

  const pintar = () => {
    const q = S.qPermisos;
    const v = todos.filter(u => calza(u, q));
    const conMando = v.filter(u => u.es_admin || u.rol_institucional !== 'ninguno');
    const resto    = v.filter(u => !u.es_admin && u.rol_institucional === 'ninguno');

    const bloque = (titulo, lista) => lista.length
      ? `<div class="tarjeta"><div class="tarjeta-alto"><h2>${titulo}</h2>
           <span class="sello">${lista.length}</span></div>
         <div class="tarjeta-cuerpo" style="padding-top:4px">
           <ul class="registro">${lista.map(fila).join('')}</ul></div></div>` : '';

    document.getElementById('listaP').innerHTML = v.length
      ? bloque('Con mando', conMando) + bloque('Los demás', resto)
      : `<div class="vacio"><strong>Nadie con «${esc(q)}»</strong>
           Prueba con otra parte del nombre o del correo.</div>`;
    enlazarP();
  };

  const mandar = async (id, nombre, campos, sel, antes) => {
    sel.disabled = true;
    const { error } = await SB.rpc('cambiar_permisos',
      { p_persona:id, p_rol:campos.rol ?? null, p_es_admin:campos.admin ?? null });
    sel.disabled = false;
    if (error){ sel.value = antes; return mostrar('No se pudo', error.message); }
    avisar(`${nombre.split(' ')[0]}: permisos actualizados.`);
    ir('permisos');
  };

  function enlazarP(){
    app.querySelectorAll('[data-rol]').forEach(sel => {
      const antes = sel.value;
      sel.onchange = async () => {
        const t = ROLES_INST[sel.value];
        if (!await confirmar(`¿${sel.value === 'ninguno' ? 'Quitarle el rol' : 'Poner como ' + t.toLowerCase()} a ${sel.dataset.nom}?`,
          sel.value === 'ninguno'
            ? 'Va a dejar de ver a todo el ministerio y solo verá a su gente.'
            : 'Va a poder ver a todo el ministerio, no solo a su gente.', false)){
          sel.value = antes; return;
        }
        mandar(sel.dataset.rol, sel.dataset.nom, { rol:sel.value }, sel, antes);
      };
    });

    app.querySelectorAll('[data-adm]').forEach(sel => {
      const antes = sel.value;
      sel.onchange = async () => {
        const dar = sel.value === 'si';
        if (!await confirmar(`¿${dar ? 'Hacer administrador' : 'Quitarle el administrador'} a ${sel.dataset.nom}?`,
          dar ? 'Va a poder manejar claves, permisos y fusiones de todo el ministerio.'
              : 'Deja de poder manejar claves, permisos y fusiones.', !dar)){
          sel.value = antes; return;
        }
        mandar(sel.dataset.adm, sel.dataset.nom, { admin:dar }, sel, antes);
      };
    });
  }

  const caja = document.getElementById('qp');
  caja.oninput = e => {
    S.qPermisos = e.target.value;
    document.getElementById('limpiarP').hidden = !S.qPermisos;
    pintar();
  };
  document.getElementById('limpiarP').onclick = () => {
    S.qPermisos = ''; caja.value = ''; caja.focus();
    document.getElementById('limpiarP').hidden = true; pintar();
  };
  pintar();
}

/* ============================================================
   Fusionar dos fichas de la misma persona
   ============================================================ */
const CAMPOS_FUSION = [
  ['nombre','Nombre'], ['nombre_completo','Nombre completo'], ['correo','Correo'],
  ['celular','Celular'], ['telefono','Teléfono fijo'], ['documento','Cédula'],
  ['fecha_nacimiento','Fecha de nacimiento'], ['fecha_ingreso','Entró al ministerio'],
  ['como_llego','¿Cómo llegó?']
];

async function vFusionar(arg){
  cargando();
  const yo = V();
  if (!yo.es_admin && !yo.ve_todo)
    return app.innerHTML = `<div class="error">Esto lo manejan la dirección y el pastorado.</div>`;

  const { data:gente } = await SB.from('buscador').select('*').order('nombre');
  const todos = gente || [];
  const F = S.fusion || (S.fusion = { a:(arg && arg.a) || '', b:(arg && arg.b) || '' });

  const quien = id => todos.find(g => g.id === id);
  const A = quien(F.a), B = quien(F.b);
  if (S.qFusion == null) S.qFusion = '';

  // Con 14 hombres una lista desplegable alcanza; con 300 no. El
  // buscador recorta las dos listas a la vez.
  const visibles = todos.filter(g => calza(g, S.qFusion) || g.id === F.a || g.id === F.b);
  const opciones = (sel, excluir) => visibles
    .filter(g => g.id !== excluir)
    .map(g => `<option value="${g.id}"${g.id === sel ? ' selected' : ''}>${esc(g.nombre)}${g.correo ? ' · ' + esc(g.correo) : ''}</option>`)
    .join('');

  let html = `<button class="volver" id="atras">← Volver</button>` +
    cabeza('Fusionar', 'Dos fichas de la misma persona se vuelven una') + `
    <div class="buscador">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
      <input id="qf" type="text" autocomplete="off" placeholder="Buscar para acortar las listas…" value="${esc(S.qFusion)}">
      <button class="limpiar" id="limpiarF" ${S.qFusion ? '' : 'hidden'} aria-label="Limpiar">✕</button>
    </div>
    <div class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="par">
        <div><label for="fa" style="margin-top:0">La ficha que queda</label>
          <select id="fa"><option value="">Elige…</option>${opciones(F.a, F.b)}</select></div>
        <div><label for="fb" style="margin-top:0">La que se va</label>
          <select id="fb"><option value="">Elige…</option>${opciones(F.b, F.a)}</select></div>
      </div>
      ${S.qFusion ? `<p style="margin:12px 0 0;font-size:13px;color:var(--suave)">${visibles.length} de ${todos.length}</p>` : ''}
      </div></div>`;

  if (A && B){
    const distinto = CAMPOS_FUSION.filter(([k]) =>
      (A[k] || '') !== (B[k] || '') && ((A[k] || '') || (B[k] || '')));

    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>¿Con cuál dato se queda?</h2></div>
      <div class="tarjeta-cuerpo">
      ${distinto.length ? distinto.map(([k,t]) => `
        <label style="margin-top:14px">${t}</label>
        <div class="opciones">
          <button type="button" class="opcion" data-campo="${k}" data-valor="${esc(A[k] || '')}"
            aria-pressed="true">${esc(A[k] || '— vacío —')}</button>
          <button type="button" class="opcion" data-campo="${k}" data-valor="${esc(B[k] || '')}"
            aria-pressed="false">${esc(B[k] || '— vacío —')}</button>
        </div>`).join('')
      : `<p style="margin:0;color:var(--suave);font-size:14.5px">Las dos fichas tienen los mismos datos.</p>`}
      </div></div>`;

    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Lo que se va a mover</h2></div>
      <div class="tarjeta-cuerpo"><div class="avanzada">
        ${[['Áreas', B.areas_todas || '—'], ['Cursos', B.cursos || '—'],
           ['Rango', B.rango ? mayus(B.rango) : '—'], ['Lo cuida', B.lider || '—']]
          .map(([t,v]) => `<div><label style="margin-top:0">${t}</label>
             <p style="margin:0;font-size:15px">${esc(v)}</p></div>`).join('')}
      </div></div></div>`;

    html += `<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px">
      <button class="btn rojo" id="hacerlo">Fusionar</button>
      <button class="btn seco" id="cancelarF">Cancelar</button></div>`;
  }

  app.innerHTML = html;
  document.getElementById('atras').onclick    = () => { S.fusion = null; ir('personas'); };
  const cancelar = document.getElementById('cancelarF');
  if (cancelar) cancelar.onclick = () => { S.fusion = null; ir('personas'); };

  document.getElementById('fa').onchange = e => { F.a = e.target.value; ir('fusionar'); };
  document.getElementById('fb').onchange = e => { F.b = e.target.value; ir('fusionar'); };

  const cajaF = document.getElementById('qf');
  // La vista se repinta entera al filtrar, así que hay que devolverle
  // el foco y dejar el cursor al final; si no, se escribe una letra
  // y se pierde el teclado.
  if (S.focoFusion){ cajaF.focus(); cajaF.setSelectionRange(cajaF.value.length, cajaF.value.length); }
  let reloj;
  cajaF.oninput = e => {
    S.qFusion = e.target.value; S.focoFusion = true;
    clearTimeout(reloj);
    reloj = setTimeout(() => ir('fusionar'), 280);
  };
  cajaF.onblur = () => { if (!reloj) S.focoFusion = false; };
  document.getElementById('limpiarF').onclick = () => {
    S.qFusion = ''; S.focoFusion = true; ir('fusionar');
  };

  const elegidos = {};
  app.querySelectorAll('[data-campo]').forEach(b => b.onclick = () => {
    elegidos[b.dataset.campo] = b.dataset.valor;
    app.querySelectorAll(`[data-campo="${b.dataset.campo}"]`)
       .forEach(o => o.setAttribute('aria-pressed', o === b));
  });

  const hacerlo = document.getElementById('hacerlo');
  if (hacerlo) hacerlo.onclick = async () => {
    if (!await confirmar('¿Fusionar las dos fichas?',
      `Todo lo de ${B.nombre} pasa a ${A.nombre} y esa segunda ficha se elimina. Esto no se deshace.`)) return;
    hacerlo.disabled = true; hacerlo.textContent = 'Fusionando…';
    const { error } = await SB.rpc('fusionar_personas',
      { p_queda:F.a, p_va:F.b, p_campos:elegidos });
    if (error){
      hacerlo.disabled = false; hacerlo.textContent = 'Fusionar';
      return mostrar('No se pudo fusionar', error.message);
    }
    const queda = F.a;
    S.fusion = null;
    avisar('Las dos fichas quedaron en una.');
    ir('ficha', queda);
  };
}

/* ============================================================
   Listas
   ============================================================ */
const NOMBRE_FILTRO = {
  texto:'Busca', excluir:'Excluye', situacion:'Cuidado', rango:'Rango', rangoNo:'Sin el rango',
  area:'Área', areaNo:'Sin el área', proceso:'Proceso', curso:'Curso', estado:'Estado',
  edadMin:'Desde', edadMax:'Hasta', lider:'Lo cuida', anio:'Año'
};

const VALOR_FILTRO = {
  proceso:{ con:'empezado', sin:'sin empezar', completo:'con alguno completo' },
  rango:{ __sin:'sin rango' }, rangoNo:{ __sin:'sin rango' },
  area:{ __sin:'sin área' }, lider:{ __sin:'nadie' }
};

function resumenFiltros(f, nombres){
  return Object.entries(f || {})
    .filter(([k,v]) => v && NOMBRE_FILTRO[k])
    .map(([k,v]) => {
      const leible = (VALOR_FILTRO[k] && VALOR_FILTRO[k][v])
        || (k === 'lider' ? (nombres.get(v) || v) : v);
      return `${NOMBRE_FILTRO[k]}: ${leible}`;
    })
    .join(' · ') || 'Sin filtros';
}

async function vListas(){
  cargando();

    return app.innerHTML = `<div class="error">Las listas las manejan la dirección y el pastorado.</div>`;

      return `<a class="pcard" href="#/lista/${l.id}" data-lista="${l.id}">
        <span class="pcard-alto">
          <span class="pcard-ini">${esc((l.nombre || '?')[0].toUpperCase())}</span>
          <span class="pcard-nom"><b>${esc(l.nombre)}</b>
            <span>${n} ${n === 1 ? 'persona' : 'personas'} hoy</span></span>
        </span>
        <span class="pcard-fila" style="font-size:12.5px;line-height:1.5">${
          esc(resumenFiltros(l.filtros, nombres))}</span>
      </a>`;
    }).join('')}</div>`;
  }

  app.innerHTML = html;
  document.getElementById('aPersonas2').onclick = () => ir('personas');
  document.getElementById('nuevaL').onclick = () => {

  app.querySelectorAll('[data-lista]').forEach(b => b.onclick = e => {

/* El mismo filtro que usa Personas, aparte para que las Listas
   puedan correr la regla sin volver a pintar esa pantalla. */
function pasaFiltros(g, f){
  const N = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const todo = N([g.nombre, g.nombre_completo, g.correo, g.celular, g.telefono,
                  g.documento, g.areas, g.areas_todas, g.rango, g.cursos].join(' '));
  if (f.texto   && !N(f.texto).split(/\s+/).filter(Boolean).every(t => todo.includes(t))) return false;
  if (f.excluir &&  N(f.excluir).split(/\s+/).filter(Boolean).some(t => todo.includes(t))) return false;
  if (f.situacion && g.situacion !== f.situacion) return false;
  if (f.rango === '__sin' ? g.rango : f.rango && g.rango !== f.rango) return false;
  if (f.rangoNo && (f.rangoNo === '__sin' ? !g.rango : g.rango === f.rangoNo)) return false;
  if (f.area === '__sin' ? g.areas : f.area && !String(g.areas).includes(f.area)) return false;
  if (f.areaNo && String(g.areas).includes(f.areaNo)) return false;
  if (f.estado && g.estado !== f.estado) return false;
  if (f.lider === '__sin' ? g.lider_id : f.lider && g.lider_id !== f.lider) return false;
  if (f.curso && !String(g.cursos).includes(f.curso)) return false;
  if (f.proceso === 'con'      && !g.pasos_marcados) return false;
  if (f.proceso === 'sin'      &&  g.pasos_marcados) return false;
  if (f.proceso === 'completo' && !g.rutas_completas) return false;
  if (f.anio && !String(g.anios).split(' ').includes(f.anio)) return false;
  const min = parseInt(f.edadMin, 10), max = parseInt(f.edadMax, 10);
  if (Number.isFinite(min) && (g.edad === null || g.edad < min)) return false;
  if (Number.isFinite(max) && (g.edad === null || g.edad > max)) return false;
  return true;
}

/* ============================================================
   Eventos
   ============================================================ */
const TIPOS_EV = { oracion:'Oración', mesa:'Mesa de caballeros',
                   grupo_vida:'Grupo de vida', catalitico:'Evento catalítico',
                   formacion:'Formación', otro:'Otro' };

// Los cinco roles de un área. «cabeza» responde por el área, «lider» la
// mueve, «colider» acompaña, «encargado» está a cargo mientras no hay
// cabeza. Cualquiera de esos cuatro manda adentro; participante no.
const ROLES_AREA = { cabeza:'Cabeza', lider:'Líder', colider:'Colíder',
                     encargado:'Encargado', participante:'Participante' };
const MANDA_AREA = r => r === 'cabeza' || r === 'lider' ||
                        r === 'colider' || r === 'encargado';
const selloRol = r => MANDA_AREA(r) ? `<span class="sello">${ROLES_AREA[r] || r}</span>` : '';

async function vEventos(){
  cargando();
  const yo = V();
  const puede = yo.es_admin || yo.puede_cuidar;

  const [{ data:evs, error }, { data:vis }, { data:areas }] = await Promise.all([
    SB.from('eventos_resumen').select('*').order('fecha', { ascending:false }),
    puede ? SB.from('visitantes').select('*').order('dias_desde', { ascending:true })
          : Promise.resolve({ data:[] }),
    puede ? SB.from('areas_vista').select('id, nombre').eq('activa', true).order('nombre')
          : Promise.resolve({ data:[] })
  ]);
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;

  const hoyF = hoy();
  const proximos = (evs || []).filter(e => e.fecha >= hoyF).reverse();
  const pasados  = (evs || []).filter(e => e.fecha <  hoyF);
  const delAnio  = pasados.filter(e => e.fecha.startsWith(hoyF.slice(0,4)));
  const asistTot = delAnio.reduce((a,e) => a + Number(e.asistieron), 0);

  let html = cabeza('Eventos', 'Reuniones, mesas y actividades del ministerio',
    puede ? `<button class="btn" id="nuevo">Crear evento</button>` : '');

  html += cifras([
    { icono:'eventos',    color:'azul',  valor:proximos.length,       texto:'por venir' },
    { icono:'reloj',      color:'verde', valor:delAnio.length,        texto:'hechos este año' },
    { icono:'personas', color:'verde', valor:asistTot,              texto:'asistencias del año' },
    { icono:'puerta',     color:'ambar', valor:(vis || []).length,    texto:'visitantes por vincular' }
  ]);

  if (puede) html += `<div id="formNuevo" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="par"><div><label for="en">Nombre</label>
        <input id="en" type="text" placeholder="Mesa de caballeros · octubre"></div>
        <div><label for="et">Tipo</label><select id="et">
          ${Object.entries(TIPOS_EV).map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select></div></div>
      <div class="par"><div><label for="ef">Fecha</label><input id="ef" type="date" value="${hoyF}"></div>
        <div><label for="eh">Hora</label><input id="eh" type="text" placeholder="7:00 pm"></div></div>
      <label for="ea">Área</label><select id="ea">
        <option value="">Ninguna · es de toda la red</option>
        ${(areas || []).map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select>
      <label for="el">Lugar</label><input id="el" type="text" placeholder="Auditorio, casa de alguien, en línea…">
      <label for="ed">De qué se trata</label><input id="ed" type="text">
      <div style="margin-top:16px"><button class="btn" id="guardarEv">Crear evento</button></div>
    </div></div>`;

  const tarjetaEv = e => `<li><a class="fila" href="#/evento/${e.id}" data-ev="${e.id}">
      <span class="fila-alto"><span class="nombre">${esc(e.nombre)}</span>
        <span class="cuenta ${e.asistieron ? 'v-cuidado' : ''}">${e.asistieron}<small>${e.asistieron === 1 ? 'fue' : 'fueron'}</small></span></span>
      <span class="sub"><span class="sello">${esc(TIPOS_EV[e.tipo] || e.tipo)}</span>
        <span>${fechaCorta(e.fecha)}${e.hora ? ' · ' + esc(e.hora.slice(0,5)) : ''}</span>
        ${e.lugar ? `<span>· ${esc(e.lugar)}</span>` : ''}
        ${e.visitantes ? `<span style="color:var(--ambar)">· ${e.visitantes} ${e.visitantes === 1 ? 'visitante' : 'visitantes'}</span>` : ''}</span>
    </a></li>`;

  // Con un año de eventos adentro, la lista deja de servir para
  // encontrar algo: el buscador mira nombre, tipo, lugar y tema.
  if (S.qEv == null) S.qEv = '';
  const filtraEv = lista => {
    const q = sinT(S.qEv.trim());
    if (!q) return lista;
    return lista.filter(e =>
      sinT(e.nombre).includes(q) || sinT(e.tema).includes(q) ||
      sinT(e.lugar).includes(q) || sinT(TIPOS_EV[e.tipo] || e.tipo).includes(q) ||
      sinT(fechaCorta(e.fecha)).includes(q));
  };

  html += cajaBusqueda('qEv', 'Buscar por nombre, tipo, lugar o fecha…', S.qEv);
  html += '<div id="rolloEv"></div>';



  if (!evs.length)
    html += `<div class="vacio"><strong>Todavía no hay eventos</strong>
      Crea una mesa, una noche de oración o una actividad, y después toma la asistencia.
      Los invitados que lleguen quedan registrados para poder buscarlos luego.</div>`;

  if (puede && vis && vis.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Van llegando</h2>
        <span class="ruta-conteo">Fueron a un evento y todavía no entran al ministerio</span></div>
      <ul class="registro">${vis.map(v => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(v.nombre)}</span>
          <span class="cuenta ${v.eventos_asistidos > 1 ? 'v-cuidado' : ''}">${v.eventos_asistidos}<small>${v.eventos_asistidos === 1 ? 'vez' : 'veces'}</small></span></span>
        <span class="sub">${v.ultima_vez ? `<span>Última vez ${haceCuanto(v.dias_desde)}</span>` : '<span>Aún no ha venido</span>'}
          ${v.celular ? `<span>· <a href="https://wa.me/57${esc(v.celular)}">${esc(v.celular)}</a></span>` : ''}</span>
      </div></li>`).join('')}</ul>
      </div>`;

  app.innerHTML = html;

  // Las dos listas se pintan aparte para que el buscador repinte
  // solo esto y no la pantalla entera.
  const pintarEv = () => {
    const pr = filtraEv(proximos), pa = filtraEv(pasados);
    const rollo = document.getElementById('rolloEv');
    if (!rollo) return;
    const q = S.qEv.trim();
    rollo.innerHTML =
      (pr.length ? `<div class="tarjeta"><div class="tarjeta-alto"><h2>Por venir</h2>
          <span class="ruta-conteo">${pr.length}</span></div>
        <ul class="registro">${pr.map(tarjetaEv).join('')}</ul></div>` : '') +
      (pa.length ? `<div class="tarjeta"><div class="tarjeta-alto"><h2>Ya pasaron</h2>
          <span class="ruta-conteo">${q ? pa.length + ' encontrados' : delAnio.length + ' este año'}</span></div>
        <ul class="registro">${pa.map(tarjetaEv).join('')}</ul></div>` : '') +
      (q && !pr.length && !pa.length
        ? `<div class="vacio"><strong>Ningún evento con «${esc(q)}»</strong>
            Prueba con otra parte del nombre, el lugar o el tipo.</div>` : '');
  };
  pintarEv();
  engancharBusqueda('qEv', v => { S.qEv = v; pintarEv(); });

  app.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => ir('evento', b.dataset.ev));

  const n = document.getElementById('nuevo');
  if (n) n.onclick = () => {
    const f = document.getElementById('formNuevo');
    f.hidden = !f.hidden; n.textContent = f.hidden ? 'Crear evento' : 'Cancelar';
  };
  const g = document.getElementById('guardarEv');
  if (g) g.onclick = async () => {
    const nombre = document.getElementById('en').value.trim();
    if (!nombre) return avisar('Ponle nombre al evento.', true);
    g.disabled = true;
    const { error } = await SB.from('eventos').insert({
      nombre, tipo:document.getElementById('et').value,
      area_id: document.getElementById('ea').value || null,
      fecha: document.getElementById('ef').value,
      hora:  document.getElementById('eh').value.trim() || null,
      lugar: document.getElementById('el').value.trim() || null,
      descripcion: document.getElementById('ed').value.trim() || null,
      creado_por: S.yo.persona_id });
    if (error){ avisar(error.message, true); g.disabled = false; return; }
    avisar('Evento creado.');
    ir('eventos');
  };
}

    ir('evento', id);
  });

  app.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
    const x = (equipo || []).find(q => q.id === b.dataset.wa);
    if (!x || !x.celular) return;
    const rol = x.rol === 'encargado' ? 'encargado' : (x.area ? `servidor de ${x.area}` : 'servidor');
    const txt = `Hola ${x.nombre.split(' ')[0]}, quedaste como ${rol} en ${e.nombre}: `
      + `${fechaCorta(e.fecha)}${e.hora ? ' a las ' + e.hora.slice(0,5) : ''}`
      + `${e.lugar ? ' en ' + e.lugar : ''}. ¿Cuentas?`;
    window.open(`https://wa.me/57${x.celular}?text=${encodeURIComponent(txt)}`, '_blank');
  });

  // Cuántos van, sin tener que recorrer la pantalla.
  const contar = () => {
    const c = document.getElementById('conteoAsis');
    if (!c) return;
    const vinieron = [...marcados.values()].filter(a => a.asistio).length;
    const sin = enLista.filter(p => !marcados.has(p.id)).length;
    c.textContent = `${vinieron} vinieron` + (sin ? ` · ${sin} sin marcar` : '');
  };
  contar();

  // Repinta UNA fila. Antes esto llamaba a ir('evento', id), que
  // volvía a traer todo de la base y repintaba la pantalla entera:
  // por eso al marcar a alguien del final la vista saltaba arriba y
  // tocaba bajar de nuevo.
  const repintarFila = pid => {
    const li = document.getElementById('as-' + pid);
    const p = enLista.find(x => x.id === pid);
    if (!li || !p) return;
    li.outerHTML = filaAsis(p);
    enlazarAsis(document.getElementById('as-' + pid));
    contar();
  };

  async function marcarAsistencia(pid, estado){
    const ya = marcados.get(pid);
    let error, fila;

    if (ya && ya.estado === estado){
      // Tocar otra vez lo mismo lo desmarca: vuelve a «sin marcar».
      ({ error } = await SB.from('asistencias').delete().eq('id', ya.id));
      if (!error) marcados.delete(pid);
    } else if (ya){
      ({ data:fila, error } = await SB.from('asistencias')
        .update({ estado }).eq('id', ya.id).select().single());
      if (!error) marcados.set(pid, fila);
    } else {
      // Se manda el estado y no asistio: es el campo que de verdad
      // manda, y mandar solo asistio era lo que hacía que «No»
      // quedara guardado como «Vino».
      ({ data:fila, error } = await SB.from('asistencias')
        .insert({ evento_id:id, persona_id:pid, estado, invitado_por:S.yo.persona_id })
        .select().single());
      if (!error) marcados.set(pid, fila);
    }
    if (error) return avisar(error.message, true);
    repintarFila(pid);
  }

  function enlazarAsis(raiz){
    (raiz || app).querySelectorAll('[data-as]').forEach(b => b.onclick = () =>
      marcarAsistencia(b.dataset.as, b.dataset.fue === '1' ? 'presente' : 'ausente'));
  }
  enlazarAsis();

  const cl = document.getElementById('cerrarLista');
  if (cl) cl.onclick = async () => {
    const sin = enLista.filter(p => !marcados.has(p.id));
    if (!sin.length) return avisar('No queda nadie sin marcar.');
    if (!await confirmar('¿Cerrar la lista?',
      `${sin.length === 1 ? 'Una persona queda como que no asistió' : sin.length + ' personas quedan como que no asistieron'}. Se puede reabrir.`, false)) return;
    const { error } = await SB.rpc('cerrar_lista',
      { p_evento:id, p_personas:sin.map(p => p.id) });
    if (error) return avisar(error.message, true);
    avisar('Lista cerrada.');
    ir('evento', id);
  };

  const rl = document.getElementById('reabrirLista');
  if (rl) rl.onclick = async () => {
    if (!await confirmar('¿Reabrir la lista?',
      'Se borran todas las ausencias de este evento. Los que están marcados como que vinieron no se tocan.', false)) return;
    const { error } = await SB.rpc('reabrir_lista', { p_evento:id });
    if (error) return avisar(error.message, true);
    avisar('Lista reabierta.');
    ir('evento', id);
  };

  const av = document.getElementById('addVis');
  if (av) av.onclick = async () => {
    const nombre = document.getElementById('vn').value.trim();
    if (!nombre) return avisar('Falta el nombre.', true);
    av.disabled = true;
    const { error } = await SB.rpc('sumar_visitante', {
      p_evento:id, p_nombre:nombre, p_celular:document.getElementById('vc').value.trim() || null });
    if (error){ avisar(error.message, true); av.disabled = false; return; }
    avisar(`${nombre.split(' ')[0]} quedó registrado.`);
    ir('evento', id);
  };
}

// Un archivo .ics: cada uno lo abre y el evento le queda en SU
// calendario. Si la persona tiene rol en el evento, va en el título.
function descargarIcs(e, rol){
  const f = e.fecha.replace(/-/g,'');
  const h = (e.hora || '19:00').slice(0,5).replace(':','') + '00';
  const limpio = t => String(t || '').replace(/[\n,;]/g,' ');
  const titulo = rol ? `${e.nombre} — ${rol}` : e.nombre;
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SDV//Cuidado//ES','BEGIN:VEVENT',
    `UID:${e.id}-${(rol||'asiste').replace(/\s/g,'')}@sdv`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
    `DTSTART;TZID=America/Bogota:${f}T${h}`,
    `SUMMARY:${limpio(titulo)}`,
    e.lugar ? `LOCATION:${limpio(e.lugar)}` : '',
    `DESCRIPTION:${limpio((rol ? 'Tu rol: ' + rol + '. ' : '') + (e.descripcion || ''))}`,
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar' }));
  a.download = limpio(e.nombre).replace(/[^\wáéíóúñ ]/gi,'').trim() + '.ics';
  a.click();
  URL.revokeObjectURL(a.href);
  avisar('Archivo descargado.');
}

/* ============================================================
   Jerarquías — las dos, lado a lado
   ------------------------------------------------------------
   Cuidado y estructura son árboles distintos que se cruzan en la
   misma persona. Esta pantalla es el único sitio donde se ven los
   dos a la vez y donde se mueven.
   ============================================================ */
async function vJerarquias(){
  cargando();
  const yo = V();
  if (!yo.es_admin && !yo.ve_todo)
    return app.innerHTML = `<div class="error">Esto lo manejan la dirección y el pastorado.</div>`;

  const [{ data:lideres, error }, { data:areas }, { data:dir }] = await Promise.all([
    SB.from('lideres_vista').select('*').order('nombre'),
    SB.from('areas_vista').select('*').eq('activa', true).order('nombre'),
    SB.from('directorio').select('*').order('nombre')
  ]);
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;

  if (S.qJer == null) S.qJer = '';
  const N = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const filtrar = () => {
    const q = N(S.qJer.trim());
    return q ? (lideres || []).filter(l => N(l.nombre).includes(q) || N(l.lidera).includes(q))
             : (lideres || []);
  };
  const lista = filtrar();

  let html = cabeza('Jerarquías', 'Quién cuida a quién, y quién pertenece a dónde') + `
    <div class="buscador">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
      <input id="qj" type="text" autocomplete="off" placeholder="Buscar un líder o un área…" value="${esc(S.qJer)}">
      <button class="limpiar" id="limpiarJ" ${S.qJer ? '' : 'hidden'} aria-label="Limpiar">✕</button>
    </div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Quién lidera algo</h2>
      <span class="ruta-conteo">${lista.length} de ${(lideres||[]).length}</span></div>
    <ul class="registro" id="listaJ">${lista.length ? lista.map(l => `<li>
      <a class="fila" href="${direccion('bajoSuCargo', l.id)}">
        <span class="fila-alto"><span class="nombre">${esc(l.nombre)}</span>
          ${l.cuida ? `<span class="sello">cuida a ${l.cuida}</span>` : ''}</span>
        <span class="sub">
          ${l.lidera ? `<span>${esc(l.lidera)}</span>` : '<span>solo cuidado</span>'}
          ${l.lo_cuida ? `<span>· lo cuida ${esc(l.lo_cuida)}</span>` : ''}</span>
      </a></li>`).join('')
      : `<li><div class="vacio" style="margin:0"><strong>Nadie con «${esc(q)}»</strong>
           Prueba con otra parte del nombre o del área.</div></li>`}</ul></div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Las áreas y las redes</h2></div>
    <ul class="registro">${(areas || []).map(a => `<li>
      <a class="fila" href="${direccion('areaGente', a.id)}">
        <span class="fila-alto"><span class="nombre">${esc(a.nombre)}</span>
          <span class="sello">${esc(a.tipo)}</span></span>
        <span class="sub">
          ${a.area_padre ? `<span>dentro de ${esc(a.area_padre)}</span>` : '<span>primer nivel</span>'}
          ${a.cabeza ? `<span>· ${a.cabeza_rol === 'encargado' ? 'encargado' : 'cabeza'} ${esc(a.cabeza)}</span>` : ''}
          <span>· ${a.gente} ${a.gente === 1 ? 'persona' : 'personas'}</span></span>
      </a></li>`).join('')}</ul></div>`;

  app.innerHTML = html;

  const filaL = l => `<li>
      <a class="fila" href="${direccion('bajoSuCargo', l.id)}">
        <span class="fila-alto"><span class="nombre">${esc(l.nombre)}</span>
          ${l.cuida ? `<span class="sello">cuida a ${l.cuida}</span>` : ''}</span>
        <span class="sub">
          ${l.lidera ? `<span>${esc(l.lidera)}</span>` : '<span>solo cuidado</span>'}
          ${l.lo_cuida ? `<span>· lo cuida ${esc(l.lo_cuida)}</span>` : ''}</span>
      </a></li>`;

  // Se repinta solo la lista y no la pantalla: si se repintara todo,
  // el cursor saldría de la caja a la primera letra.
  const pintarJ = () => {
    const v = filtrar();
    document.getElementById('listaJ').innerHTML = v.length ? v.map(filaL).join('')
      : `<li><div class="vacio" style="margin:0"><strong>Nadie con «${esc(S.qJer.trim())}»</strong>
           Prueba con otra parte del nombre o del área.</div></li>`;
  };

  const cajaJ = document.getElementById('qj');
  cajaJ.oninput = e => {
    S.qJer = e.target.value;
    document.getElementById('limpiarJ').hidden = !S.qJer;
    pintarJ();
  };
  document.getElementById('limpiarJ').onclick = () => {
    S.qJer = ''; cajaJ.value = ''; cajaJ.focus();
    document.getElementById('limpiarJ').hidden = true; pintarJ();
  };
}

async function vBajoSuCargo(id){

    return app.innerHTML = `<div class="error">Esto lo manejan la dirección y el pastorado.</div>`;

    SB.from('directorio').select('*').eq('id', id).maybeSingle(),
    SB.rpc('gente_a_cargo', { p_lider: id }),
    SB.from('lideres_vista').select('id, nombre').order('nombre'),
    SB.from('areas_vista').select('id, nombre, tipo').eq('activa', true).order('nombre')
  ]);

    cabeza(esc(quien.nombre),

  if (!suyos.length){

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Su gente</h2>
      <span class="ruta-conteo" id="selJ">0 seleccionados</span></div>
    <ul class="registro">${suyos.map(g => `<li>
      <div class="fila" style="cursor:default;display:flex;align-items:flex-start;gap:12px">
        <label class="campo-op" style="margin-top:3px">

            ${g.fuera_de_su_rama ? '<span class="marca-est m-alerta">otra rama</span>' : ''}</span>

      </div>
      <label for="nuevoLider" style="margin-top:0">Pasarlos a otro líder</label>
      <select id="nuevoLider"><option value="">Elige un líder…</option>
        ${(lideres || []).filter(l => l.id !== id)
          .map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select>
      <div style="margin-top:12px"><button class="btn" id="moverCuidado">Mover el cuidado</button></div>

      <label for="nuevaArea">O meterlos a un área o una red</label>
      <select id="nuevaArea"><option value="">Elige un área…</option>
        ${(areas || []).map(a => `<option value="${a.id}">${esc(a.nombre)} · ${esc(a.tipo)}</option>`).join('')}</select>
      <div style="margin-top:12px"><button class="btn seco" id="moverArea">Meterlos al área</button></div>
    </div></div>`;

  if (sueltos)
    html += `<div class="vacio"><strong>${sueltos} ${sueltos === 1 ? 'persona está' : 'personas están'} en otra rama</strong>
      Las cuida ${esc(quien.nombre)} pero pertenecen a otra red. No es un error: pasa de verdad y queda a la vista para que la dirección lo decida.</div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir('jerarquias');

  const marcadas = () => [...app.querySelectorAll('[data-sel]:checked')].map(c => c.dataset.sel);
  const contar = () => {

    document.getElementById('selJ').textContent =

  };
  app.querySelectorAll('[data-sel]').forEach(c => c.onchange = contar);

    app.querySelectorAll('[data-sel]').forEach(c => c.checked = true); contar(); };

    const { data, error } = await SB.rpc('mover_cuidado_masivo',

    if (!destino) return avisar('Elige el área.', true);
    const nom = (areas || []).find(a => a.id === destino)?.nombre || 'esa área';
    if (!await confirmar(`¿Meter ${sel.length === 1 ? 'a 1 persona' : `a ${sel.length} personas`} a ${nom}?`,
      'Entran como participantes. No salen de las áreas donde ya están.', false)) return;
    const { data, error } = await SB.rpc('mover_area_masivo',
      { p_personas:sel, p_area:destino, p_rol:'participante', p_sacar_de:null });
    if (error) return avisar(error.message, true);
    avisar(`${data} ${data === 1 ? 'persona entró' : 'personas entraron'} a ${nom}.`);
    ir('bajoSuCargo', id);
  };
}
