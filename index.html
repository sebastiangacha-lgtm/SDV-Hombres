      <div style="margin-top:12px"><button class="btn seco" id="moverCuidadoA">Mover el cuidado</button></div>
    </div></div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir('jerarquias');
  engancharAgregar();

  const marcadas = () => [...app.querySelectorAll('[data-sel]:checked')].map(c => c.dataset.sel);
  const contar = () => {
    const n = marcadas().length;
    document.getElementById('selA').textContent = n === 1 ? '1 seleccionado' : `${n} seleccionados`;
  };
  app.querySelectorAll('[data-sel]').forEach(c => c.onchange = contar);
  document.getElementById('todosA').onclick = () => {
    app.querySelectorAll('[data-sel]').forEach(c => c.checked = true); contar(); };
  document.getElementById('ningunoA').onclick = () => {
    app.querySelectorAll('[data-sel]').forEach(c => c.checked = false); contar(); };

  document.getElementById('moverAreaA').onclick = async () => {
    const sel = marcadas(), destino = document.getElementById('areaDestino').value;
    const saca = document.getElementById('sacarDe').checked;
    if (!sel.length) return avisar('No has seleccionado a nadie.', true);
    if (!destino) return avisar('Elige el destino.', true);
    const nom = (areas || []).find(a => a.id === destino)?.nombre || 'esa área';
    if (!await confirmar(`¿Mover ${sel.length === 1 ? 'a 1 persona' : `a ${sel.length} personas`} a ${nom}?`,
      saca ? `Salen de ${area.nombre} y entran a ${nom}.` : `Entran a ${nom} y se quedan también en ${area.nombre}.`,
      false)) return;
    const { data, error } = await SB.rpc('mover_area_masivo',
      { p_personas:sel, p_area:destino, p_rol:'participante', p_sacar_de: saca ? id : null });
    if (error) return avisar(error.message, true);
    avisar(`${data} ${data === 1 ? 'persona quedó' : 'personas quedaron'} en ${nom}.`);
    ir('areaGente', id);
  };

  document.getElementById('moverCuidadoA').onclick = async () => {
    const sel = marcadas(), destino = document.getElementById('liderDestino').value;
    if (!sel.length) return avisar('No has seleccionado a nadie.', true);
    if (!destino) return avisar('Elige a quién pasárselos.', true);
    const nom = (lideres || []).find(l => l.id === destino)?.nombre || 'ese líder';
    if (!await confirmar(`¿Pasar ${sel.length === 1 ? 'a 1 persona' : `a ${sel.length} personas`} a ${nom}?`,
      'La cobertura anterior se cierra con la fecha de hoy y queda el rastro.', false)) return;
    const { data, error } = await SB.rpc('mover_cuidado_masivo',
      { p_personas:sel, p_lider:destino, p_nota:`Desde ${area.nombre}` });
    if (error) return avisar(error.message, true);
    avisar(`${data} ${data === 1 ? 'persona pasó' : 'personas pasaron'} a ${nom}.`);
    ir('areaGente', id);
  };

  function engancharAgregar(){
    const nuevas = () => [...app.querySelectorAll('[data-add]:checked')].map(c => c.dataset.add);
    const contarN = () => {
      const n = nuevas().length;
      document.getElementById('selN').textContent = n === 1 ? '1 seleccionado' : `${n} seleccionados`;
    };

    // Con mil personas no se pinta la lista entera: hasta que no se
    // escriba algo no hay nada que mostrar, y después van las
    // primeras veinte coincidencias.
    const pintarAdd = () => {
      const q = sinT((S.qAdd || '').trim());
      const ul = document.getElementById('listaAdd');
      if (!ul) return;
      if (q.length < 2){
        ul.innerHTML = `<li><div class="tarjeta-cuerpo" style="padding-top:0">
          <span class="sub"><span>Escribe al menos dos letras para buscar</span></span></div></li>`;
        contarN(); return;
      }
      const hay = (dir || []).filter(d => !dentro.has(d.id) &&
        (sinT(d.nombre).includes(q) || sinT(d.correo).includes(q) || sinT(d.celular).includes(q)));
      ul.innerHTML = hay.length ? hay.slice(0,20).map(d => `<li>
        <div class="fila" style="cursor:default;display:flex;align-items:flex-start;gap:12px">
          <label class="campo-op" style="margin-top:3px">
            <input type="checkbox" data-add="${d.id}"></label>
          <span style="flex:1;min-width:0">
            <span class="fila-alto"><span class="nombre">${esc(d.nombre)}</span>
              ${d.estado === 'visitante' ? '<span class="sello">Visitante</span>' : ''}</span>
            <span class="sub">${d.correo ? `<span>${esc(d.correo)}</span>` : '<span>sin correo</span>'}
              ${d.celular ? `<span>· ${esc(d.celular)}</span>` : ''}</span>
          </span></div></li>`).join('') +
          (hay.length > 20 ? `<li><div class="tarjeta-cuerpo" style="padding-top:0">
            <span class="sub"><span>y ${hay.length - 20} más · afina la búsqueda</span></span></div></li>` : '')
        : `<li><div class="tarjeta-cuerpo" style="padding-top:0">
            <span class="sub"><span>Nadie con «${esc((S.qAdd||'').trim())}» por fuera de esta área</span></span></div></li>`;
      app.querySelectorAll('[data-add]').forEach(c => c.onchange = contarN);
      contarN();
    };
    pintarAdd();
    engancharBusqueda('qAdd', v => { S.qAdd = v; pintarAdd(); });

    const ba = document.getElementById('agregarA');
    if (ba) ba.onclick = async () => {
      const sel = nuevas();
      if (!sel.length) return avisar('No has seleccionado a nadie.', true);
      const rol = document.getElementById('rolNuevo').value;
      if (!await confirmar(`¿Agregar ${sel.length === 1 ? 'a 1 persona' : `a ${sel.length} personas`} a ${area.nombre}?`,
        `Entran como ${ROLES_AREA[rol].toLowerCase()}. Se pueden sacar después.`, false)) return;
      const { data, error } = await SB.rpc('mover_area_masivo',
        { p_personas:sel, p_area:id, p_rol:rol, p_sacar_de:null });
      if (error) return avisar(error.message, true);
      S.qAdd = '';
      avisar(`${data} ${data === 1 ? 'persona entró' : 'personas entraron'} a ${area.nombre}.`);
      ir('areaGente', id);
    };
  }
}


/* ============================================================
   Oración — el tablero del proceso de caballeros
   ------------------------------------------------------------
   El documento de Pedro pide tres indicadores y un semáforo de
   dos y tres ausencias. Todo eso se calcula en la base; aquí solo
   se pinta. Lo que la pantalla sí decide es el orden: primero el
   viernes que viene, después quién se está soltando, y de último
   los números. Un líder abre esto un jueves por la noche para
   saber a quién escribirle, no para ver un promedio.
   ============================================================ */
const ESTADOS_LISTA = { presente:'Presente', ausente:'Ausente', permiso:'Con permiso' };

async function vOracion(){
  cargando();
  const yo = V();
  const { data:serie, error } = await SB.from('oracion_resumen').select('*').limit(1).maybeSingle();
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;
  // Sin resumen hay dos casos distintos y dan pantallas distintas:
  // o no existe el proceso, o existe y esta persona no lo dirige.
  // Al segundo se le muestra lo suyo: el calendario y cómo va él.
  if (!serie){
    const { data:mio } = await SB.from('oracion_padron').select('*');
    const { data:cal } = await SB.from('oracion_sesiones').select('*').order('fecha');
    if (!mio || !mio.length)
      return app.innerHTML = `<div class="vacio"><strong>Todavía no hay un proceso de oración</strong>
        Cuando se cree la serie, aquí van a salir las sesiones y los indicadores.</div>`;
    return vOracionMia(mio[0], cal || []);
  }

  const [{ data:ses }, { data:padron }, { data:invitados }] = await Promise.all([
    SB.from('oracion_sesiones').select('*').eq('serie_id', serie.serie_id).order('fecha'),
    SB.from('oracion_padron').select('*').eq('serie_id', serie.serie_id),
    SB.from('oracion_invitados').select('*').eq('serie_id', serie.serie_id)
      .order('veces', { ascending:false })
  ]);

  const hoyF = hoy();
  const sesiones = ses || [];
  const proxima  = sesiones.find(s => s.fecha >= hoyF);
  const pasadas  = sesiones.filter(s => s.fecha < hoyF).reverse();
  const porVenir = sesiones.filter(s => s.fecha > hoyF);
  const sinLista = sesiones.filter(s => s.fecha < hoyF && !s.paso_lista);
  const puede    = yo.es_admin || yo.ve_todo || yo.puede_cuidar;

  let html = cabeza('Oración', esc(serie.nombre),
    `<button class="btn seco" id="bajarCal">Descargar el calendario</button>`);

  // ---------- el viernes que viene ----------
  if (proxima){
    const falta = Math.round((new Date(proxima.fecha + 'T00:00:00') - new Date(hoyF + 'T00:00:00')) / 86400000);
    html += `<div class="tarjeta"><div class="tarjeta-alto">
        <h2>${falta === 0 ? 'Hoy' : falta === 1 ? 'Mañana' : `En ${falta} días`}</h2>
        ${puede ? `<a class="btn" href="${direccion('lista_oracion', proxima.id)}">Pasar lista</a>` : ''}
      </div><div class="tarjeta-cuerpo">
        <p style="margin:0 0 4px;font-size:19px;font-weight:600">${esc(proxima.tema || proxima.nombre)}</p>
        <span class="sub"><span>${fechaCorta(proxima.fecha)}</span>
          ${proxima.hora ? `<span>· ${esc(proxima.hora.slice(0,5))}</span>` : ''}
          ${proxima.lugar ? `<span>· ${esc(proxima.lugar)}</span>` : ''}</span>
        <div class="par" style="margin-top:16px">
          <div><label style="margin-top:0">Lidera</label>
            <p style="margin:0;font-weight:600">${proxima.lidera ? esc(proxima.lidera)
              : '<span style="color:var(--ambar)">Sin asignar</span>'}</p></div>
          <div><label style="margin-top:0">Apoya</label>
            <p style="margin:0;font-weight:600">${proxima.apoya ? esc(proxima.apoya)
              : '<span style="color:var(--ambar)">Sin asignar</span>'}</p></div>
        </div>
      </div></div>`;
  }

  // ---------- quién se está soltando ----------
  const rojos    = (padron || []).filter(p => p.semaforo === 'rojo');
  const amarillos= (padron || []).filter(p => p.semaforo === 'amarillo');
  const conPermiso = (padron || []).filter(p => p.semaforo === 'verde' && p.permisos >= 3);

  if (rojos.length || amarillos.length || conPermiso.length){
    const fila = (p, clase, texto) => `<li><a class="fila" href="${direccion('ficha', p.persona_id)}">
      <span class="fila-alto"><span class="nombre">${esc(p.nombre)}</span>
        <span class="marca-est ${clase}">${texto}</span></span>
      <span class="sub"><span>${p.presentes} de ${p.sesiones} sesiones</span>
        ${p.permisos ? `<span>· ${p.permisos} con permiso</span>` : ''}
        ${p.ultima_vez ? `<span>· última vez ${fechaCorta(p.ultima_vez)}</span>`
                       : '<span>· no ha venido</span>'}</span>
    </a></li>`;

    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>A quién escribirle</h2></div>
      <ul class="registro">
        ${rojos.map(p => fila(p, 'm-desconectado',
            `${p.ausencias_seguidas} seguidas`)).join('')}
        ${amarillos.map(p => fila(p, 'm-alerta',
            `${p.ausencias_seguidas} seguidas`)).join('')}
        ${conPermiso.map(p => fila(p, 'm-alerta', `${p.permisos} permisos`)).join('')}
      </ul></div>`;
  } else if (serie.sesiones_hechas > 0){
    html += `<div class="vacio"><strong>Nadie se está soltando</strong>
      Ningún hombre del padrón lleva dos viernes seguidos sin conectarse.</div>`;
  }

  // ---------- los invitados ----------
  // El que vino una vez es una visita. El que lleva tres viernes ya
  // decidió quedarse y nadie se lo ha dicho todavía: por eso la
  // columna que manda el orden es cuántas veces vino.
  if ((invitados || []).length){
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Invitados</h2>
        <span class="sub"><span>no cuentan en los porcentajes</span></span></div>
      <ul class="registro">${invitados.map(v => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(v.nombre)}</span>
          <span class="marca-est ${v.veces >= 3 ? 'm-cuidado' : 'm-alerta'}">${v.veces} ${v.veces === 1 ? 'vez' : 'veces'}</span></span>
        <span class="sub">
          ${v.celular ? `<span>${esc(v.celular)}</span>` : '<span>sin celular</span>'}
          <span>· desde ${fechaCorta(v.primera_vez)}</span>
          ${v.lo_trajo ? `<span>· lo trajo ${esc(v.lo_trajo)}</span>` : ''}</span>
        ${yo.es_admin || yo.ve_todo ? `<span style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
          <button class="btn chico" data-sumar="${v.persona_id}" data-nom="${esc(v.nombre)}">Pasarlo al padrón</button>
          ${v.celular ? `<a class="btn seco chico" target="_blank" rel="noopener"
             href="https://wa.me/57${esc(v.celular)}">Escribirle</a>` : ''}
        </span>` : ''}
      </div></li>`).join('')}</ul></div>`;
  }

  // ---------- las listas que faltan por pasar ----------
  if (puede && sinLista.length){
    html += `<div class="tarjeta"><div class="tarjeta-alto">
        <h2>Sesiones sin lista</h2></div>
      <ul class="registro">${sinLista.slice(0,6).map(s => `<li>
        <a class="fila" href="${direccion('lista_oracion', s.id)}">
          <span class="fila-alto"><span class="nombre">${fechaCorta(s.fecha)}</span>
            <span class="marca-est m-alerta">falta la lista</span></span>
          <span class="sub"><span>${esc(s.tema || s.nombre)}</span></span>
        </a></li>`).join('')}</ul></div>`;
  }

  // ---------- los tres indicadores ----------
  const meta = serie.meta_asistencia || 70;
  const col = (v, m) => v == null ? 'azul' : v >= m ? 'verde' : v >= m - 15 ? 'ambar' : 'barro';
  const pct = v => v == null ? '—' : v + '%';

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Cómo va el proceso</h2></div>
    <div class="tarjeta-cuerpo">` + cifras([
      { icono:'personas', color:col(serie.asistencia_ultima, meta),
        valor:pct(serie.asistencia_ultima), texto:`conectados la última vez · meta ${meta}%` },
      { icono:'reloj', color:col(serie.asistencia_promedio, meta),
        valor:pct(serie.asistencia_promedio), texto:'promedio de todas las sesiones' },
      { icono:'alerta', color:col(serie.retencion_90, 65),
        valor:pct(serie.retencion_90), texto:'retención a 90 días · meta 65%' },
      { icono:'oracion', color:serie.intercesores_mes >= 2 ? 'verde' : 'ambar',
        valor:serie.intercesores_mes || 0, texto:'guiaron el clamor este mes · meta 2' }
    ]) + `<span class="sub" style="margin-top:12px">
      <span>${serie.padron} hombres en el padrón</span>
      <span>· ${serie.sesiones_hechas} de ${serie.sesiones_totales} sesiones con lista</span></span>
    </div></div>`;

  // ---------- el calendario ----------
  // La asistencia solo se muestra en sesiones que ya pasaron. Una
  // fila suelta con fecha futura no puede anunciar que vinieron 14.
  const tarjetaSes = s => `<li><div class="fila" style="cursor:default">
      <a href="${direccion('lista_oracion', s.id)}" style="display:block;color:inherit;text-decoration:none">
        <span class="fila-alto"><span class="nombre"${s.estado === 'cancelado'
            ? ' style="text-decoration:line-through;opacity:.6"' : ''}>${esc(s.tema || s.nombre)}</span>
          ${s.estado === 'cancelado' ? '<span class="marca-est m-desconectado">cancelada</span>'
            : s.paso_lista && s.fecha <= hoyF
              ? `<span class="marca-est m-cuidado">${s.presentes} vinieron</span>` : ''}</span>
        <span class="sub"><span>${fechaCorta(s.fecha)}</span>
          ${s.movido_de ? `<span>· movida del ${fechaCorta(s.movido_de)}</span>` : ''}
          ${s.lidera ? `<span>· lidera ${esc(s.lidera)}</span>` : ''}
          ${s.apoya ? `<span>· apoya ${esc(s.apoya)}</span>` : ''}
          ${s.motivo_cambio ? `<span>· ${esc(s.motivo_cambio)}</span>` : ''}</span>
      </a>
      ${puede && s.fecha >= hoyF ? `<span style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
        ${s.estado === 'cancelado'
          ? `<button class="btn seco chico" data-react="${s.id}">Volver a programarla</button>`
          : `<button class="btn seco chico" data-mover="${s.id}" data-f="${s.fecha}"
               data-t="${esc(s.tema || s.nombre)}">Cambiar la fecha</button>
             <button class="btn rojo chico" data-cancel="${s.id}"
               data-t="${esc(s.tema || s.nombre)}">Cancelar</button>`}
      </span>` : ''}
    </div></li>`;

  if (porVenir.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Lo que viene</h2>
        <span class="sub"><span>${porVenir.length} sesiones</span></span></div>
      <ul class="registro">${porVenir.slice(0,8).map(tarjetaSes).join('')}</ul></div>`;

  if (pasadas.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Lo que ya pasó</h2></div>
      <ul class="registro">${pasadas.slice(0,8).map(tarjetaSes).join('')}</ul></div>`;

  app.innerHTML = html;

  // ---------- el calendario entero en un archivo ----------
  // Un solo archivo con las 36 sesiones: cada uno lo abre una vez y
  // le quedan todas agendadas. Se reparte por WhatsApp o por correo
  // desde la cuenta de quien lidera; la plataforma todavía no manda
  // correos por su cuenta.
  document.getElementById('bajarCal').onclick = () => {
    const vivas = sesiones.filter(s => s.estado !== 'cancelado');
    if (!vivas.length) return avisar('No hay sesiones por agendar.', true);
    const sello = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
    const limpio = t => String(t || '').replace(/[\\;,]/g, ' ').replace(/\n/g, ' ');
    const masUna = (f, h) => {       // media hora después, sin librerías
      const [H,M] = (h || '06:30').slice(0,5).split(':').map(Number);
      const d = new Date(Date.UTC(2000,0,1,H,M)); d.setUTCMinutes(d.getUTCMinutes() + 30);
      return String(d.getUTCHours()).padStart(2,'0') + String(d.getUTCMinutes()).padStart(2,'0') + '00';
    };
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SDV//Oración//ES','CALSCALE:GREGORIAN',
      `X-WR-CALNAME:${limpio(serie.nombre)}`]
      .concat(vivas.flatMap(s => {
        const f = s.fecha.replace(/-/g,'');
        const h = (s.hora || '06:30').slice(0,5).replace(':','') + '00';
        return ['BEGIN:VEVENT', `UID:${s.id}@sdv`, `DTSTAMP:${sello}`,
          `DTSTART;TZID=America/Bogota:${f}T${h}`,
          `DTEND;TZID=America/Bogota:${f}T${masUna(s.fecha, s.hora)}`,
          `SUMMARY:${limpio(s.nombre)} — ${limpio(s.tema)}`,
          s.lugar ? `LOCATION:${limpio(s.lugar)}` : '',
          `DESCRIPTION:${limpio(s.tema)}${s.lidera ? '. Lidera: ' + limpio(s.lidera) : ''}${s.apoya ? '. Apoya: ' + limpio(s.apoya) : ''}`,
          'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY',
          `DESCRIPTION:${limpio(s.nombre)}`,'END:VALARM','END:VEVENT'].filter(Boolean);
      }))
      .concat(['END:VCALENDAR']).join('\r\n');

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar;charset=utf-8' }));
    a.download = 'oracion-de-caballeros.ics';
    a.click(); URL.revokeObjectURL(a.href);
    avisar(`${vivas.length} sesiones en el archivo. Repártelo y cada uno las agenda todas de una.`);
  };

  // ---------- cancelar, reprogramar, volver a programar ----------
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    const motivo = await pedirTexto('Cancelar la sesión', {
      texto: `«${b.dataset.t}». Queda marcada como cancelada y deja de contar para la asistencia y el semáforo. Se puede volver a programar.`,
      marcador: 'Navidad, por ejemplo' });
    if (motivo == null) return;
    const { error } = await SB.rpc('cancelar_sesion', { p_evento:b.dataset.cancel, p_motivo:motivo });
    if (error) return avisar(error.message, true);
    avisar('Sesión cancelada.'); ir('oracion');
  });

  app.querySelectorAll('[data-sumar]').forEach(b => b.onclick = async () => {
    if (!await confirmar(`¿Pasar a ${b.dataset.nom} al padrón?`,
      'Deja de ser visitante, entra al área de Oración y desde el próximo viernes cuenta en los indicadores y en el semáforo como todos los demás.', false)) return;
    const { error } = await SB.rpc('sumar_al_padron',
      { p_persona:b.dataset.sumar, p_serie:serie.serie_id });
    if (error) return avisar(error.message, true);
    avisar(`${b.dataset.nom.split(' ')[0]} ya es del padrón.`);
    ir('oracion');
  });

  app.querySelectorAll('[data-react]').forEach(b => b.onclick = async () => {
    const { error } = await SB.rpc('reactivar_sesion', { p_evento:b.dataset.react });
    if (error) return avisar(error.message, true);
    avisar('Vuelve a estar programada.'); ir('oracion');
  });

  app.querySelectorAll('[data-mover]').forEach(b => b.onclick = async () => {
    const r = await dialogo({
      titulo: 'Cambiar la fecha',
      texto: `«${b.dataset.t}». La sesión se mueve, no se borra: conserva su tema y su pareja.`,
      cuerpo: `<label for="mvF" style="margin-top:0">Nueva fecha</label>
               <input type="date" id="mvF" value="${b.dataset.f}">
               <label for="mvH">Hora</label><input type="time" id="mvH" value="06:30">
               <label for="mvM">Por qué se mueve</label>
               <input type="text" id="mvM" placeholder="Cae en año nuevo">`,
      aceptar: 'Moverla',
      alMontar: v => () => {
        const f = v.querySelector('#mvF').value;
        if (!f){ v.querySelector('#mvF').focus(); return undefined; }
        return { f, h: v.querySelector('#mvH').value || null, m: v.querySelector('#mvM').value.trim() };
      }
    });
    if (!r) return;
    const { error } = await SB.rpc('mover_sesion',
      { p_evento:b.dataset.mover, p_fecha:r.f, p_hora:r.h, p_motivo:r.m || null });
    if (error) return avisar(error.message, true);
    avisar('Sesión movida.'); ir('oracion');
  });
}


/* ------------------------------------------------------------
   Oración, para quien no dirige el proceso
   ------------------------------------------------------------
   Lo suyo y nada más: cómo va él, cuándo le toca liderar, y el
   calendario. Ni el semáforo de los demás ni los indicadores.
   ------------------------------------------------------------ */
function vOracionMia(mio, cal){
  const hoyF = hoy();
  const proxima = cal.find(s => s.fecha >= hoyF && s.estado !== 'cancelado');
  const mias    = cal.filter(s => s.fecha >= hoyF &&
                   (s.lidera_id === S.yo.persona_id || s.apoya_id === S.yo.persona_id));

  let html = cabeza('Oración', 'Proceso de Oración de Caballeros');

  if (proxima)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>La próxima</h2></div>
      <div class="tarjeta-cuerpo">
        <p style="margin:0 0 4px;font-size:19px;font-weight:600">${esc(proxima.tema || proxima.nombre)}</p>
        <span class="sub"><span>${fechaCorta(proxima.fecha)}</span>
          ${proxima.hora ? `<span>· ${esc(proxima.hora.slice(0,5))}</span>` : ''}
          ${proxima.lidera ? `<span>· lidera ${esc(proxima.lidera)}</span>` : ''}</span>
      </div></div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Cómo vas</h2></div>
    <div class="tarjeta-cuerpo">` + cifras([
      { icono:'oracion', color:'verde', valor:mio.presentes ?? 0, texto:'veces que has venido' },
      { icono:'reloj',   color:'azul',  valor:mio.sesiones ?? 0,  texto:'sesiones hasta ahora' },
      { icono:'alerta',  color:(mio.ausencias_seguidas ?? 0) >= 2 ? 'ambar' : 'verde',
        valor:mio.ausencias_seguidas ?? 0, texto:'seguidas sin venir' }
    ]) + `</div></div>`;

  if (mias.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Cuándo te toca</h2></div>
      <ul class="registro">${mias.map(s => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(s.tema || s.nombre)}</span>
          <span class="sello">${s.lidera_id === S.yo.persona_id ? 'Lideras' : 'Apoyas'}</span></span>
        <span class="sub"><span>${fechaCorta(s.fecha)}</span></span>
      </div></li>`).join('')}</ul></div>`;

  const porVenir = cal.filter(s => s.fecha > hoyF);
  if (porVenir.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Lo que viene</h2></div>
      <ul class="registro">${porVenir.slice(0,8).map(s => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre"${s.estado === 'cancelado'
          ? ' style="text-decoration:line-through;opacity:.6"' : ''}>${esc(s.tema || s.nombre)}</span></span>
        <span class="sub"><span>${fechaCorta(s.fecha)}</span>
          ${s.lidera ? `<span>· lidera ${esc(s.lidera)}</span>` : ''}</span>
      </div></li>`).join('')}</ul></div>`;

  app.innerHTML = html;
}


/* ------------------------------------------------------------
   Pasar lista — los tres estados, en una sola guardada
   ------------------------------------------------------------
   Se manda todo junto y no persona por persona: a las 7 de la
   mañana, con mala señal, media lista guardada es peor que
   ninguna.
   ------------------------------------------------------------ */
async function vPasarLista(id){
  cargando();
  if (!id) return ir('oracion');
  const yo = V();

  const [{ data:ses }, { data:serie }] = await Promise.all([
    SB.from('oracion_sesiones').select('*').eq('id', id).maybeSingle(),
    SB.from('oracion_resumen').select('*').limit(1).maybeSingle()
  ]);
  if (!ses) return app.innerHTML = `<div class="error">No se encontró esa sesión.</div>`;

  const puede = yo.es_admin || yo.ve_todo ||
                ses.lidera_id === S.yo.persona_id || ses.apoya_id === S.yo.persona_id;

  const [{ data:padron }, { data:marcas }, { data:dir }] = await Promise.all([
    SB.from('oracion_padron').select('*').eq('serie_id', ses.serie_id).order('nombre'),
    SB.from('asistencias').select('persona_id, estado').eq('evento_id', id),
    SB.from('directorio').select('id, nombre')
  ]);

  // Quien no lidera esta mañana ni dirige el proceso no entra a la
  // toma de lista: ve de qué se trata la sesión y ya. Antes caía en
  // la lista con los botones apagados, que es peor — parece que la
  // herramienta se le dañó.
  if (!puede){
    app.innerHTML = `<button class="volver" id="atras">← Volver a Oración</button>` +
      cabeza(esc(ses.tema || ses.nombre),
        `${fechaCorta(ses.fecha)}${ses.hora ? ' · ' + esc(ses.hora.slice(0,5)) : ''}${ses.lugar ? ' · ' + esc(ses.lugar) : ''}`) +
      `<div class="tarjeta"><div class="tarjeta-cuerpo">
        <div class="par">
          <div><label style="margin-top:0">Lidera</label>
            <p style="margin:0;font-weight:600">${ses.lidera ? esc(ses.lidera) : '—'}</p></div>
          <div><label style="margin-top:0">Apoya</label>
            <p style="margin:0;font-weight:600">${ses.apoya ? esc(ses.apoya) : '—'}</p></div>
        </div>
        ${ses.estado === 'cancelado'
          ? `<p style="margin:16px 0 0"><span class="marca-est m-desconectado">cancelada</span>
             ${ses.motivo_cambio ? ' ' + esc(ses.motivo_cambio) : ''}</p>`
          : ses.paso_lista
            ? `<p style="margin:16px 0 0;color:var(--suave);font-size:14.5px">Vinieron ${ses.presentes}${ses.permisos ? `, ${ses.permisos} con permiso` : ''}.</p>`
            : ''}
      </div></div>`;
    document.getElementById('atras').onclick = () => ir('oracion');
    return;
  }

  const puesto = new Map((marcas || []).map(m => [m.persona_id, m.estado]));

  // Quien aparece en la lista de esta mañana sin estar en el padrón
  // es un invitado. Va al final y marcado como tal: cuenta como
  // presente en la reunión, pero no entra en los porcentajes.
  const nombres  = new Map((dir || []).map(d => [d.id, d.nombre]));
  const delPadron = new Set((padron || []).map(p => p.persona_id));
  const invitados = (marcas || [])
    .filter(m => !delPadron.has(m.persona_id))
    .map(m => ({ persona_id:m.persona_id, nombre:nombres.get(m.persona_id) || 'Invitado',
                 invitado:true, semaforo:'verde', presentes:0, sesiones:0, permisos:0 }));

  const gente = [...(padron || []), ...invitados];

  // Quien abre una lista nueva casi siempre va a marcar presente a
  // la mayoría: arrancar en presente ahorra 14 toques y deja solo
  // los que faltaron.
  const estado = new Map(gente.map(p => [p.persona_id, puesto.get(p.persona_id) || 'presente']));

  let html = `<button class="volver" id="atras">← Volver a Oración</button>` +
    cabeza(esc(ses.tema || ses.nombre),
      `${fechaCorta(ses.fecha)}${ses.hora ? ' · ' + esc(ses.hora.slice(0,5)) : ''}` +
      `${ses.lidera ? ' · lidera ' + esc(ses.lidera) : ''}`,
      puede ? `<button class="btn" id="guardarLista">Guardar lista</button>` : '');

  if (!puede){
    html += `<div class="vacio"><strong>Solo pasa lista quien está asignado</strong>
      La lista de esta sesión la marca quien lidera, quien apoya, o quien administra.</div>`;
  }

  if (puede) html += `<div id="formInv" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="par"><div><label for="ivn" style="margin-top:0">Nombre</label>
        <input id="ivn" type="text" placeholder="Como se presentó"></div>
        <div><label for="ivc" style="margin-top:0">Celular</label>
        <input id="ivc" type="text" inputmode="numeric" placeholder="Opcional"></div></div>
      <div style="margin-top:14px"><button class="btn" id="guardarInv">Agregar</button></div>
    </div></div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>El padrón</h2>
      <span class="sub"><span id="cuenta"></span></span>
      ${puede ? `<button class="btn seco chico" id="verInv">Agregar invitado</button>` : ''}</div>
    <ul class="registro" id="listaO">${gente.map(p => `<li>
      <div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(p.nombre)}</span>
          ${p.invitado ? '<span class="sello">Invitado</span>'
            : p.semaforo === 'rojo' ? '<span class="marca-est m-desconectado">venía faltando</span>'
            : p.semaforo === 'amarillo' ? '<span class="marca-est m-alerta">venía faltando</span>' : ''}</span>
        <span style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
          ${Object.entries(ESTADOS_LISTA).map(([v,t]) =>
            `<button class="btn ${v === 'presente' ? '' : 'seco '}chico" data-p="${p.persona_id}" data-e="${v}"
               ${puede ? '' : 'disabled'}>${t}</button>`).join('')}
        </span>
      </div></li>`).join('')}</ul>
    ${puede ? `<div class="tarjeta-cuerpo" style="border-top:1px solid var(--linea-suave)">
      <button class="btn" id="guardarLista2" style="width:100%">Guardar lista</button></div>` : ''}
    </div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir('oracion');

  // Pinta el botón escogido de cada fila y la cuenta de arriba.
  const pintar = () => {
    document.querySelectorAll('[data-p]').forEach(b => {
      const elegido = estado.get(b.dataset.p) === b.dataset.e;
      b.classList.toggle('seco', !elegido);
      b.classList.toggle('rojo', elegido && b.dataset.e === 'ausente');
    });
    const n = [...estado.values()].filter(e => e === 'presente').length;
    const pm = [...estado.values()].filter(e => e === 'permiso').length;
    document.getElementById('cuenta').textContent =
      `${n} de ${gente.length} presentes` + (pm ? ` · ${pm} con permiso` : '');
  };
  pintar();

  document.querySelectorAll('[data-p]').forEach(b => {
    b.onclick = () => { estado.set(b.dataset.p, b.dataset.e); pintar(); };
  });

  // Dos botones, uno arriba y otro al final de la lista: con 16
  // hombres en un celular, el de arriba queda cuatro pantallas atrás
  // justo cuando se acaba de terminar de marcar.
  const vi = document.getElementById('verInv');
  if (vi) vi.onclick = () => {
    const f = document.getElementById('formInv');
    f.hidden = !f.hidden;
    vi.textContent = f.hidden ? 'Agregar invitado' : 'Cancelar';
    if (!f.hidden) document.getElementById('ivn').focus();
  };

  const gi = document.getElementById('guardarInv');
  if (gi) gi.onclick = async () => {
    const nom = document.getElementById('ivn').value.trim();
    if (!nom) return avisar('Ponle el nombre.', true);
    gi.disabled = true;
    const { error } = await SB.rpc('sumar_visitante', {
      p_evento:id, p_nombre:nom,
      p_celular:document.getElementById('ivc').value.trim() || null });
    gi.disabled = false;
    if (error) return avisar(error.message, true);
    avisar(`${nom.split(' ')[0]} quedó en la lista.`);
    ir('lista_oracion', id);
  };

  const botones = ['guardarLista','guardarLista2'].map(x => document.getElementById(x)).filter(Boolean);
  const guardar = async () => {
    botones.forEach(b => b.disabled = true);
    const { error } = await SB.rpc('pasar_lista', {
      p_evento: id,
      p_marcas: gente.map(p => ({ persona_id:p.persona_id, estado:estado.get(p.persona_id) }))
    });
    if (error){ avisar(error.message, true); botones.forEach(b => b.disabled = false); return; }
    avisar('Lista guardada.');
    ir('oracion');
  };
  botones.forEach(b => b.onclick = guardar);
}


async function vServicio(){
  cargando();
  const yo = V();

  const [{ data:mias }, { data:fechas, error }, { data:areas }] = await Promise.all([
    SB.from('servidores_por_area').select('*').eq('persona_id', S.yo.persona_id),
    SB.from('mis_fechas_servicio').select('*').order('fecha'),
    SB.from('areas_vista').select('*').eq('activa', true).order('nombre')
  ]);
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;

  const hoyF = hoy();
  const proximas = (fechas || []).filter(f => f.fecha >= hoyF);
  const pasadas  = (fechas || []).filter(f => f.fecha <  hoyF);
  const misAreas = (mias || []).filter(m => (areas || []).some(a => a.id === m.area_id));
  const sinConfirmar = proximas.filter(f => !f.confirmado).length;

  let html = cabeza('Mi servicio', 'Tus áreas y las fechas en que sirves');

  html += cifras([
    { icono:'area',       color:'azul',  valor:misAreas.length,   texto:misAreas.length === 1 ? 'área' : 'áreas' },
    { icono:'eventos',    color:'verde', valor:proximas.length,   texto:'fechas por venir' },
    { icono:'alerta',     color:'ambar', valor:sinConfirmar,      texto:'por confirmar' },
    { icono:'personas', color:'verde', valor:pasadas.length,    texto:'veces servidas' }
  ]);

  if (proximas.length){
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Cuándo sirves</h2></div>
      <ul class="registro">${proximas.map(f => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(f.nombre)}</span>
          <span class="sello">${f.rol === 'encargado' ? 'Encargado' : esc(f.area || 'Servidor')}</span></span>
        <span class="sub"><span>${fechaCorta(f.fecha)}${f.hora ? ' · ' + esc(f.hora.slice(0,5)) : ''}</span>
          ${f.lugar ? `<span>· ${esc(f.lugar)}</span>` : ''}
          ${f.confirmado ? '<span class="marca-est m-cuidado">confirmado</span>' : ''}</span>
        <span style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
          ${f.confirmado ? '' : `<button class="btn chico" data-conf="${f.asignacion_id}">Confirmar</button>`}
          <button class="btn seco chico" data-ics="${f.evento_id}">Agregar a mi calendario</button></span>
      </div></li>`).join('')}</ul></div>`;
  } else {
    html += `<div class="vacio"><strong>No tienes fechas por venir</strong>
      Cuando te asignen a un evento, aquí vas a ver cuándo, dónde y con qué rol.</div>`;
  }

  if (misAreas.length){
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Tus áreas</h2></div>
      <ul class="registro">${misAreas.map(m => `<li><a class="fila" href="#/area/${m.area_id}" data-area="${m.area_id}">
        <span class="fila-alto"><span class="nombre">${esc(m.area)}</span>
          ${selloRol(m.rol_en_area)}</span>
        <span class="sub"><span>Novedades, material y capacitación</span></span>
      </a></li>`).join('')}</ul></div>`;
  } else {
    html += `<div class="vacio"><strong>Todavía no estás en un área de servicio</strong>
      ${yo.es_admin ? 'Asígnate una abajo.' : 'Pídele a quien administra que te agregue.'}</div>`;
  }

  if (areas && areas.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Todas las áreas</h2></div>
      <ul class="registro">${areas.filter(a => !misAreas.some(m => m.area_id === a.id)).map(a =>
        `<li><div class="fila" style="cursor:default;display:flex;align-items:center;gap:12px">
          <button style="flex:1;background:none;border:0;text-align:left;cursor:pointer;padding:0" data-area="${a.id}">
            <span class="nombre">${esc(a.nombre)}</span>
            <span class="sub">${a.cabeza
              ? `<span>${a.cabeza_rol === 'encargado' ? 'Encargado' : 'Cabeza'}
                   <b style="color:var(--texto);font-weight:600">${esc(a.cabeza)}</b></span>`
              : `<span style="color:var(--ambar);font-weight:600">Sin cabeza</span>`}
              ${a.lideres ? `<span>· Líderes
                   <b style="color:var(--texto);font-weight:600">${esc(a.lideres)}</b></span>` : ''}
              <span>· ${a.gente} ${a.gente === 1 ? 'persona' : 'personas'}</span></span></button>
          ${yo.es_admin ? `<button class="btn rojo chico" data-borrararea="${a.id}" data-noma="${esc(a.nombre)}">Eliminar</button>` : ''}
        </div></li>`).join('')}</ul></div>`;

  if (yo.es_admin)
    html += `<div style="margin-top:4px"><button class="btn seco" id="admAreas">Administrar áreas de servicio</button></div>
      <div id="formArea" hidden class="tarjeta" style="margin-top:12px"><div class="tarjeta-cuerpo">
        <label for="an" style="margin-top:0">Nombre del área</label>
        <input id="an" type="text" placeholder="Multimedia, Logística…">
        <div style="margin-top:14px"><button class="btn" id="guardarArea">Crear área</button></div>
        <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--linea-suave)">
          <label style="margin-top:0" for="aq">Agregar alguien a un área</label>
          <div class="par"><div><select id="aq"></select></div>
            <div><select id="ap"></select></div></div>
          <div class="par" style="margin-top:10px"><div><select id="ar">
            ${['participante','cabeza','lider','colider','encargado'].map(v =>
              `<option value="${v}">${ROLES_AREA[v]}</option>`).join('')}</select></div>
            <div><button class="btn" id="guardarMiembro" style="width:100%">Agregar al área</button></div></div>
        </div>
      </div></div>`;

  app.innerHTML = html;
  app.querySelectorAll('[data-area]').forEach(b => b.onclick = () => ir('area', b.dataset.area));

  app.querySelectorAll('[data-borrararea]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar esta área?', `«${b.dataset.noma}» sale del perfil de todos y se van sus novedades.`)) return;
    const { error } = await SB.from('areas').delete().eq('id', b.dataset.borrararea);
    if (error) return avisar(error.message, true);
    avisar('Área eliminada.'); ir('servicio');
  });

  app.querySelectorAll('[data-conf]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('evento_equipo').update({ confirmado:true }).eq('id', b.dataset.conf);
    if (error) return avisar(error.message, true);
    avisar('Confirmado.');
    ir('servicio');
  });

  app.querySelectorAll('[data-ics]').forEach(b => b.onclick = async () => {
    const f = (fechas || []).find(x => x.evento_id === b.dataset.ics);
    const { data:ev } = await SB.from('eventos').select('*').eq('id', b.dataset.ics).maybeSingle();
    if (ev) descargarIcs(ev, f.rol === 'encargado' ? 'Encargado' : (f.area || 'Servidor'));
  });

  const aa = document.getElementById('admAreas');
  if (aa){
    aa.onclick = () => {
      const f = document.getElementById('formArea');
      f.hidden = !f.hidden;
      aa.textContent = f.hidden ? 'Administrar áreas de servicio' : 'Cancelar';
    };
    const { data:dir } = await SB.from('directorio').select('*').order('nombre');
    const selP = document.getElementById('aq'), selA = document.getElementById('ap');
    if (selP) selP.innerHTML = (dir || []).map(d => `<option value="${d.id}">${esc(d.nombre)}</option>`).join('');
    if (selA) selA.innerHTML = (areas || []).map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('');

    document.getElementById('guardarArea').onclick = async () => {
      const nombre = document.getElementById('an').value.trim();
      if (!nombre) return avisar('Ponle nombre al área.', true);
      const { error } = await SB.from('areas').insert({ nombre, tipo:'servicio' });
      if (error) return avisar(error.message, true);
      avisar('Área creada.');
      ir('servicio');
    };
    document.getElementById('guardarMiembro').onclick = async () => {
      // Por la función y no por un insert directo: ella es la que cuida
      // que no queden dos cabezas en la misma área y la que cierra la
      // línea anterior en vez de borrarla.
      const { error } = await SB.rpc('poner_en_area', {
        p_persona: selP.value, p_area: selA.value,
        p_rol: document.getElementById('ar').value });
      if (error) return avisar(error.message, true);
      avisar('Listo, quedó en el área.');
      ir('servicio');
    };
  }
}

/* ============================================================
   Un área de servicio
   ============================================================ */
async function vArea(id){
  cargando();
  const [{ data:area, error }, { data:novs }, { data:mats }, { data:equipo }] = await Promise.all([
    SB.from('areas').select('*').eq('id', id).maybeSingle(),
    SB.from('novedades').select('*').eq('area_id', id).order('creado_en', { ascending:false }),
    SB.from('materiales').select('*').eq('area_id', id).order('creado_en', { ascending:false }),
    SB.from('servidores_por_area').select('*').eq('area_id', id).order('nombre')
  ]);
  if (error || !area) return app.innerHTML = `<div class="error">No se encontró esa área.</div>`;

  // Cabeza, líder, colíder y encargado mandan adentro del área. Antes
  // esto preguntaba solo por 'lider' y dejaba por fuera a la cabeza.
  const soyLider = (equipo || []).some(e =>
    e.persona_id === S.yo.persona_id && MANDA_AREA(e.rol_en_area));
  const puede = V().es_admin || soyLider;

  let html = `<button class="volver" id="atras">← Volver a mi servicio</button>` +
    cabeza(esc(area.nombre), `${(equipo || []).length} ${(equipo || []).length === 1 ? 'persona' : 'personas'} en el área`,
      puede ? `<button class="btn" id="nuevaNov">Publicar novedad</button>` : '');

  if (puede) html += `<div id="formNov" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <label for="nt" style="margin-top:0">Título</label><input id="nt" type="text" placeholder="Cambio de horario del domingo">
      <label for="nc">Qué pasó</label><textarea id="nc"></textarea>
      <div style="margin-top:16px"><button class="btn" id="guardarNov">Publicar</button></div>
    </div></div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Novedades</h2></div>
    <div class="tarjeta-cuerpo">`;
  if (!novs || !novs.length){
    html += `<p style="margin:0;color:var(--suave);font-size:14.5px">Todavía no hay novedades del área.</p>`;
  } else {
    html += '<ul class="hilo">' + novs.map(n => `<li class="anota es-reunion">
      <div class="anota-alto"><span class="anota-fecha">${fechaCorta(n.creado_en.slice(0,10))}</span>
        ${n.creado_por ? `<span class="anota-fecha">· ${esc(S.nombres.get(n.creado_por) || 'Un líder')}</span>` : ''}</div>
      <p class="anota-tema">${esc(n.titulo)}</p>
      ${n.cuerpo ? `<p class="anota-cuerpo">${esc(n.cuerpo)}</p>` : ''}
      ${puede ? `<div style="margin-top:9px"><button class="btn rojo chico" data-borrarnov="${n.id}">Eliminar</button></div>` : ''}
      </li>`).join('') + '</ul>';
  }
  html += `</div></div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Material del área</h2>
      ${puede ? `<button class="btn seco chico" id="nuevoMat">Agregar</button>` : ''}</div>`;
  if (puede) html += `<div id="formMatA" hidden class="tarjeta-cuerpo" style="border-bottom:1px solid var(--linea-suave)">
      <div class="par"><div><label for="amt" style="margin-top:0">Título</label><input id="amt" type="text"></div>
        <div><label for="amtipo" style="margin-top:0">Tipo</label><select id="amtipo">
          ${Object.entries(TIPOS_MAT).map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select></div></div>
      <div class="par"><div><label for="amtema">Tema</label><input id="amtema" type="text" placeholder="Capacitación, manual…"></div>
        <div><label for="amenlace">Enlace</label><input id="amenlace" type="url" placeholder="https://"></div></div>
      <div style="margin-top:14px"><button class="btn" id="guardarMatA">Guardar</button></div>
    </div>`;
  if (!mats || !mats.length){
    html += `<div class="tarjeta-cuerpo"><p style="margin:0;color:var(--suave);font-size:14.5px">
      Todavía no hay material de esta área.</p></div>`;
  } else {
    html += '<ul class="registro">' + mats.map(m => `<li><div class="fila" style="cursor:default">
      <span class="fila-alto"><span class="nombre">${esc(m.titulo)}</span></span>
      <span class="sub"><span class="sello">${esc(TIPOS_MAT[m.tipo] || m.tipo)}</span>
        ${m.tema ? `<span>${esc(m.tema)}</span>` : ''}${m.autor ? `<span>· ${esc(m.autor)}</span>` : ''}</span>
      <span style="display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap">
      ${m.enlace ? `<a href="${esc(m.enlace)}" target="_blank" rel="noopener"
         style="font-size:14px;font-weight:600">Abrir →</a>` : ''}
      ${puede ? `<button class="btn rojo chico" data-borrarmat="${m.id}">Eliminar</button>` : ''}</span>
    </div></li>`).join('') + '</ul>';
  }
  html += `</div>`;

  if (equipo && equipo.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Quiénes sirven aquí</h2></div>
      <ul class="registro">${equipo.map(e => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre" style="font-size:17px">${esc(e.nombre)}</span>
          ${selloRol(e.rol_en_area)}</span>
      </div></li>`).join('')}</ul></div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir('servicio');

  app.querySelectorAll('[data-borrarnov]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar esta novedad?', 'No se puede deshacer.')) return;
    const { error } = await SB.from('novedades').delete().eq('id', b.dataset.borrarnov);
    if (error) return avisar(error.message, true);
    avisar('Novedad eliminada.'); ir('area', id);
  });
  app.querySelectorAll('[data-borrarmat]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar este material?', 'No se puede deshacer.')) return;
    const { error } = await SB.from('materiales').delete().eq('id', b.dataset.borrarmat);
    if (error) return avisar(error.message, true);
    avisar('Material eliminado.'); ir('area', id);
  });

  const nn = document.getElementById('nuevaNov');
  if (nn) nn.onclick = () => {
    const f = document.getElementById('formNov');
    f.hidden = !f.hidden; nn.textContent = f.hidden ? 'Publicar novedad' : 'Cancelar';
  };
  const gn = document.getElementById('guardarNov');
  if (gn) gn.onclick = async () => {
    const titulo = document.getElementById('nt').value.trim();
    if (!titulo) return avisar('Ponle título.', true);
    const { error } = await SB.from('novedades').insert({
      area_id:id, titulo, cuerpo:document.getElementById('nc').value.trim() || null,
      creado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Novedad publicada.');
    ir('area', id);
  };

  const nm = document.getElementById('nuevoMat');
  if (nm) nm.onclick = () => {
    const f = document.getElementById('formMatA');
    f.hidden = !f.hidden; nm.textContent = f.hidden ? 'Agregar' : 'Cancelar';
  };
  const gm = document.getElementById('guardarMatA');
  if (gm) gm.onclick = async () => {
    const titulo = document.getElementById('amt').value.trim();
    if (!titulo) return avisar('Ponle título.', true);
    const { error } = await SB.from('materiales').insert({
      titulo, area_id:id, tipo:document.getElementById('amtipo').value,
      tema:  document.getElementById('amtema').value.trim()   || null,
      enlace:document.getElementById('amenlace').value.trim() || null,
      creado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Material guardado.');
    ir('area', id);
  };
}

/* ============================================================
   Yo
   ============================================================ */
async function vYo(){
  cargando();
  const { data:p } = await SB.from('ficha_persona').select('*').eq('id', S.yo.persona_id).maybeSingle();
  const c = claseEstado(p?.situacion);

  app.innerHTML = cabeza(esc(S.yo.nombre),
    `${esc(S.yo.rango || 'sin rango')}${p?.lider ? ` · cuidado por ${esc(p.lider)}` : ''}`) + `
    ${p ? `<div class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="fila-alto"><div style="flex:1">
        <span class="marca-est m-${c.slice(2)}">${esc(p.situacion)}</span>
        <p class="ayuda">${p.ultima_reunion
          ? `Tu líder y tú se vieron ${haceCuanto(p.dias)}.`
          : 'Todavía no hay un encuentro registrado contigo.'}</p></div>
        <span class="cuenta ${c}">${p.dias}<small>días</small></span></div>
      <span class="medida ${c}" style="margin-top:14px"><i style="width:${Math.min(100,Math.round(p.dias/90*100))}%"></i><b style="left:33.3%"></b></span>
    </div></div>` : ''}

    <div class="tarjeta"><div class="tarjeta-alto"><h2>Lo que puedes hacer</h2></div>
      <div class="tarjeta-cuerpo"><ul class="datos">
        <li><span>Hombres a tu cargo</span><b>${S.yo.a_cargo}</b></li>
        <li><span>Registrar cuidado</span><b>${S.yo.puede_cuidar ? 'Sí' : 'Todavía no'}</b></li>
        ${S.yo.ve_todo  ? '<li><span>Ver todo el ministerio</span><b>Sí</b></li>' : ''}
        ${S.yo.es_admin ? '<li><span>Administrar la plataforma</span><b>Sí</b></li>' : ''}
      </ul>
      </div></div>

    <div class="tarjeta"><div class="tarjeta-alto"><h2>Apariencia</h2>
      <button class="btn seco chico" id="cambiarTema">${
        document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'Pasar a claro' : 'Pasar a oscuro'}</button></div>
      </div>

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px">
      <button class="btn seco" id="miProc">Ver mi proceso</button>
      <button class="btn seco" id="salir">Cerrar sesión</button></div>`;

  document.getElementById('cambiarTema').onclick = () => { girarTema(); ir('yo'); };
  document.getElementById('miProc').onclick = () => { S.procPersona = S.yo.persona_id; ir('procesos'); };
  document.getElementById('salir').onclick = () => SB.auth.signOut();
}

arrancar();
</script>
