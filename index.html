<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuidado · Ministerio de Hombres</title>
<meta name="description" content="Plataforma de cuidado del ministerio de hombres de Semillas de Vida.">
<meta name="theme-color" content="#F5F7F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --fondo:#EEF2EC; --fondo2:#F7F9F5;
  --panel:rgba(255,255,255,.72); --panel-solido:#FFFFFF;
  --alto:rgba(255,255,255,.55); --velo:rgba(22,32,22,.045);
  --linea:rgba(22,40,24,.10); --linea-suave:rgba(22,40,24,.055);
  --texto:#141A13; --suave:#555D52; --tenue:#838B7F;
  --verde:#2F6C48; --verde-vivo:#3C8A5B; --verde-tenue:rgba(47,108,72,.12);
  --ambar:#8A6511; --ambar-tenue:rgba(190,146,38,.16);
  --barro:#9C4028; --barro-tenue:rgba(156,64,40,.13);
  --azul:#34608F;  --azul-tenue:rgba(52,96,143,.13);
  --sombra:0 1px 2px rgba(18,32,20,.05), 0 8px 24px -10px rgba(18,32,20,.14);
  --sombra-alta:0 2px 6px rgba(18,32,20,.07), 0 24px 56px -18px rgba(18,32,20,.26);
  --r:22px; --r-med:15px; --r-chico:11px;
  --brinco:cubic-bezier(.22,1,.36,1);
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}
:root[data-tema="oscuro"]{
  --fondo:#0C100B; --fondo2:#141A13;
  --panel:rgba(30,38,29,.62); --panel-solido:#1A211A;
  --alto:rgba(255,255,255,.07); --velo:rgba(255,255,255,.04);
  --linea:rgba(255,255,255,.10); --linea-suave:rgba(255,255,255,.055);
  --texto:#EBEFE8; --suave:#9BA596; --tenue:#737C6F;
  --verde:#6AB487; --verde-vivo:#7FC79A; --verde-tenue:rgba(106,180,135,.17);
  --ambar:#D4AB58; --ambar-tenue:rgba(212,171,88,.16);
  --barro:#CB6B53; --barro-tenue:rgba(203,107,83,.16);
  --azul:#86ADD8;  --azul-tenue:rgba(134,173,216,.15);
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  --sombra-alta:0 2px 8px rgba(0,0,0,.4), 0 28px 60px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--texto);
  font-family:var(--sans);
  font-size:15.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 12% -5%,  var(--verde-tenue), transparent 60%),
    radial-gradient(900px 600px at 95% 8%,    var(--azul-tenue),  transparent 55%),
    radial-gradient(800px 800px at 70% 105%,  var(--ambar-tenue), transparent 60%),
    linear-gradient(170deg, var(--fondo2), var(--fondo));
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde-vivo);outline-offset:2px;border-radius:8px}
a{color:var(--verde);text-decoration-color:color-mix(in srgb, var(--verde) 35%, transparent)}

/* ============================================================
   Movimiento — una entrada por pantalla, nada más
   ============================================================ */
@keyframes surgir{ from{opacity:0;transform:translateY(14px) scale(.985)} to{opacity:1;transform:none} }
@keyframes asomar{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes aparecer{ from{opacity:0} to{opacity:1} }

#app > *{animation:surgir .5s var(--brinco) both}
#app > *:nth-child(1){animation-delay:0s}
#app > *:nth-child(2){animation-delay:.045s}
#app > *:nth-child(3){animation-delay:.085s}
#app > *:nth-child(4){animation-delay:.12s}
#app > *:nth-child(5){animation-delay:.15s}
#app > *:nth-child(n+6){animation-delay:.175s}

@media (prefers-reduced-motion: reduce){
  *,#app > *{animation:none!important;transition:none!important}
}

/* ============================================================
   Estructura
   ============================================================ */
.lado{display:none}
.principal{padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.lienzo{max-width:1020px;margin:0 auto}

@media (min-width:960px){
  .lado{
    display:flex;flex-direction:column;position:fixed;inset:12px auto 12px 12px;width:242px;
    background:var(--panel);
    -webkit-backdrop-filter:blur(26px) saturate(170%); backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--linea);border-radius:var(--r);
    padding:20px 12px 12px;z-index:30;box-shadow:var(--sombra);
  }
  .principal{margin-left:266px;padding:0 30px 60px}
  .barra{display:none}
}

.marca{display:flex;align-items:center;gap:11px;padding:0 10px 20px}
.marca-sello{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
  box-shadow:0 4px 12px -3px color-mix(in srgb, var(--verde) 55%, transparent);
}
.marca-sello svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8}
.marca b{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.1;display:block}
.marca span{font-size:11.5px;color:var(--tenue);display:block;line-height:1.2}

.grupo-nav{margin-bottom:18px}
.grupo-nav p{
  font-size:10.5px;font-weight:700;color:var(--tenue);
  letter-spacing:.07em;margin:0 0 5px;padding:0 10px;
}
.grupo-nav button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-radius:var(--r-chico);
  padding:9px 10px;cursor:pointer;color:var(--suave);
  font-size:14.5px;font-weight:500;text-align:left;
  transition:background .22s var(--brinco), color .22s var(--brinco);
}
.grupo-nav button:hover{background:var(--velo);color:var(--texto)}
.grupo-nav button[aria-current=page]{
  background:var(--verde-tenue);color:var(--verde);font-weight:600;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--verde) 18%, transparent);
}
.grupo-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 auto}

.pie-lado{margin-top:auto;border-top:1px solid var(--linea-suave);padding-top:11px;display:flex;align-items:center;gap:6px}
.quien{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;
  background:none;border:0;border-radius:var(--r-chico);padding:8px 10px;cursor:pointer;text-align:left;
  transition:background .22s var(--brinco);
}
.quien:hover{background:var(--velo)}
.inicial{
  width:33px;height:33px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
}
.quien div{min-width:0}
/* En oscuro el verde se aclara, así que lo que va encima debe oscurecerse */
:root[data-tema="oscuro"] .inicial{color:#0B0F0A}
:root[data-tema="oscuro"] .marca-sello svg{stroke:#0B0F0A}
:root[data-tema="oscuro"] .btn{color:#0B0F0A}
:root[data-tema="oscuro"] .btn.seco{color:var(--texto)}
:root[data-tema="oscuro"] .btn.rojo{color:var(--barro)}
:root[data-tema="oscuro"] .chip[aria-pressed=true]{color:#0B0F0A}
:root[data-tema="oscuro"] .cal-celda.hoy{color:#0B0F0A}
:root[data-tema="oscuro"] .grada-punto.actual .grada-bola{color:#0B0F0A}
:root[data-tema="oscuro"] .paso.hecho .paso-num{color:#0B0F0A}

.quien b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quien span{display:block;font-size:11.5px;color:var(--tenue)}

/* ============================================================
   Encabezado
   ============================================================ */
.cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 18px;flex-wrap:wrap}
.cabeza h1{
  font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.08;margin:0;
  letter-spacing:-.018em;
}
.cabeza p{margin:6px 0 0;color:var(--suave);font-size:14.5px}
.cabeza-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tema{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r-chico);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--suave);
  transition:transform .3s var(--brinco), color .2s;
}
.tema:hover{color:var(--texto);transform:rotate(25deg)}
.tema svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ============================================================
   Widgets
   ============================================================ */
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:16px}
@media (min-width:720px){ .rejilla{grid-template-columns:repeat(4,minmax(0,1fr))} }
.ancho2{grid-column:span 2}
@media (min-width:720px){ .ancho2{grid-column:span 2} }

.wid{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(165%); backdrop-filter:blur(22px) saturate(165%);
  box-shadow:var(--sombra);padding:16px 17px;position:relative;overflow:hidden;
}
.wid::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.28), transparent 42%);
}
:root[data-tema="oscuro"] .wid::after{background:linear-gradient(160deg, rgba(255,255,255,.07), transparent 42%)}

.cifra-icono{
  width:31px;height:31px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;
}
.cifra-icono svg{width:16px;height:16px;fill:none;stroke-width:1.9}
.wid b.num{display:block;font-size:31px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wid span.pie{display:block;font-size:12.5px;color:var(--suave);margin-top:6px}
.i-verde{background:var(--verde-tenue)}  .i-verde svg{stroke:var(--verde)}
.i-ambar{background:var(--ambar-tenue)}  .i-ambar svg{stroke:var(--ambar)}
.i-barro{background:var(--barro-tenue)}  .i-barro svg{stroke:var(--barro)}
.i-azul{background:var(--azul-tenue)}    .i-azul svg{stroke:var(--azul)}

/* ---------- calendario ---------- */
.cal-alto{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.cal-alto h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;text-transform:capitalize}
.cal-nav{display:flex;gap:4px}
.cal-nav button{
  width:27px;height:27px;border-radius:8px;border:1px solid var(--linea);background:var(--alto);
  cursor:pointer;color:var(--suave);display:grid;place-items:center;font-size:13px;line-height:1;
  transition:background .2s var(--brinco);
}
.cal-nav button:hover{background:var(--velo);color:var(--texto)}
.cal-rejilla{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dia-nom{
  text-align:center;font-size:10px;font-weight:700;color:var(--tenue);
  padding-bottom:5px;text-transform:uppercase;
}
.cal-celda{
  position:relative;height:33px;display:grid;place-items:center;border-radius:9px;
  font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--suave);border:0;background:none;
  cursor:default;padding:0;
}
.cal-celda.fuera{color:var(--tenue);opacity:.35}
.cal-celda.hoy{background:var(--verde);color:#fff;font-weight:700}
.cal-celda.tiene{cursor:pointer;font-weight:700;color:var(--texto)}
.cal-celda.tiene:hover{background:var(--velo)}
.cal-celda.tiene.hoy:hover{background:var(--verde-vivo)}
.cal-celda i{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--verde-vivo);
}
.cal-celda.hoy i{background:#fff}
.cal-pie{margin-top:11px;font-size:12.5px;color:var(--suave);min-height:18px}

/* ---------- versículo ---------- */
.verso{
  background:
    radial-gradient(420px 220px at 85% 0%, var(--verde-tenue), transparent 70%),
    var(--panel);
  display:flex;flex-direction:column;justify-content:center;
}
.mitad{grid-column:1 / -1}
@media (min-width:720px){ .mitad{grid-column:span 2} }
.verso .etq{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--verde);
  text-transform:uppercase;display:block;margin-bottom:9px;
}
.verso p{
  font-family:var(--serif);font-size:19px;line-height:1.45;margin:0;letter-spacing:-.005em;
}
.verso cite{
  display:block;margin-top:11px;font-size:13px;font-style:normal;font-weight:600;color:var(--suave);
}
.verso .tema-v{font-size:11.5px;color:var(--tenue);font-weight:500}

/* ============================================================
   Tarjetas
   ============================================================ */
.tarjeta{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(165%); backdrop-filter:blur(22px) saturate(165%);
  box-shadow:var(--sombra);margin-bottom:15px;overflow:hidden;
}
.tarjeta-alto{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 19px;border-bottom:1px solid var(--linea-suave);flex-wrap:wrap;
}
.tarjeta-alto h2{font-family:var(--serif);font-size:18.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.tarjeta-cuerpo{padding:18px 19px}

.registro{list-style:none;margin:0;padding:0}
.fila{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--linea-suave);padding:14px 19px;cursor:pointer;
  transition:background .2s var(--brinco);
}
.fila:first-child{border-top:0}
.fila:hover{background:var(--velo)}
.fila-alto{display:flex;align-items:baseline;gap:12px}
.nombre{
  font-family:var(--serif);font-size:19.5px;font-weight:500;flex:1;min-width:0;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em;
}
.cuenta{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.cuenta small{font-size:11px;font-weight:500;margin-left:3px;color:var(--tenue)}
.cuenta.v-cuidado{color:var(--verde)} .cuenta.v-alerta{color:var(--ambar)} .cuenta.v-desconectado{color:var(--barro)}
.sub{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:13px;color:var(--suave);flex-wrap:wrap}
.marca-est{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.m-cuidado{background:var(--verde-tenue);color:var(--verde)}
.m-alerta{background:var(--ambar-tenue);color:var(--ambar)}
.m-desconectado{background:var(--barro-tenue);color:var(--barro)}

.medida{display:block;position:relative;height:4px;margin-top:10px;background:var(--linea-suave);border-radius:3px}
.medida i{position:absolute;inset:0 auto 0 0;border-radius:3px;display:block;animation:crecer .7s var(--brinco) both}
@keyframes crecer{ from{width:0 !important} }
.medida b{position:absolute;top:-2px;width:1px;height:8px;background:var(--linea)}
.medida.v-cuidado i{background:var(--verde)} .medida.v-alerta i{background:var(--ambar)} .medida.v-desconectado i{background:var(--barro)}

.vacio{
  border:1px dashed var(--linea);border-radius:var(--r);background:var(--panel);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  padding:36px 22px;text-align:center;color:var(--suave);font-size:14.5px;line-height:1.6;margin-bottom:15px;
}
.vacio strong{display:block;color:var(--texto);font-size:18px;font-weight:600;margin-bottom:7px;font-family:var(--serif)}

/* ============================================================
   Personas
   ============================================================ */
.buscador{position:relative;margin-bottom:12px}
.buscador input[type=text]{
  padding:11px 40px 11px 42px;font-size:15.5px;height:46px;border-radius:var(--r-med);
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
}
.buscador svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:2;
  width:17px;height:17px;stroke:var(--tenue);fill:none;stroke-width:2;pointer-events:none;
}
.buscador .limpiar{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:2;
  background:none;border:0;cursor:pointer;color:var(--tenue);font-size:17px;
  width:30px;height:30px;border-radius:50%;line-height:1;
}
.buscador .limpiar:hover{background:var(--velo);color:var(--texto)}

.wid.tocable{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;
  transition:transform .22s var(--brinco), box-shadow .22s var(--brinco), border-color .2s}
.wid.tocable:hover{transform:translateY(-2px);box-shadow:var(--sombra-alta)}
.wid.tocable[aria-pressed=true]{
  border-color:currentColor;box-shadow:var(--sombra-alta), inset 0 0 0 1px currentColor;
}

.avanzada{
  display:grid;gap:0 14px;grid-template-columns:1fr;
}
@media (min-width:560px){ .avanzada{grid-template-columns:1fr 1fr} }
@media (min-width:900px){ .avanzada{grid-template-columns:repeat(3,1fr)} }

.conteo-res{font-size:13px;color:var(--suave);margin:0 0 12px;padding:0 2px}

.personas{
  display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  margin-bottom:16px;
}
.pcard{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(20px) saturate(165%); backdrop-filter:blur(20px) saturate(165%);
  box-shadow:var(--sombra);padding:16px 16px 15px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;
  transition:transform .22s var(--brinco), box-shadow .22s var(--brinco);
  animation:surgir .42s var(--brinco) both;
}
.pcard::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.26), transparent 44%);
}
:root[data-tema="oscuro"] .pcard::after{background:linear-gradient(160deg, rgba(255,255,255,.06), transparent 44%)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.pcard-alto{display:flex;align-items:center;gap:11px}
.pcard-ini{
  width:40px;height:40px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(145deg, var(--verde-vivo), var(--verde));
}
:root[data-tema="oscuro"] .pcard-ini{color:#0B0F0A}
.pcard-ini.e-alerta{background:linear-gradient(145deg,#D9B35C,var(--ambar))}
.pcard-ini.e-desconectado{background:linear-gradient(145deg,#C9735C,var(--barro))}
.pcard-nom{flex:1;min-width:0}
.pcard-nom b{
  display:block;font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.2;
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pcard-nom span{display:block;font-size:12px;color:var(--tenue);margin-top:1px}
.pcard-fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--suave)}
.pcard-pie{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--tenue);
  border-top:1px solid var(--linea-suave);padding-top:10px;margin-top:auto;
}
.anillo{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.anillo i{
  width:28px;height:4px;border-radius:3px;background:var(--linea-suave);
  position:relative;overflow:hidden;display:inline-block;
}
.anillo i b{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:3px}

/* ============================================================
   Cursos
   ============================================================ */
.cursos{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-bottom:16px}
.ccard{
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  -webkit-backdrop-filter:blur(20px) saturate(165%); backdrop-filter:blur(20px) saturate(165%);
  box-shadow:var(--sombra);cursor:pointer;text-align:left;overflow:hidden;
  display:flex;flex-direction:column;padding:0;

  if (d === 1) return 'ayer';

  if (d < 60) { const s = Math.round(d/7); return `hace ${s} ${s===1?'semana':'semanas'}`; }

    const velo = document.createElement('div');
    velo.className = 'velo-modal';
    velo.innerHTML = `<div class="modal ${ancho ? 'ancho' : ''}" role="dialog" aria-modal="true">
      <div class="modal-alto"><h2>${titulo}</h2>${texto ? `<p>${texto}</p>` : ''}</div>
      ${cuerpo ? `<div class="modal-cuerpo">${cuerpo}</div>` : '<div style="height:10px"></div>'}
      <div class="modal-pie">
        ${cancelar ? `<button class="btn seco" data-no>${cancelar}</button>` : ''}
        <button class="btn ${peligro ? 'rojo' : ''}" data-si>${aceptar}</button>
      </div></div>`;
    document.body.appendChild(velo);

    const cerrar = v => { velo.remove(); document.removeEventListener('keydown', tecla); resolver(v); };
    const tecla = e => {
      if (e.key === 'Escape') cerrar(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); aceptarlo(); }
    };
    let leer = () => true;
    const aceptarlo = () => { const v = leer(); if (v !== undefined) cerrar(v); };

    velo.querySelector('[data-si]').onclick = aceptarlo;
    const no = velo.querySelector('[data-no]');
    if (no) no.onclick = () => cerrar(null);
    velo.onclick = e => { if (e.target === velo) cerrar(null); };
    document.addEventListener('keydown', tecla);

    if (alMontar) leer = alMontar(velo) || leer;
    const foco = velo.querySelector('input, select, textarea');
    (foco || velo.querySelector('[data-si]')).focus();
  });
}

async function arrancar(){
  const { data:{ session } } = await SB.auth.getSession();
  session ? await entrar() : pantallaEntrada();
  SB.auth.onAuthStateChange(e => {
    if (e === 'SIGNED_OUT'){ S.yo = null; lado.hidden = true; barra.hidden = true; pantallaEntrada(); }
  });
}

async function entrar(){
  cargando();
  const { data, error } = await SB.rpc('quien_soy');
  if (error) return app.innerHTML = `<div class="error">No se pudo abrir la sesión: ${esc(error.message)}</div>`;

  if (!data || !data.length){
    app.innerHTML = `<div class="cabeza"><div><h1>Tu correo no está en el ministerio</h1>
      <p>Entraste bien, pero este correo todavía no corresponde a ningún hombre registrado.
         Avísale a quien administra la plataforma para que te agregue.</p></div></div>
      <button class="btn seco" id="salir">Cerrar sesión</button>`;
    document.getElementById('salir').onclick = () => SB.auth.signOut();
    return;
  }

  S.yo = data[0];
  S.procPersona = S.yo.persona_id;
  const { data:gente } = await SB.from('personas').select('id,nombre');
  S.nombres = new Map((gente||[]).map(p => [p.id, p.nombre]));
  pintarNav();
  ir('inicio');
}

function pantallaEntrada(){
  lado.hidden = true; barra.hidden = true;
  document.querySelector('.principal').style.marginLeft = '0';
  app.innerHTML = `
  <div class="entrada">
    <div class="marca"><span class="marca-sello">${I.sello}</span>
      <span><b>Cuidado</b><span>Ministerio de hombres</span></span></div>

      <input id="clave" type="password" autocomplete="current-password" required>
      <div id="err"></div>
      <div style="margin-top:20px"><button class="btn ancho" type="submit" id="b">Entrar</button></div>
    </form>
  </div>`;

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById('b');
    b.disabled = true; b.textContent = 'Entrando…';
    const { error } = await SB.auth.signInWithPassword({
      email: document.getElementById('correo').value.trim(),

      b.disabled = false; b.textContent = 'Entrar';
      return;
    }
    document.querySelector('.principal').style.marginLeft = '';
    await entrar();
  };
}

/* ============================================================
   Calendario
   ============================================================ */
const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];

function widgetCalendario(eventos){
  const hoyF = hoy();
  const [ha, hm] = [Number(hoyF.slice(0,4)), Number(hoyF.slice(5,7))];
  if (!S.calMes) S.calMes = { a:ha, m:hm };
  const { a, m } = S.calMes;

  const primero = new Date(Date.UTC(a, m-1, 1));
  const dias    = new Date(Date.UTC(a, m, 0)).getUTCDate();
  const arranca = (primero.getUTCDay() + 6) % 7;   // lunes = 0

  const porDia = new Map();
  (eventos || []).forEach(e => {
    if (e.fecha.slice(0,7) === `${a}-${String(m).padStart(2,'0')}`)
      porDia.set(Number(e.fecha.slice(8,10)), e);
  });

  let celdas = '';
  for (let i = 0; i < arranca; i++) celdas += `<span class="cal-celda fuera"></span>`;
  for (let d = 1; d <= dias; d++){
    const f = `${a}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = porDia.get(d);
    celdas += `<${ev ? 'button' : 'span'} class="cal-celda${f === hoyF ? ' hoy' : ''}${ev ? ' tiene' : ''}"
      ${ev ? `data-caldia="${ev.id}" title="${esc(ev.nombre)}"` : ''}>${d}${ev ? '<i></i>' : ''}</${ev ? 'button' : 'span'}>`;
  }

  const delMes = [...porDia.entries()].sort((x,y) => x[0]-y[0]);
  const pie = delMes.length
    ? delMes.slice(0,3).map(([d,e]) => `${d} · ${esc(e.nombre)}`).join('<br>')
    : 'Sin eventos este mes.';

  return `<div class="wid mitad">
    <div class="cal-alto"><h3>${MESES[m-1]} ${a}</h3>
      <div class="cal-nav"><button data-cal="-1" aria-label="Mes anterior">‹</button>
        <button data-cal="0" aria-label="Este mes">·</button>
        <button data-cal="1" aria-label="Mes siguiente">›</button></div></div>
    <div class="cal-rejilla">
      ${['L','M','M','J','V','S','D'].map(d => `<span class="cal-dia-nom">${d}</span>`).join('')}
      ${celdas}
    </div>
    <div class="cal-pie">${pie}</div>
  </div>`;
}

function enlazarCalendario(){
  app.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const paso = Number(b.dataset.cal);
    if (paso === 0){ const h = hoy(); S.calMes = { a:Number(h.slice(0,4)), m:Number(h.slice(5,7)) }; }
    else {
      let { a, m } = S.calMes; m += paso;
      if (m < 1){ m = 12; a--; } if (m > 12){ m = 1; a++; }
      S.calMes = { a, m };
    }
    ir(S.vista);
  });
  app.querySelectorAll('[data-caldia]').forEach(b => b.onclick = () => ir('evento', b.dataset.caldia));
}

        <span class="sello">${proxima.rol === 'encargado' ? 'Encargado' : esc(proxima.area || 'Servidor')}</span></div>
      <div class="tarjeta-cuerpo"><p style="margin:0 0 4px;font-family:var(--serif);font-size:19px">${esc(proxima.nombre)}</p>
      <p style="margin:0;color:var(--suave);font-size:14px">${fechaCorta(proxima.fecha)}${proxima.hora ? ' · ' + esc(proxima.hora.slice(0,5)) : ''}${proxima.lugar ? ' · ' + esc(proxima.lugar) : ''}</p>
      <div style="margin-top:14px"><button class="btn seco chico" data-ir="servicio">Ver mi servicio</button></div></div></div>`;

  if (aperturas && aperturas.length){
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Abrieron una nota tuya</h2></div>
      <div class="tarjeta-cuerpo">${aperturas.map(a => `<p class="ayuda" style="margin:0 0 7px">
        <b style="color:var(--texto)">${esc(a.abierto_por)}</b> abrió la nota reservada sobre
        ${esc(a.sobre_quien)} · ${esc(a.motivo)}</p>`).join('')}</div></div>`;
  }

  if (!data.length){
    html += `<div class="vacio"><strong>Todavía no cuidas a nadie</strong>
      Cuando te asignen hombres, aquí vas a ver cómo va cada uno.</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn seco" data-ir="procesos">Ver mi proceso</button>
        <button class="btn seco" data-ir="material">Ver el material</button></div>`;
  } else {
    html += `<div class="tarjeta"><ul class="registro">${data.map(fila).join('')}</ul></div>`;
  }

  app.innerHTML = html;
  enlazarFilas(); enlazarCalendario();
  app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
}

/* ============================================================
   Ficha
   ============================================================ */
async function vFicha(id){
  cargando();
  const yo = V();

  const [{ data:p, error }, { data:areasP }, { data:notas },
         { data:rutas }, { data:pasos }, { data:avances },
         { data:rangos }, { data:hist }, { data:dir }, { data:todasAreas }] = await Promise.all([
    SB.from('ficha_persona').select('*').eq('id', id).maybeSingle(),
    SB.from('persona_area').select('id, rol_en_area, area_id, areas(nombre)').eq('persona_id', id).is('hasta', null),
    SB.from('contactos_visibles').select('*').eq('persona_id', id).order('fecha', { ascending:false }),
    SB.from('rutas').select('*').eq('activa', true).order('orden'),
    SB.from('pasos').select('*').order('orden'),
    SB.from('avances').select('*').eq('persona_id', id),
    SB.from('rangos').select('*').eq('persona_id', id).order('desde'),
    SB.from('historial').select('*').eq('persona_id', id).order('cuando', { ascending:false }).limit(40),
    SB.from('directorio').select('*').order('nombre'),
    SB.from('areas').select('*').eq('activa', true).order('nombre')
  ]);
  if (error || !p) return app.innerHTML = `<div class="error">No se encontró a esa persona, o está fuera de lo que puedes ver.</div>`;

  const c = claseEstado(p.situacion);
  const esMio   = p.id === S.yo.persona_id;
  const puedo   = yo.puede_cuidar && !esMio;
  const mando   = yo.es_admin || yo.ve_todo;
  const porPaso = new Map((avances || []).map(a => [a.paso_id, a]));
  const iActual = ESCALA.indexOf(p.rango);
  const puedoMarcar = !esMio && (mando || (S.gente || []).some(g => g.persona_id === id));

  let html = `<button class="volver" id="atras">← Volver</button>` +
    cabeza(esc(p.nombre), `${esc(p.rango || 'sin rango')}${p.lider ? ` · cuidado por ${esc(p.lider)}` : ''}`,
      puedo ? `<button class="btn" id="reg">Registrar encuentro</button>` : '');

  /* ---------- estado ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-cuerpo">
    <div class="fila-alto"><div style="flex:1">
      <span class="marca-est m-${c.slice(2)}">${esc(p.situacion)}</span>
      <p class="ayuda">${p.ultima_reunion
        ? `Se vieron ${haceCuanto(p.dias)}, el ${fechaCorta(p.ultima_reunion)}.`
        : 'Nunca se ha registrado una reunión.'}</p>
    </div><span class="cuenta ${c}">${p.dias}<small>días</small></span></div>
    <span class="medida ${c}" style="margin-top:14px"><i style="width:${Math.min(100,Math.round(p.dias/90*100))}%"></i><b style="left:33.3%"></b></span>
  </div></div>`;

  /* ---------- camino y rutas ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Su proceso</h2>
      <span class="ruta-conteo">${esc(p.rango || 'sin rango')}</span></div>
    <div class="tarjeta-cuerpo">
      <div class="escala">${ESCALA.map((r,i) => {
        const cls = i < iActual ? 'hecho' : (i === iActual ? 'actual' : '');
        const f = (rangos || []).find(x => x.rango === r);
        return (i ? `<span class="grada-raya${i <= iActual ? ' hecha' : ''}"></span>` : '') +
          `<span class="grada-punto ${cls}"><span class="grada-bola">${i+1}</span>
            <span>${r[0].toUpperCase()+r.slice(1)}</span>
            ${f ? `<span style="font-size:11.5px;color:var(--tenue);font-weight:400">${fechaCorta(f.desde)}</span>` : ''}
          </span>`;
      }).join('')}</div>`;

  if (yo.es_admin){
    const siguiente = ESCALA[iActual+1];
    html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      ${siguiente ? `<button class="btn chico" data-subir="${siguiente}">Pasar a ${siguiente}</button>` : ''}
      ${(rangos||[]).length > 1 ? `<button class="btn rojo chico" data-bajarrango="${rangos[rangos.length-1].id}">Deshacer último rango</button>` : ''}
    </div>`;
  }
  html += `</div>`;

  for (const r of (rutas || [])){
    const ps = (pasos || []).filter(x => x.ruta_id === r.id);
    const hechos = ps.filter(x => porPaso.get(x.id)?.estado === 'completado').length;
    const pct = ps.length ? Math.round(hechos / ps.length * 100) : 0;
    const abierta = S.rutaFicha === r.id;
    const marco = r.auto_marca ? (esMio || puedoMarcar) : puedoMarcar;

    html += `<div class="ruta">
      <div class="ruta-alto" data-rutaf="${r.id}" role="button" tabindex="0">
        <h3>${esc(r.nombre)}</h3>
        <span class="sello">${r.auto_marca ? 'Escuela' : 'Acompañada'}</span>
        <span class="ruta-conteo">${hechos} de ${ps.length}</span></div>
      <span class="barra-prog"><i style="width:${pct}%"></i></span>
      ${abierta ? `<ul class="pasos">${ps.map((x,i) => {
        const a = porPaso.get(x.id); const est = a?.estado;
        return `<li class="paso ${est === 'completado' ? 'hecho' : (est === 'en curso' ? 'curso' : '')}">
          <span class="paso-num">${est === 'completado' ? '✓' : i+1}</span>
          <span class="paso-txt"><b>${esc(x.nombre)}</b>
            ${a ? `<span>${est === 'completado' ? 'Completado' : 'En curso'} · ${fechaCorta(a.fecha)}</span>` : ''}</span>
          ${marco ? `<span class="paso-acc">
            <button class="btn ${est === 'en curso' ? '' : 'seco'} chico" data-pf="${x.id}" data-rf="${r.id}" data-ef="en curso">En curso</button>
            <button class="btn ${est === 'completado' ? '' : 'seco'} chico" data-pf="${x.id}" data-rf="${r.id}" data-ef="completado">Hecho</button>
          </span>` : ''}
        </li>`;
      }).join('')}</ul>` : ''}
    </div>`;
  }
  html += `</div>`;

  /* ---------- datos ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Datos</h2>
      ${(mando || esMio) ? `<button class="btn seco chico" id="editar">Editar</button>` : ''}</div>
    <div class="tarjeta-cuerpo">
    <div id="verDatos"><ul class="datos">
      ${areasP && areasP.length ? `<li><span>Áreas</span><b>${areasP.map(a =>
        esc(a.areas.nombre) + (a.rol_en_area === 'lider' ? ' (líder)' : '')).join('<br>')}</b></li>` : ''}
      ${p.celular ? `<li><span>Celular</span><b><a href="https://wa.me/57${esc(p.celular)}">${esc(p.celular)}</a></b></li>` : ''}
      ${p.telefono ? `<li><span>Teléfono fijo</span><b>${esc(p.telefono)}</b></li>` : ''}
      ${p.correo ? `<li><span>Correo</span><b style="word-break:break-all">${esc(p.correo)}</b></li>` : ''}
      ${p.fecha_nacimiento ? `<li><span>Nació</span><b>${fechaCorta(p.fecha_nacimiento)} · ${edadDe(p.fecha_nacimiento)} años</b></li>` : ''}
      <li><span>En el ministerio desde</span><b>${fechaCorta(p.fecha_ingreso)}</b></li>
      <li><span>Encuentros registrados</span><b>${p.total_reuniones}</b></li>
    </ul></div>

    <div id="formDatos" hidden>
      <div class="par"><div><label for="dn" style="margin-top:0">Nombre</label><input id="dn" type="text" value="${esc(p.nombre)}"></div>
        <div><label for="dc" style="margin-top:0">Celular</label><input id="dc" type="text" inputmode="numeric" value="${esc(p.celular || '')}"></div></div>
      <div class="par"><div><label for="dm">Correo</label><input id="dm" type="email" value="${esc(p.correo || '')}"></div>
        <div><label for="df">Teléfono fijo</label><input id="df" type="text" inputmode="numeric" value="${esc(p.telefono || '')}"></div></div>
      <div class="par"><div><label for="dnac">Fecha de nacimiento</label><input id="dnac" type="date" value="${esc(p.fecha_nacimiento || '')}"></div>
        <div><label for="de">Estado</label><select id="de">
          ${['activo','visitante','retirado'].map(e => `<option value="${e}"${e===p.estado?' selected':''}>${e}</option>`).join('')}</select></div></div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn" id="guardarDatos">Guardar</button>
        <button class="btn seco" id="cancelarDatos">Cancelar</button></div>
    </div>`;

  if (mando){
    const lideres = (dir || []).filter(d => d.id !== p.id && (d.rango === 'escudero' || d.rango === 'caballero'));
    const libres  = (todasAreas || []).filter(a => !(areasP || []).some(x => x.area_id === a.id));
    html += `<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--linea-suave)">
      <label style="margin-top:0" for="nuevoLider">¿Quién lo cuida?</label>
      <div class="par"><div><select id="nuevoLider">
        ${lideres.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select></div>
        <div><button class="btn" id="moverCuidado" style="width:100%">Pasar a su cuidado</button></div></div>

      <label for="nuevaArea">Áreas (máximo 3)</label>
      <div class="chips" style="margin-bottom:10px">${(areasP || []).map(a =>
        `<button class="chip" aria-pressed="true" data-quitararea="${a.id}">${esc(a.areas.nombre)} ✕</button>`).join('')
        || '<span class="ruta-conteo">Ninguna todavía</span>'}</div>
      ${(areasP || []).length < 3 && libres.length ? `<div class="par">
        <div><select id="nuevaArea">${libres.map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select></div>
        <div><button class="btn seco" id="addArea" style="width:100%">Agregar área</button></div></div>` : ''}
    </div>`;
  }
  html += `</div></div>`;

  /* ---------- registro de cuidado ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Registro de cuidado</h2></div>
    <div class="tarjeta-cuerpo">`;
  if (!notas || !notas.length){
    html += `<p style="margin:0;color:var(--suave);font-size:14.5px">Todavía no hay nada escrito.</p>`;
  } else {
    html += '<ul class="hilo">' + notas.map(n => `
      <li class="anota ${n.tipo === 'reunion' ? 'es-reunion' : ''}">
        <div class="anota-alto"><span class="anota-fecha">${fechaCorta(n.fecha)}</span>
          <span class="sello">${n.tipo === 'reunion' ? 'Se vieron' : 'Lo buscó'}</span>
          ${n.medio ? `<span class="anota-fecha">${esc(n.medio)}</span>` : ''}
          <span class="anota-fecha">· ${esc(S.nombres.get(n.lider_id) || 'Otro líder')}</span></div>
        <p class="anota-tema">${esc(n.tema || 'Sin tema')}</p>
        ${n.oculta
          ? `<button class="btn seco chico" data-abrir="${n.id}" style="margin-top:9px">Abrir con registro</button>`
          : (n.resumen ? `<p class="anota-cuerpo">${esc(n.resumen)}</p>` : '')}
        ${(n.lider_id === S.yo.persona_id || yo.es_admin)
          ? `<div style="margin-top:9px"><button class="btn rojo chico" data-borrarnota="${n.id}">Eliminar</button></div>` : ''}
      </li>`).join('') + '</ul>';
  }
  html += '</div></div>';

  /* ---------- historial ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Historial de cambios</h2>
      <span class="ruta-conteo">${(hist || []).length} ${(hist||[]).length === 1 ? 'registro' : 'registros'}</span></div>
    <div class="tarjeta-cuerpo">`;
  if (!hist || !hist.length){
    html += `<p style="margin:0;color:var(--suave);font-size:14.5px">Sin cambios registrados todavía.</p>`;
  } else {
    html += `<ul class="datos">${hist.map(h => `<li>
      <span><span class="sello">${esc(h.asunto)}</span> ${esc(h.detalle)}</span>
      <b style="font-weight:500;color:var(--tenue);font-size:12.5px;white-space:nowrap">
        ${fechaCorta(h.cuando.slice(0,10))}<br>${esc(h.quien)}</b></li>`).join('')}</ul>`;
  }
  html += `</div></div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir(V().a_cargo > 0 ? 'inicio' : 'personas');
  const r = document.getElementById('reg');
  if (r) r.onclick = () => ir('registrar', { id:p.id, nombre:p.nombre });

  app.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => abrirReservada(b.dataset.abrir, id));

  app.querySelectorAll('[data-rutaf]').forEach(b => {
    const abrir = () => { S.rutaFicha = S.rutaFicha === b.dataset.rutaf ? null : b.dataset.rutaf; ir('ficha', id); };
    b.onclick = abrir;
    b.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abrir(); } };
  });

  app.querySelectorAll('[data-pf]').forEach(b => b.onclick = async () => {
    const ruta = (rutas || []).find(x => x.id === b.dataset.rf);
    await marcarPaso(id, b.dataset.pf, b.dataset.ef, ruta, p.nombre.split(' ')[0], 'ficha');
  });

  const ed = document.getElementById('editar');
  if (ed) ed.onclick = () => {
    document.getElementById('verDatos').hidden   = true;
    document.getElementById('formDatos').hidden  = false;
    ed.hidden = true;
  };
  const cd = document.getElementById('cancelarDatos');
  if (cd) cd.onclick = () => ir('ficha', id);

  const gd = document.getElementById('guardarDatos');
  if (gd) gd.onclick = async () => {
    gd.disabled = true;
    const { error:e1 } = await SB.from('personas').update({
      nombre:   document.getElementById('dn').value.trim(),
      celular:  document.getElementById('dc').value.trim() || null,
      correo:   document.getElementById('dm').value.trim() || null,
      telefono: document.getElementById('df').value.trim() || null,
      fecha_nacimiento: document.getElementById('dnac').value || null,
      estado:   document.getElementById('de').value
    }).eq('id', id);
    if (e1){ avisar(e1.message, true); gd.disabled = false; return; }
    avisar('Datos actualizados.');
    ir('ficha', id);
  };

  const mc = document.getElementById('moverCuidado');
  if (mc) mc.onclick = async () => {
    const nuevo = document.getElementById('nuevoLider').value;
    const { data:actual } = await SB.from('coberturas').select('id').eq('persona_id', id).is('hasta', null).maybeSingle();
    const { error } = actual
      ? await SB.from('coberturas').update({ lider_id:nuevo, asignado_por:S.yo.persona_id }).eq('id', actual.id)
      : await SB.from('coberturas').insert({ persona_id:id, lider_id:nuevo, asignado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Cuidado reasignado.');
    ir('ficha', id);
  };

  const aa = document.getElementById('addArea');
  if (aa) aa.onclick = async () => {
    const { error } = await SB.from('persona_area').insert({
      persona_id:id, area_id:document.getElementById('nuevaArea').value });
    if (error) return avisar(error.message, true);
    avisar('Área agregada.');
    ir('ficha', id);
  };

  app.querySelectorAll('[data-quitararea]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('persona_area').delete().eq('id', b.dataset.quitararea);
    if (error) return avisar(error.message, true);
    avisar('Área quitada.');
    ir('ficha', id);
  });

  app.querySelectorAll('[data-subir]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('rangos').insert({
      persona_id:id, rango:b.dataset.subir, asignado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar(`Ahora es ${b.dataset.subir}.`);
    ir('ficha', id);
  });

  app.querySelectorAll('[data-bajarrango]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Deshacer el último rango?', 'Queda anotado en el historial.', false)) return;
    const { error } = await SB.from('rangos').delete().eq('id', b.dataset.bajarrango);
    if (error) return avisar(error.message, true);
    avisar('Rango deshecho.');
    ir('ficha', id);
  });

  app.querySelectorAll('[data-borrarnota]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar este registro?', 'Queda anotado en el historial de la persona.')) return;
    const { error } = await SB.from('contactos').delete().eq('id', b.dataset.borrarnota);
    if (error) return avisar(error.message, true);
    avisar('Registro eliminado.');
    ir('ficha', id);
  });
}

async function abrirReservada(contactoId, personaId){
  const motivo = await pedirTexto('Abrir una nota reservada', {
    texto: 'Queda registrado tu nombre y el motivo, y al autor le llega el aviso.',
    marcador: '¿Por qué necesitas leerla?' });
  if (!motivo) return;
  const { data, error } = await SB.rpc('abrir_reservada', { p_contacto:contactoId, p_motivo:motivo });
  if (error) return avisar(error.message, true);
  const n = (data && data[0]) || {};
  await mostrar(n.tema || 'Nota reservada', esc(n.resumen || 'Sin contenido.'));
  avisar('Nota abierta. Le queda el registro al autor.');
  ir('ficha', personaId);
}

/* ============================================================
   Registrar encuentro
   ============================================================ */
function vRegistrar(quien){
  let tipo = 'reunion', medio = 'presencial';
  app.innerHTML = `<button class="volver" id="atras">← Volver</button>` +
    cabeza(esc(quien.nombre), 'Cuéntanos cómo fue') + `
    <div class="tarjeta"><div class="tarjeta-cuerpo"><form id="f">
      <div class="opciones">
        <button type="button" class="opcion" data-tipo="reunion" aria-pressed="true">Nos vimos</button>
        <button type="button" class="opcion" data-tipo="intento" aria-pressed="false">Lo busqué</button>
      </div>
      <div class="par"><div>
        <label for="fecha">¿Cuándo?</label>
        <input id="fecha" type="date" value="${hoy()}" max="${hoy()}" required>
      </div><div>
        <label>¿Cómo?</label>
        <div class="chips" style="padding-top:2px">
          ${[['presencial','En persona'],['llamada','Llamada'],['videollamada','Videollamada'],['mensaje','Mensaje'],['otro','Otro']]
            .map(([v,t]) => `<button type="button" class="chip" data-medio="${v}" aria-pressed="${v==='presencial'}">${t}</button>`).join('')}
        </div>
      </div></div>
      <label for="tema">¿De qué hablaron?</label>
      <input id="tema" type="text" maxlength="120" placeholder="Su trabajo, la familia, cómo va con Dios…">
      <label for="resumen">Cómo lo viste</label>
      <textarea id="resumen" placeholder="Lo que valga la pena recordar la próxima vez que se vean."></textarea>
      <label class="casilla"><input type="checkbox" id="reservada">
        <div><b>Guardar como reservada</b>
        <span>Quien está arriba va a ver que escribiste algo y cuándo, pero no el contenido.
              Si de verdad necesita leerlo puede abrirlo, y a ti te queda el aviso de quién fue.</span></div></label>
      <div id="err"></div>
      <div style="margin-top:22px"><button class="btn ancho" type="submit" id="b">Guardar</button></div>
    </form></div></div>`;

  document.getElementById('atras').onclick = () => ir('ficha', quien.id);
  app.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => {
    tipo = b.dataset.tipo;
    app.querySelectorAll('[data-tipo]').forEach(o => o.setAttribute('aria-pressed', o === b));
  });
  app.querySelectorAll('[data-medio]').forEach(b => b.onclick = () => {
    medio = b.dataset.medio;
    app.querySelectorAll('[data-medio]').forEach(o => o.setAttribute('aria-pressed', o === b));
  });

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById('b');
    b.disabled = true; b.textContent = 'Guardando…';
    const { error } = await SB.from('contactos').insert({
      persona_id: quien.id, lider_id: S.yo.persona_id,
      fecha: document.getElementById('fecha').value, tipo, medio,
      tema:    document.getElementById('tema').value.trim()    || null,
      resumen: document.getElementById('resumen').value.trim() || null,
      reservada: document.getElementById('reservada').checked
    });
    if (error){
      document.getElementById('err').innerHTML = `<div class="error">No se pudo guardar: ${esc(error.message)}</div>`;
      b.disabled = false; b.textContent = 'Guardar';
      return;
    }
    avisar(tipo === 'reunion' ? 'Encuentro guardado.' : 'Intento guardado.');
    ir('ficha', quien.id);
  };
}

/* ============================================================
   Procesos
   ============================================================ */
const ESCALA = ['paje','escudero','caballero'];
const TIPOS_CURSO = { clase:'Clase', proceso:'Proceso' };

/* ============================================================
   Procesos — el catálogo
   ============================================================ */
async function vProcesos(){
  cargando();
  const yo = V();
  if (!S.qCurso) S.qCurso = { texto:'', tipo:'' };

  const [{ data:cursos, error }, { data:dir }] = await Promise.all([
    SB.from('cursos').select('*').order('tipo').order('nombre'),
    SB.from('directorio').select('*').order('nombre')
  ]);
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;

  app.innerHTML = cabeza('Procesos', 'Las clases y los procesos del ministerio',
    yo.es_admin ? `<button class="btn" id="nuevo">Crear curso</button>` : '') + `

    <div class="buscador">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
      <input id="qc" type="text" autocomplete="off" placeholder="Buscar un curso…" value="${esc(S.qCurso.texto)}">
    </div>

    <div class="chips" style="margin-bottom:16px">
      ${[['','Todos'],['clase','Clases'],['proceso','Procesos']].map(([v,t]) =>
        `<button class="chip" data-tc="${v}" aria-pressed="${S.qCurso.tipo === v}">${t}</button>`).join('')}
    </div>

    ${yo.es_admin ? `<div id="formCurso" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="par"><div><label for="cn" style="margin-top:0">Nombre</label>
        <input id="cn" type="text" placeholder="Escuela de hombría · módulo 1"></div>
        <div><label for="ct" style="margin-top:0">Tipo</label><select id="ct">
          <option value="clase">Clase</option><option value="proceso">Proceso</option></select></div></div>
      <label for="cd">Descripción</label><textarea id="cd" style="min-height:70px"></textarea>
      <div class="par"><div><label for="cdur">Duración</label>
        <input id="cdur" type="text" placeholder="6 sesiones · 3 meses"></div>
        <div><label for="cresp">Responsable</label><select id="cresp"><option value="">Sin asignar</option>
          ${(dir || []).map(d => `<option value="${d.id}">${esc(d.nombre)}</option>`).join('')}</select></div></div>
      <div class="par"><div><label for="cq">¿Quién marca los pasos?</label>
        <select id="cq"><option value="false">Su líder</option><option value="true">La persona misma</option></select></div>
        <div><label for="cplazo">Días de plazo</label>
          <input id="cplazo" type="text" inputmode="numeric" placeholder="40 · déjalo vacío si no hay"></div></div>
      <label for="cestr">¿El plazo se puede alargar al asignarlo?</label>
      <select id="cestr"><option value="false">Sí, es una sugerencia</option>
        <option value="true">No, son esos días y punto</option></select>
      <div style="margin-top:16px"><button class="btn" id="guardarCurso">Crear curso</button></div>
    </div></div>` : ''}

    <p class="conteo-res" id="conteoC"></p>
    <div class="cursos" id="listaC"></div>`;

  function pasa(c){
    const f = S.qCurso;
    if (f.tipo && c.tipo !== f.tipo) return false;
    if (f.texto){
      const t = normaliza([c.nombre, c.descripcion, TIPOS_CURSO[c.tipo], c.responsable_nombre].join(' '));
      if (!normaliza(f.texto).split(/\s+/).filter(Boolean).every(x => t.includes(x))) return false;
    }
    return true;
  }

  function pintarC(){
    const res = (cursos || []).filter(pasa);
    document.getElementById('listaC').innerHTML = res.length ? res.map(c => `
      <button class="ccard" data-curso="${c.id}">
        <span class="ccard-foto" ${c.imagen ? `style="background-image:url('${esc(c.imagen)}')"` : ''}>
          <span>${esc(TIPOS_CURSO[c.tipo] || c.tipo)}</span></span>
        <span class="ccard-cuerpo">
          <h3>${esc(c.nombre)}</h3>
          ${c.descripcion ? `<p>${esc(c.descripcion)}</p>` : ''}
          <span class="ccard-pie">
            <span>${c.sesiones} ${c.sesiones === 1 ? 'sesión' : 'sesiones'}</span>
            <span>· ${c.inscritos} ${c.inscritos === 1 ? 'inscrito' : 'inscritos'}</span>
            ${c.completados ? `<span style="color:var(--verde)">· ${c.completados} terminaron</span>` : ''}
            ${c.vencidos ? `<span style="color:var(--barro)">· ${c.vencidos} vencidos</span>` : ''}
            ${c.dias_plazo ? `<span>· ${c.dias_plazo} días${c.plazo_estricto ? ' fijos' : ''}</span>` : ''}
            ${c.activa ? '' : '<span class="sello">Inactivo</span>'}
          </span></span>
      </button>`).join('')
      : `<div class="vacio" style="grid-column:1/-1"><strong>Ningún curso coincide</strong>
         ${yo.es_admin ? 'Crea uno con el botón de arriba.' : ''}</div>`;
    document.getElementById('conteoC').textContent =
      `${res.length} de ${(cursos || []).length}`;
    document.querySelectorAll('[data-curso]').forEach(b => b.onclick = () => ir('curso', b.dataset.curso));
  }
  pintarC();

  const qc = document.getElementById('qc');
  qc.oninput = () => { S.qCurso.texto = qc.value; pintarC(); };
  app.querySelectorAll('[data-tc]').forEach(b => b.onclick = () => {
    S.qCurso.tipo = b.dataset.tc;
    app.querySelectorAll('[data-tc]').forEach(o => o.setAttribute('aria-pressed', o === b));
    pintarC();
  });

  const nb = document.getElementById('nuevo');
  if (nb) nb.onclick = () => {
    const f = document.getElementById('formCurso');
    f.hidden = !f.hidden; nb.textContent = f.hidden ? 'Crear curso' : 'Cancelar';
  };
  const gc = document.getElementById('guardarCurso');
  if (gc) gc.onclick = async () => {
    const nombre = document.getElementById('cn').value.trim();
    if (!nombre) return avisar('Ponle nombre al curso.', true);
    gc.disabled = true;
    const { data, error } = await SB.from('rutas').insert({
      nombre, tipo: document.getElementById('ct').value,
      descripcion: document.getElementById('cd').value.trim()   || null,
      duracion:    document.getElementById('cdur').value.trim() || null,
      responsable: document.getElementById('cresp').value       || null,
      auto_marca:  document.getElementById('cq').value === 'true',
      dias_plazo:  parseInt(document.getElementById('cplazo').value, 10) || null,
      plazo_estricto: document.getElementById('cestr').value === 'true',
      orden: (cursos || []).length + 1
    }).select('id').single();
    if (error){ avisar(error.message, true); gc.disabled = false; return; }
    avisar('Curso creado.');
    ir('curso', data.id);
  };
}

const normaliza = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ============================================================
   Un curso
   ============================================================ */

    SB.from('pasos').select('*').eq('ruta_id', id).order('orden'),
    SB.from('inscritos').select('*').eq('ruta_id', id).order('nombre'),
    SB.from('buscador').select('*').order('nombre'),

      <label for="eimg">Portada</label>
      <input id="eimg" type="url" placeholder="https://… o súbela abajo" value="${esc(c.imagen || '')}">
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:9px;align-items:center">

        <button class="btn seco chico" id="subirImg">Subir imagen</button></div>
      <div class="par" style="margin-top:4px"><div><label for="eq2">¿Quién marca los pasos?</label>
        <select id="eq2"><option value="false"${!c.auto_marca?' selected':''}>Su líder</option>

      <div class="par"><div><label for="eplazo">Días de plazo</label>

          <select id="eestr"><option value="false"${!c.plazo_estricto?' selected':''}>Sí, es una sugerencia</option>
            <option value="true"${c.plazo_estricto?' selected':''}>No, son esos días y punto</option></select></div></div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px">
        <button class="btn" id="guardarEd">Guardar cambios</button>
        <button class="btn rojo" id="borrarCurso">Eliminar curso</button></div>
    </div></div>`;

  /* ---------- asignar ---------- */
  const areasL = [...new Set((todos || []).flatMap(g => String(g.areas || '').split(' · ')))].filter(Boolean).sort();
  const cursosL = [...new Set((todos || []).flatMap(g => String(g.cursos || '').split(' · ')))].filter(Boolean).sort();
  const plazoBase = c.dias_plazo || '';

  html += `<div id="panelAsignar" hidden class="tarjeta">
    <div class="tarjeta-alto"><h2>Asignar el curso</h2></div>
    <div class="tarjeta-cuerpo">

      <div class="avanzada">
        <div><label for="aArea" style="margin-top:0">Área</label>
          <select id="aArea" data-af><option value="">Cualquiera</option>

            <option value="__sin">Sin área</option></select></div>
        <div><label for="aAreaNo" style="margin-top:0">Excluir área</label>
          <select id="aAreaNo" data-af><option value="">Ninguna</option>
            ${areasL.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('')}</select></div>
        <div><label for="aRan" style="margin-top:0">Rango</label>
          <select id="aRan" data-af><option value="">Cualquiera</option>
            <option value="paje">Paje</option><option value="escudero">Escudero</option>
            <option value="caballero">Caballero</option><option value="__sin">Sin rango</option></select></div>
        <div><label for="aRanNo">Excluir rango</label>
          <select id="aRanNo" data-af><option value="">Ninguno</option>
            <option value="paje">Paje</option><option value="escudero">Escudero</option>
            <option value="caballero">Caballero</option></select></div>
        <div><label for="aCur">Ya hizo el curso</label>
          <select id="aCur" data-af><option value="">Cualquiera</option>
            ${cursosL.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>
        <div><label for="aCurNo">Excluir a los de</label>
          <select id="aCurNo" data-af><option value="">Ninguno</option>
            ${cursosL.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>
        <div><label for="aSit">Cuidado</label>
          <select id="aSit" data-af><option value="">Cualquiera</option>
            <option value="cuidado">Cuidado</option><option value="en alerta">En alerta</option>
            <option value="desconectado">Desconectado</option></select></div>
        <div><label for="aEst">Estado</label>
          <select id="aEst" data-af><option value="activo">Activo</option>
            <option value="">Cualquiera</option><option value="visitante">Visitante</option></select></div>
      </div>

      <div class="buscador" style="margin:14px 0 10px">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
        <input id="qa" type="text" autocomplete="off" placeholder="…y buscar por nombre">
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn seco chico" id="marcarTodos">Marcar los que se ven</button>
        <button class="btn seco chico" id="desmarcarTodos">Desmarcar todos</button>
        <span class="ruta-conteo" id="contSel">0 marcados</span>
      </div>

      <div class="asignar-lista" id="candidatos"></div>

      <div class="avanzada" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--linea-suave)">
        <div><label for="aDias" style="margin-top:0">Días de plazo</label>
          <input id="aDias" type="text" inputmode="numeric" value="${plazoBase}"
            placeholder="sin plazo" ${c.plazo_estricto ? 'disabled' : ''}></div>
        <div><label for="aFecha" style="margin-top:0">…o fecha límite</label>
          <input id="aFecha" type="date" ${c.plazo_estricto ? 'disabled' : ''}></div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn" id="confirmarAsig" style="width:100%">Asignar</button></div>
      </div>
      ${c.plazo_estricto && c.dias_plazo
        ? `<p class="ayuda">Este curso tiene plazo fijo de ${c.dias_plazo} días.</p>` : ''}
    </div></div>`;

  /* ---------- sesiones ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Sesiones</h2>
      <span class="ruta-conteo">${c.sesiones} en total</span></div>
    <div class="tarjeta-cuerpo">`;
  if (!sesiones || !sesiones.length){
    html += `<p style="margin:0;color:var(--suave);font-size:14.5px">Este curso todavía no tiene sesiones.</p>`;
  } else {
    html += (sesiones || []).map((x,i) => `<div class="sesion">
      <span class="sesion-n">${i+1}</span>
      <span class="sesion-txt"><b>${esc(x.nombre)}</b>
        ${x.descripcion ? `<span>${esc(x.descripcion)}</span>` : ''}</span>
      ${puedeEditar ? `<button class="btn rojo chico" data-bs="${x.id}">✕</button>` : ''}
    </div>`).join('');
  }
  if (puedeEditar) html += `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--linea-suave)">
      <label style="margin-top:0" for="sn">Agregar una sesión</label>
      <input id="sn" type="text" placeholder="Nombre de la sesión">
      <input id="sd" type="text" placeholder="De qué se trata (opcional)" style="margin-top:8px">
      <div style="margin-top:11px"><button class="btn chico" id="addSesion">Agregar</button></div></div>`;
  html += `</div></div>`;

  /* ---------- inscritos ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Quiénes lo están haciendo</h2>
      <span class="ruta-conteo">${(gente || []).length}</span></div>`;
  if (!gente || !gente.length){
    html += `<div class="tarjeta-cuerpo"><p style="margin:0;color:var(--suave);font-size:14.5px">
      Nadie inscrito todavía.</p></div>`;
  } else {
    html += `<ul class="registro">${gente.map(g => {
      const pct = g.pasos_total ? Math.round(g.pasos_hechos / g.pasos_total * 100) : 0;
      const col = g.estado === 'completado' ? 'cuidado' : (g.estado === 'retirado' ? 'desconectado' : 'alerta');
      return `<li><div class="fila" style="cursor:default">
        <span class="fila-alto">
          <button style="flex:1;min-width:0;background:none;border:0;text-align:left;cursor:pointer;padding:0"
            data-persona="${g.persona_id}"><span class="nombre">${esc(g.nombre)}</span></button>
          <span class="marca-est m-${col}">${esc(g.estado)}</span></span>
        <span class="sub">
          <span>${g.pasos_hechos} de ${g.pasos_total} sesiones</span>
          ${g.fecha_fin ? `<span>· terminó el ${fechaCorta(g.fecha_fin)}</span>`
                        : `<span>· empezó el ${fechaCorta(g.fecha_inicio)}</span>`}
          ${g.fecha_limite && !g.fecha_fin ? `<span class="marca-est m-${
              g.vencido ? 'desconectado' : (g.dias_restantes <= 7 ? 'alerta' : 'cuidado')}">${
              g.vencido ? `venció hace ${Math.abs(g.dias_restantes)} días`
                        : `${g.dias_restantes} días`}</span>` : ''}
          ${g.rango ? `<span class="sello">${esc(mayus(g.rango))}</span>` : ''}</span>
        <span class="barra-prog"><i style="width:${pct}%"></i></span>
        <span style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
          ${g.estado !== 'completado' ? `<button class="btn seco chico" data-term="${g.id}">Marcar terminado</button>` : ''}
          <button class="btn rojo chico" data-quitarins="${g.id}" data-nomq="${esc(g.nombre)}">Quitar del curso</button></span>
      </div></li>`;
    }).join('')}</ul>`;
  }
  html += `</div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir('procesos');
  app.querySelectorAll('[data-persona]').forEach(b => b.onclick = () => ir('ficha', b.dataset.persona));

  /* ---------- asignar: buscador + reglas ---------- */
  const sel = new Set();
  const panel = document.getElementById('panelAsignar');
  document.getElementById('asignar').onclick = () => { panel.hidden = !panel.hidden; if (!panel.hidden) pintarCand(); };

  const V_ = q => document.getElementById(q).value;

  function candidatos(){
    const q = normaliza(V_('qa'));
    const fArea = V_('aArea'), fAreaNo = V_('aAreaNo'), fRan = V_('aRan'), fRanNo = V_('aRanNo');
    const fCur = V_('aCur'), fCurNo = V_('aCurNo'), fSit = V_('aSit'), fEst = V_('aEst');
    return (todos || []).filter(g => {
      if (yaDentro.has(g.id)) return false;
      const areas = String(g.areas || ''), cursos = String(g.cursos || '');
      if (fArea === '__sin' ? areas : fArea && !areas.includes(fArea)) return false;
      if (fAreaNo && areas.includes(fAreaNo)) return false;
      if (fRan === '__sin' ? g.rango : fRan && g.rango !== fRan) return false;
      if (fRanNo && g.rango === fRanNo) return false;
      if (fCur && !cursos.includes(fCur)) return false;
      if (fCurNo && cursos.includes(fCurNo)) return false;
      if (fSit && g.situacion !== fSit) return false;
      if (fEst && g.estado !== fEst) return false;
      if (q){
        const t = normaliza([g.nombre, g.areas, g.rango, g.correo].join(' '));
        if (!q.split(/\s+/).filter(Boolean).every(x => t.includes(x))) return false;
      }
      return true;
    });
  }

  function pintarCand(){
    const lista = candidatos();
    document.getElementById('candidatos').innerHTML = lista.length ? lista.map(g => `
      <label class="asignar-fila"><input type="checkbox" data-sel="${g.id}" ${sel.has(g.id) ? 'checked' : ''}>
        <b>${esc(g.nombre)}</b>
        <span>${esc(mayus(g.rango) || 'Sin rango')}${g.areas ? ' · ' + esc(String(g.areas).split(' · ')[0]) : ''}</span>
      </label>`).join('')
      : `<p style="margin:10px;color:var(--suave);font-size:14px">Nadie coincide con esos filtros.</p>`;
    document.querySelectorAll('[data-sel]').forEach(ch => ch.onchange = () => {
      ch.checked ? sel.add(ch.dataset.sel) : sel.delete(ch.dataset.sel);
      contar();
    });
    contar();
  }

  function contar(){
    const n = sel.size, v = candidatos().length;
    document.getElementById('contSel').textContent =
      `${n} ${n === 1 ? 'marcado' : 'marcados'} · ${v} a la vista`;
  }

  document.getElementById('qa').oninput = pintarCand;
  app.querySelectorAll('[data-af]').forEach(el => el.onchange = pintarCand);

  document.getElementById('marcarTodos').onclick = () => {
    candidatos().forEach(g => sel.add(g.id)); pintarCand();
  };
  document.getElementById('desmarcarTodos').onclick = () => { sel.clear(); pintarCand(); };

  document.getElementById('confirmarAsig').onclick = async () => {
    if (!sel.size) return avisar('No has marcado a nadie.', true);
    let limite = null;
    if (!c.plazo_estricto){
      const f = V_('aFecha'), d = parseInt(V_('aDias'), 10);
      if (f) limite = f;
      else if (Number.isFinite(d) && d > 0){
        const x = new Date(hoy() + 'T12:00:00');
        x.setDate(x.getDate() + d);
        limite = x.toLocaleDateString('en-CA');
      }
    }
    const filas = [...sel].map(pid => ({
      ruta_id:id, persona_id:pid, asignado_por:S.yo.persona_id,
      estado:'inscrito', fecha_limite:limite }));
    const { error } = await SB.from('inscripciones').upsert(filas, { onConflict:'ruta_id,persona_id' });
    if (error) return avisar(error.message, true);
    avisar(`${sel.size} ${sel.size === 1 ? 'persona asignada' : 'personas asignadas'}.`);
    ir('curso', id);
  };

  /* ---------- inscritos: terminar y quitar ---------- */
  app.querySelectorAll('[data-term]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('inscripciones')
      .update({ estado:'completado', fecha_fin:hoy() }).eq('id', b.dataset.term);
    if (error) return avisar(error.message, true);
    avisar('Marcado como terminado.');
    ir('curso', id);
  });
  app.querySelectorAll('[data-quitarins]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Quitar del curso?', `${b.dataset.nomq} sale del curso. Los pasos que haya marcado se quedan.`)) return;
    const { error } = await SB.from('inscripciones').delete().eq('id', b.dataset.quitarins);
    if (error) return avisar(error.message, true);
    avisar('Quitado del curso.');
    ir('curso', id);
  });

  /* ---------- sesiones ---------- */
  const as = document.getElementById('addSesion');
  if (as) as.onclick = async () => {
    const nombre = document.getElementById('sn').value.trim();
    if (!nombre) return avisar('Ponle nombre a la sesión.', true);
    const { error } = await SB.from('pasos').insert({
      ruta_id:id, nombre,
      descripcion: document.getElementById('sd').value.trim() || null,
      orden: (sesiones || []).length + 1 });
    if (error) return avisar(error.message, true);
    avisar('Sesión agregada.');
    ir('curso', id);
  };
  app.querySelectorAll('[data-bs]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar esta sesión?', 'Se van los avances que tenga marcados.')) return;
    const { error } = await SB.from('pasos').delete().eq('id', b.dataset.bs);
    if (error) return avisar(error.message, true);
    avisar('Sesión eliminada.');
    ir('curso', id);
  });

  /* ---------- editar ---------- */
  const ec = document.getElementById('editarC');
  if (ec) ec.onclick = () => {
    const f = document.getElementById('formEd');
    f.hidden = !f.hidden; ec.textContent = f.hidden ? 'Editar' : 'Cerrar';
  };

  const si = document.getElementById('subirImg');
  if (si) si.onclick = async () => {
    const f = document.getElementById('efile').files[0];
    if (!f) return avisar('Elige primero una imagen.', true);
    si.disabled = true; si.textContent = 'Subiendo…';
    const ruta = `${id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
    const { error } = await SB.storage.from('cursos').upload(ruta, f, { upsert:true });
    if (error){
      avisar('No se pudo subir: ' + error.message + '. Puedes pegar una dirección de imagen en el campo de arriba.', true);
      si.disabled = false; si.textContent = 'Subir imagen';
      return;
    }
    const { data } = SB.storage.from('cursos').getPublicUrl(ruta);
    document.getElementById('eimg').value = data.publicUrl;
    si.disabled = false; si.textContent = 'Subir imagen';
    avisar('Imagen lista. Dale a Guardar cambios.');
  };

  const ge = document.getElementById('guardarEd');
  if (ge) ge.onclick = async () => {
    ge.disabled = true;
    const { error } = await SB.from('rutas').update({
      nombre:      document.getElementById('en2').value.trim(),
      tipo:        document.getElementById('et2').value,
      descripcion: document.getElementById('ed2').value.trim()   || null,
      duracion:    document.getElementById('edur2').value.trim() || null,
      responsable: document.getElementById('eresp2').value       || null,
      imagen:      document.getElementById('eimg').value.trim()  || null,
      auto_marca:  document.getElementById('eq2').value === 'true',
      activa:      document.getElementById('eact').value === 'true',
      dias_plazo:  parseInt(document.getElementById('eplazo').value, 10) || null,
      plazo_estricto: document.getElementById('eestr').value === 'true'
    }).eq('id', id);
    if (error){ avisar(error.message, true); ge.disabled = false; return; }
    avisar('Curso actualizado.');
    ir('curso', id);
  };

  const bc = document.getElementById('borrarCurso');
  if (bc) bc.onclick = async () => {
    if (!await confirmar('¿Eliminar este curso?', `«${c.nombre}» se va con sus sesiones, sus inscritos y los avances de todos.`)) return;
    const { error } = await SB.from('rutas').delete().eq('id', id);
    if (error) return avisar(error.message, true);
    avisar('Curso eliminado.');
    ir('procesos');
  };
}

async function marcarPaso(personaId, pasoId, estado, ruta, primero, volverA){
  const { data:ya } = await SB.from('avances').select('id,estado')
    .eq('persona_id', personaId).eq('paso_id', pasoId).maybeSingle();

  let error, quitado = false;
  if (ya && ya.estado === estado){
    ({ error } = await SB.from('avances').delete().eq('id', ya.id));
    quitado = true;
  } else if (ya){
    ({ error } = await SB.from('avances')
      .update({ estado, fecha:hoy(), registrado_por:S.yo.persona_id, actualizado_en:new Date().toISOString() })
      .eq('id', ya.id));
  } else {
    ({ error } = await SB.from('avances').insert({
      persona_id:personaId, paso_id:pasoId, estado, registrado_por:S.yo.persona_id }));
  }
  if (error) return avisar(error.message, true);

  const esEncuentro = !quitado && estado === 'completado' && ruta && !ruta.auto_marca
                      && personaId !== S.yo.persona_id && S.contarEncuentro !== false;

  if (esEncuentro){
    const { data:paso } = await SB.from('pasos').select('nombre').eq('id', pasoId).maybeSingle();
    const { error:e2 } = await SB.from('contactos').insert({
      persona_id:personaId, lider_id:S.yo.persona_id, fecha:hoy(),
      tipo:'reunion', medio:'otro',
      tema:`${ruta.nombre}: ${paso?.nombre || 'un paso'}`,
      resumen:'Registrado al marcar el paso como completado.' });
    avisar(e2 ? 'Paso marcado, pero el encuentro no se guardó: ' + e2.message
              : `Paso marcado y encuentro guardado con ${primero}.`, !!e2);
  } else {
    avisar(quitado ? 'Marca quitada.' : 'Paso marcado.');
  }
  volverA === 'ficha' ? ir('ficha', personaId) : ir('procesos');
}

   Descargar, eligiendo qué campos
   ============================================================ */
const CAMPOS = [
  ['nombre','Nombre'], ['nombre_completo','Nombre completo'], ['rango','Rango'],
  ['situacion','Estado de cuidado'], ['dias','Días sin verse'], ['ultima_reunion','Último encuentro'],
  ['gestion','Gestión'], ['lider','Lo cuida'], ['areas','Áreas'], ['areas_todas','Áreas (incluidas las pasadas)'],
  ['cursos','Cursos'], ['cursos_hechos','Cursos terminados'], ['rutas_completas','Cursos completos'],
  ['pasos_hechos','Sesiones completadas'], ['edad','Edad'], ['fecha_nacimiento','Fecha de nacimiento'],
  ['celular','Celular'], ['telefono','Teléfono fijo'], ['correo','Correo'],
  ['documento','Cédula'], ['estado','Estado'], ['fecha_ingreso','Fecha de ingreso'],
  ['como_llego','Cómo llegó'], ['anios','Años en el sistema']
];
const CAMPOS_BASE = ['nombre','rango','situacion','dias','lider','areas','celular','correo'];

function descargar(filas){
  if (!filas.length) return avisar('No hay nada que descargar.', true);
  const puede = V().es_admin;
  const disponibles = CAMPOS.filter(c => c[0] !== 'documento' || puede);
  const marcados = new Set(CAMPOS_BASE);

  dialogo({
    titulo: 'Descargar',
    texto: `${filas.length} ${filas.length === 1 ? 'persona' : 'personas'}. Elige qué datos quieres.`,
    aceptar: 'Descargar',
    ancho: true,
    cuerpo: `
      <div class="buscador"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/>
        <path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
        <input id="qCampo" type="text" placeholder="Buscar un campo…" autocomplete="off"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button type="button" class="btn seco chico" id="todosCampos">Todos</button>
        <button type="button" class="btn seco chico" id="ningunCampo">Ninguno</button>
        <span class="ruta-conteo" id="contCampos"></span></div>
      <div class="campos-lista" id="listaCampos"></div>`,
    alMontar: velo => {
      const caja = velo.querySelector('#listaCampos');
      const q    = velo.querySelector('#qCampo');
      const cont = velo.querySelector('#contCampos');

      const pintar = () => {
        const t = normaliza(q.value);
        const vis = disponibles.filter(c => !t || normaliza(c[1]).includes(t));
        caja.innerHTML = vis.length ? vis.map(([k,n]) => `
          <label class="campo-op"><input type="checkbox" data-c="${k}" ${marcados.has(k) ? 'checked' : ''}>
            ${esc(n)}</label>`).join('')
          : `<p style="margin:10px;color:var(--suave);font-size:14px">Ningún campo se llama así.</p>`;
        caja.querySelectorAll('[data-c]').forEach(ch => ch.onchange = () => {
          ch.checked ? marcados.add(ch.dataset.c) : marcados.delete(ch.dataset.c);
          cont.textContent = `${marcados.size} elegidos`;
        });
        cont.textContent = `${marcados.size} elegidos`;
      };
      pintar();
      q.oninput = pintar;
      velo.querySelector('#todosCampos').onclick = () => {
        disponibles.forEach(c => marcados.add(c[0])); pintar();
      };
      velo.querySelector('#ningunCampo').onclick = () => { marcados.clear(); pintar(); };

      return () => {
        if (!marcados.size){ avisar('Elige al menos un campo.', true); return undefined; }
        return [...marcados];
      };
    }
  }).then(elegidos => {
    if (!elegidos) return;
    const cols = disponibles.filter(c => elegidos.includes(c[0]));
    const limpia = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
    const csv = '﻿' + [cols.map(c => limpia(c[1])).join(';')]
      .concat(filas.map(g => cols.map(c => limpia(g[c[0]])).join(';'))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = `personas-${hoy()}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
    avisar(`${filas.length} ${filas.length === 1 ? 'persona descargada' : 'personas descargadas'}.`);
  });
}

const NOMBRE_FILTRO = {
  texto:'Busca', excluir:'Excluye', situacion:'Cuidado', rango:'Rango', rangoNo:'Sin el rango',
  area:'Área', areaNo:'Sin el área', proceso:'Proceso', curso:'Curso', estado:'Estado',
  edadMin:'Desde', edadMax:'Hasta', lider:'Lo cuida', anio:'Año'
};

const VALOR_FILTRO = {
  proceso:{ con:'empezado', sin:'sin empezar', completo:'con alguno completo' },
  rango:{ __sin:'sin rango' }, rangoNo:{ __sin:'sin rango' },
  area:{ __sin:'sin área' }, lider:{ __sin:'nadie' }
};

function resumenFiltros(f, nombres){
  return Object.entries(f || {})
    .filter(([k,v]) => v && NOMBRE_FILTRO[k])
    .map(([k,v]) => {
      const leible = (VALOR_FILTRO[k] && VALOR_FILTRO[k][v])
        || (k === 'lider' ? (nombres.get(v) || v) : v);
      return `${NOMBRE_FILTRO[k]}: ${leible}`;
    })
    .join(' · ') || 'Sin filtros';
}

/* El mismo filtro que usa Personas, aparte para que las Listas
   puedan correr la regla sin volver a pintar esa pantalla. */
function pasaFiltros(g, f){
  const N = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const todo = N([g.nombre, g.nombre_completo, g.correo, g.celular, g.telefono,
                  g.documento, g.areas, g.areas_todas, g.rango, g.cursos].join(' '));
  if (f.texto   && !N(f.texto).split(/\s+/).filter(Boolean).every(t => todo.includes(t))) return false;
  if (f.excluir &&  N(f.excluir).split(/\s+/).filter(Boolean).some(t => todo.includes(t))) return false;
  if (f.situacion && g.situacion !== f.situacion) return false;
  if (f.rango === '__sin' ? g.rango : f.rango && g.rango !== f.rango) return false;
  if (f.rangoNo && (f.rangoNo === '__sin' ? !g.rango : g.rango === f.rangoNo)) return false;
  if (f.area === '__sin' ? g.areas : f.area && !String(g.areas).includes(f.area)) return false;
  if (f.areaNo && String(g.areas).includes(f.areaNo)) return false;
  if (f.estado && g.estado !== f.estado) return false;
  if (f.lider === '__sin' ? g.lider_id : f.lider && g.lider_id !== f.lider) return false;
  if (f.curso && !String(g.cursos).includes(f.curso)) return false;
  if (f.proceso === 'con'      && !g.pasos_marcados) return false;
  if (f.proceso === 'sin'      &&  g.pasos_marcados) return false;
  if (f.proceso === 'completo' && !g.rutas_completas) return false;
  if (f.anio && !String(g.anios).split(' ').includes(f.anio)) return false;
  const min = parseInt(f.edadMin, 10), max = parseInt(f.edadMax, 10);
  if (Number.isFinite(min) && (g.edad === null || g.edad < min)) return false;
  if (Number.isFinite(max) && (g.edad === null || g.edad > max)) return false;
  return true;
}

    caja.innerHTML = `<div class="chips">${gente.map(g => {

    caja.querySelectorAll('[data-asig]').forEach(b => b.onclick = async () => {

            evento_id:id, persona_id:pid, area_id:aid, rol:'servidor', creado_por:S.yo.persona_id });
      if (error) return avisar(error.message, true);
      ir('evento', id);

  const ae = document.getElementById('addEnc');
  if (ae) ae.onclick = async () => {
