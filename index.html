      <div class="par"><div><label for="dm">Correo</label><input id="dm" type="email" value="${esc(p.correo || '')}"></div>
        <div><label for="df">Teléfono fijo</label><input id="df" type="text" inputmode="numeric" value="${esc(p.telefono || '')}"></div></div>
      <div class="par"><div><label for="dnac">Fecha de nacimiento</label><input id="dnac" type="date" value="${esc(p.fecha_nacimiento || '')}"></div>
        <div><label for="de">Estado</label><select id="de">
          ${['activo','visitante','retirado'].map(e => `<option value="${e}"${e===p.estado?' selected':''}>${e}</option>`).join('')}</select></div></div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn" id="guardarDatos">Guardar</button>
        <button class="btn seco" id="cancelarDatos">Cancelar</button></div>
    </div>`;

  if (mando){
    const lideres = (dir || []).filter(d => d.id !== p.id && (d.rango === 'escudero' || d.rango === 'caballero'));
    const libres  = (todasAreas || []).filter(a => !(areasP || []).some(x => x.area_id === a.id));
    html += `<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--linea-suave)">
      <label style="margin-top:0" for="nuevoLider">¿Quién lo cuida?</label>
      <div class="par"><div><select id="nuevoLider">
        ${lideres.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</select></div>
        <div><button class="btn" id="moverCuidado" style="width:100%">Pasar a su cuidado</button></div></div>

      <label for="nuevaArea">Áreas (máximo 3)</label>
      <div class="chips" style="margin-bottom:10px">${(areasP || []).map(a =>
        `<button class="chip" aria-pressed="true" data-quitararea="${a.id}">${esc(a.areas.nombre)} ✕</button>`).join('')
        || '<span class="ruta-conteo">Ninguna todavía</span>'}</div>
      ${(areasP || []).length < 3 && libres.length ? `<div class="par">
        <div><select id="nuevaArea">${libres.map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select></div>
        <div><button class="btn seco" id="addArea" style="width:100%">Agregar área</button></div></div>` : ''}
    </div>`;
  }
  html += `</div></div>`;

  /* ---------- registro de cuidado ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Registro de cuidado</h2></div>
    <div class="tarjeta-cuerpo">`;
  if (!notas || !notas.length){
    html += `<p style="margin:0;color:var(--suave);font-size:14.5px">Todavía no hay nada escrito.</p>`;
  } else {
    html += '<ul class="hilo">' + notas.map(n => `
      <li class="anota ${n.tipo === 'reunion' ? 'es-reunion' : ''}">
        <div class="anota-alto"><span class="anota-fecha">${fechaCorta(n.fecha)}</span>
          <span class="sello">${n.tipo === 'reunion' ? 'Se vieron' : 'Lo buscó'}</span>
          ${n.medio ? `<span class="anota-fecha">${esc(n.medio)}</span>` : ''}
          <span class="anota-fecha">· ${esc(S.nombres.get(n.lider_id) || 'Otro líder')}</span></div>
        <p class="anota-tema">${esc(n.tema || 'Sin tema')}</p>
        ${n.oculta
          ? `<button class="btn seco chico" data-abrir="${n.id}" style="margin-top:9px">Abrir con registro</button>`
          : (n.resumen ? `<p class="anota-cuerpo">${esc(n.resumen)}</p>` : '')}
        ${(n.lider_id === S.yo.persona_id || yo.es_admin)
          ? `<div style="margin-top:9px"><button class="btn rojo chico" data-borrarnota="${n.id}">Eliminar</button></div>` : ''}
      </li>`).join('') + '</ul>';
  }
  html += '</div></div>';

  /* ---------- historial ---------- */
  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Historial de cambios</h2>
      <span class="ruta-conteo">${(hist || []).length} ${(hist||[]).length === 1 ? 'registro' : 'registros'}</span></div>
    <div class="tarjeta-cuerpo">`;
  if (!hist || !hist.length){
    html += `<p style="margin:0;color:var(--suave);font-size:14.5px">Sin cambios registrados todavía.</p>`;
  } else {
    html += `<ul class="datos">${hist.map(h => `<li>
      <span><span class="sello">${esc(h.asunto)}</span> ${esc(h.detalle)}</span>
      <b style="font-weight:500;color:var(--tenue);font-size:12.5px;white-space:nowrap">
        ${fechaCorta(h.cuando.slice(0,10))}<br>${esc(h.quien)}</b></li>`).join('')}</ul>`;
  }
  html += `</div></div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir(V().a_cargo > 0 ? 'inicio' : 'personas');
  const r = document.getElementById('reg');
  if (r) r.onclick = () => ir('registrar', { id:p.id, nombre:p.nombre });

  app.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => abrirReservada(b.dataset.abrir, id));

  app.querySelectorAll('[data-rutaf]').forEach(b => {
    const abrir = () => { S.rutaFicha = S.rutaFicha === b.dataset.rutaf ? null : b.dataset.rutaf; ir('ficha', id); };
    b.onclick = abrir;
    b.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abrir(); } };
  });

  app.querySelectorAll('[data-pf]').forEach(b => b.onclick = async () => {
    const ruta = (rutas || []).find(x => x.id === b.dataset.rf);
    await marcarPaso(id, b.dataset.pf, b.dataset.ef, ruta, p.nombre.split(' ')[0], 'ficha');
  });

  const ed = document.getElementById('editar');
  if (ed) ed.onclick = () => {
    document.getElementById('verDatos').hidden   = true;
    document.getElementById('formDatos').hidden  = false;
    ed.hidden = true;
  };
  const cd = document.getElementById('cancelarDatos');
  if (cd) cd.onclick = () => ir('ficha', id);

  const gd = document.getElementById('guardarDatos');
  if (gd) gd.onclick = async () => {
    gd.disabled = true;
    const { error:e1 } = await SB.from('personas').update({
      nombre:   document.getElementById('dn').value.trim(),
      celular:  document.getElementById('dc').value.trim() || null,
      correo:   document.getElementById('dm').value.trim() || null,
      telefono: document.getElementById('df').value.trim() || null,
      fecha_nacimiento: document.getElementById('dnac').value || null,
      estado:   document.getElementById('de').value
    }).eq('id', id);
    if (e1){ avisar(e1.message, true); gd.disabled = false; return; }
    avisar('Datos actualizados.');
    ir('ficha', id);
  };

  const mc = document.getElementById('moverCuidado');
  if (mc) mc.onclick = async () => {
    const nuevo = document.getElementById('nuevoLider').value;
    const { data:actual } = await SB.from('coberturas').select('id').eq('persona_id', id).is('hasta', null).maybeSingle();
    const { error } = actual
      ? await SB.from('coberturas').update({ lider_id:nuevo, asignado_por:S.yo.persona_id }).eq('id', actual.id)
      : await SB.from('coberturas').insert({ persona_id:id, lider_id:nuevo, asignado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Cuidado reasignado.');
    ir('ficha', id);
  };

  const aa = document.getElementById('addArea');
  if (aa) aa.onclick = async () => {
    const { error } = await SB.from('persona_area').insert({
      persona_id:id, area_id:document.getElementById('nuevaArea').value });
    if (error) return avisar(error.message, true);
    avisar('Área agregada.');
    ir('ficha', id);
  };

  app.querySelectorAll('[data-quitararea]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('persona_area').delete().eq('id', b.dataset.quitararea);
    if (error) return avisar(error.message, true);
    avisar('Área quitada.');
    ir('ficha', id);
  });

  app.querySelectorAll('[data-subir]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('rangos').insert({
      persona_id:id, rango:b.dataset.subir, asignado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar(`Ahora es ${b.dataset.subir}.`);
    ir('ficha', id);
  });

  app.querySelectorAll('[data-bajarrango]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Deshacer el último rango?', 'Queda anotado en el historial.', false)) return;
    const { error } = await SB.from('rangos').delete().eq('id', b.dataset.bajarrango);
    if (error) return avisar(error.message, true);
    avisar('Rango deshecho.');
    ir('ficha', id);
  });

  app.querySelectorAll('[data-borrarnota]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar este registro?', 'Queda anotado en el historial de la persona.')) return;
    const { error } = await SB.from('contactos').delete().eq('id', b.dataset.borrarnota);
    if (error) return avisar(error.message, true);
    avisar('Registro eliminado.');
    ir('ficha', id);
  });
}

async function abrirReservada(contactoId, personaId){
  const motivo = await pedirTexto('Abrir una nota reservada', {
    texto: 'Queda registrado tu nombre y el motivo, y al autor le llega el aviso.',
    marcador: '¿Por qué necesitas leerla?' });
  if (!motivo) return;
  const { data, error } = await SB.rpc('abrir_reservada', { p_contacto:contactoId, p_motivo:motivo });
  if (error) return avisar(error.message, true);
  const n = (data && data[0]) || {};
  await mostrar(n.tema || 'Nota reservada', esc(n.resumen || 'Sin contenido.'));
  avisar('Nota abierta. Le queda el registro al autor.');
  ir('ficha', personaId);
}

/* ============================================================
   Registrar encuentro
   ============================================================ */
async function vRegistrar(arg){
  cargando();
  // Puede llegar con el objeto (desde la ficha) o solo con el id
  // (desde un enlace directo o el botón de atrás del navegador).
  const quien = typeof arg === 'string' ? { id:arg } : (arg || null);

  const { data:mios } = await SB.from('mi_gente').select('*').order('dias', { ascending:false });
  const gente = mios || [];
  const desdeFicha = !!(quien && quien.id);

  if (desdeFicha && !quien.nombre){
    const { data:p } = await SB.from('buscador').select('nombre').eq('id', quien.id).maybeSingle();
    quien.nombre = p?.nombre || '';
  }

  if (!gente.length && !desdeFicha){
    return app.innerHTML = cabeza('Cuidado', 'Tu espacio en el ministerio') +
      `<div class="vacio"><strong>Todavía no cuidas a nadie</strong>
        Cuando te asignen hombres, este va a ser el primer lugar al que llegues.</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn" data-ir="inicio">Ir al inicio</button>
        <button class="btn seco" data-ir="procesos">Ver mi proceso</button></div>`,
      app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
  }

  // A quién le toca: el que pidieron, o el que lleva más tiempo sin que se vean.
  const elegido = (desdeFicha && quien.id) || (gente[0] && gente[0].persona_id);
  const nombreDe = id => (gente.find(g => g.persona_id === id) || {}).nombre
                      || (desdeFicha ? quien.nombre : '');

  let tipo = 'reunion', medio = 'presencial';

  app.innerHTML =
    (desdeFicha ? `<button class="volver" id="atras">← Volver</button>` : '') +
    cabeza('Cuidado', 'Cuéntanos cómo te fue') + `
    <div class="tarjeta"><div class="tarjeta-cuerpo"><form id="f">
      <label for="aquien" style="margin-top:0">¿A quién cuidaste?</label>
      <select id="aquien">
        ${desdeFicha && !gente.some(g => g.persona_id === quien.id)
          ? `<option value="${quien.id}">${esc(quien.nombre)}</option>` : ''}
        ${gente.map(g => `<option value="${g.persona_id}"${g.persona_id === elegido ? ' selected' : ''}>
            ${esc(g.nombre)} · ${g.dias == null ? 'sin encuentros' : g.dias + ' días'}</option>`).join('')}
      </select>

      <div class="opciones" style="margin:16px 0 18px">
        <button type="button" class="opcion" data-tipo="reunion" aria-pressed="true">Nos vimos</button>
        <button type="button" class="opcion" data-tipo="intento" aria-pressed="false">Lo busqué</button>
      </div>
      <div class="par"><div>
        <label for="fecha">¿Cuándo?</label>
        <input id="fecha" type="date" value="${hoy()}" max="${hoy()}" required>
      </div><div>
        <label>¿Cómo?</label>
        <div class="chips" style="padding-top:2px">
          ${[['presencial','En persona'],['llamada','Llamada'],['videollamada','Videollamada'],['mensaje','Mensaje'],['otro','Otro']]
            .map(([v,t]) => `<button type="button" class="chip" data-medio="${v}" aria-pressed="${v==='presencial'}">${t}</button>`).join('')}
        </div>
      </div></div>
      <label for="tema">¿De qué hablaron?</label>
      <input id="tema" type="text" maxlength="120" placeholder="Su trabajo, la familia, cómo va con Dios…">
      <label for="resumen">Cómo lo viste</label>
      <textarea id="resumen" placeholder="Lo que valga la pena recordar la próxima vez que se vean."></textarea>
      <label class="casilla"><input type="checkbox" id="reservada">
        <div><b>Guardar como reservada</b></div></label>
      <div id="err"></div>
      <div style="margin-top:22px;display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn" type="submit" id="b">Guardar</button>
        <button class="btn seco" type="button" id="alInicio">Ir al inicio</button></div>
    </form></div></div>`;

  if (desdeFicha) document.getElementById('atras').onclick = () => ir('ficha', quien.id);
  document.getElementById('alInicio').onclick = () => ir('inicio');

  app.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => {
    tipo = b.dataset.tipo;
    app.querySelectorAll('[data-tipo]').forEach(o => o.setAttribute('aria-pressed', o === b));
  });
  app.querySelectorAll('[data-medio]').forEach(b => b.onclick = () => {
    medio = b.dataset.medio;
    app.querySelectorAll('[data-medio]').forEach(o => o.setAttribute('aria-pressed', o === b));
  });

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById('b');
    const aQuien = document.getElementById('aquien').value;
    if (!aQuien) return avisar('Elige a quién cuidaste.', true);
    b.disabled = true; b.textContent = 'Guardando…';
    const { error } = await SB.from('contactos').insert({
      persona_id: aQuien, lider_id: S.yo.persona_id,
      fecha: document.getElementById('fecha').value, tipo, medio,
      tema:    document.getElementById('tema').value.trim()    || null,
      resumen: document.getElementById('resumen').value.trim() || null,
      reservada: document.getElementById('reservada').checked
    });
    if (error){
      document.getElementById('err').innerHTML = `<div class="error">No se pudo guardar: ${esc(error.message)}</div>`;
      b.disabled = false; b.textContent = 'Guardar';
      return;
    }
    avisar(`${(nombreDe(aQuien) || '').split(' ')[0]}: ${tipo === 'reunion' ? 'encuentro' : 'intento'} guardado.`);
    // Desde la ficha se vuelve a la ficha; desde Cuidado se queda, para
    // poder registrar a varios seguidos sin dar vueltas.
    desdeFicha ? ir('ficha', quien.id) : ir('registrar');
  };
}

/* ============================================================
   Procesos
   ============================================================ */
const ESCALA = ['paje','escudero','caballero'];
const TIPOS_CURSO = { clase:'Clase', proceso:'Proceso' };

/* ============================================================
   Procesos — el catálogo
   ============================================================ */
async function vProcesos(){
  cargando();
  const yo = V();
  if (!S.qCurso) S.qCurso = { texto:'', tipo:'' };

  const [{ data:cursos, error }, { data:progs }, { data:pend }] = await Promise.all([
    SB.from('mi_curso').select('*').order('orden_programa').order('nombre'),
    SB.from('programas').select('*').eq('activo', true).order('orden'),
    SB.from('solicitudes_abiertas').select('id')
  ]);
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;

  const todos = (cursos || []).filter(c => c.activa);
  const programas = progs || [];
  const porRevisar = (pend || []).length;

  const calzaCurso = c => {
    const q = S.qCurso.texto;
    if (S.qCurso.tipo && c.tipo !== S.qCurso.tipo) return false;
    if (!q) return true;
    const N = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    return N([c.nombre, c.descripcion, c.programa].join(' ')).includes(N(q));
  };

  // Una tarjeta dice, de un vistazo, en qué va la persona.
  const tarjeta = c => {
    const pct = c.sesiones ? Math.round(c.sesiones_hechas * 100 / c.sesiones) : 0;
    const estado =
      c.mi_estado === 'completado'              ? ['m-cuidado','terminado']
      : c.inscrito                              ? ['m-alerta', `${c.sesiones_hechas} de ${c.sesiones}`]
      : c.mi_solicitud === 'pendiente'          ? ['m-alerta', 'acceso pedido']
      : c.acceso === 'abierto'                  ? ['m-cuidado','abierto']
                                                : ['m-desconectado','hay que pedir acceso'];
    return `<a class="ccard" href="#/curso/${c.id}" data-curso="${c.id}">
      <span class="ccard-img" ${c.imagen ? `style="background-image:url('${esc(c.imagen)}')"` : ''}>
        ${c.imagen ? '' : `<span class="ccard-sin">${I.procesos}</span>`}
      </span>
      <span class="ccard-cuerpo">
        <span class="ccard-alto">
          <span class="ccard-nom">${esc(c.nombre)}</span>
          <span class="marca-est ${estado[0]}">${estado[1]}</span>
        </span>
        ${c.descripcion ? `<span class="ccard-desc">${esc(c.descripcion)}</span>` : ''}
        <span class="ccard-pie">
          <span>${c.sesiones} ${c.sesiones === 1 ? 'clase' : 'clases'}</span>
          ${c.duracion ? `<span>· ${esc(c.duracion)}</span>` : ''}
          ${c.da_certificado ? `<span>· con certificado</span>` : ''}
        </span>
        ${c.inscrito ? `<span class="barra-prog"><i style="width:${pct}%"></i></span>` : ''}
      </span></a>`;
  };

  let html = cabeza('Escuela', 'Las clases y los procesos del ministerio',
    (yo.es_admin ? `<button class="btn" id="nuevo">Crear curso</button>` : '') +
    (porRevisar ? `<button class="btn seco" id="aSolicitudes">Solicitudes (${porRevisar})</button>` : '') +
    `<button class="btn seco" id="aMisCursos">Lo mío</button>`) + `

    <div class="buscador">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
      <input id="qc" type="text" autocomplete="off" placeholder="Buscar un curso…" value="${esc(S.qCurso.texto)}">
    </div>

    <div class="chips" style="margin-bottom:18px">
      ${[['','Todos'],['clase','Clases'],['proceso','Procesos']].map(([v,t]) =>
        `<button class="chip" data-tc="${v}" aria-pressed="${S.qCurso.tipo === v}">${t}</button>`).join('')}
    </div>
    <div id="catalogo"></div>`;

  app.innerHTML = html;

  const pintar = () => {
    const vistos = todos.filter(calzaCurso);
    let h = '';

    // Primero los programas, en su orden, porque ahí está el camino.
    programas.forEach(g => {
      const suyos = vistos.filter(c => c.programa_id === g.id);
      if (!suyos.length) return;
      const hechos = suyos.filter(c => c.mi_estado === 'completado').length;
      h += `<div class="tarjeta"><div class="tarjeta-alto">
          <h2>${esc(g.nombre)}</h2>
          <span class="sello">${hechos} de ${suyos.length}</span></div>
        <div class="tarjeta-cuerpo">
          ${g.descripcion ? `<p class="prog-desc">${esc(g.descripcion)}</p>` : ''}
          ${g.un_curso_a_la_vez || g.sesiones_por_dia ? `<p class="prog-ritmo">${
            [g.un_curso_a_la_vez ? 'Un curso a la vez' : '',
             g.sesiones_por_dia ? `${g.sesiones_por_dia} ${g.sesiones_por_dia === 1 ? 'clase' : 'clases'} por día` : '']
              .filter(Boolean).join(' · ')}</p>` : ''}
          <div class="ccards">${suyos.map(tarjeta).join('')}</div>
        </div></div>`;
    });

    const sueltos = vistos.filter(c => !c.programa_id);
    if (sueltos.length){
      h += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Otros cursos</h2>
          <span class="sello">${sueltos.length}</span></div>
        <div class="tarjeta-cuerpo"><div class="ccards">${sueltos.map(tarjeta).join('')}</div></div></div>`;
    }

    document.getElementById('catalogo').innerHTML = h ||
      `<div class="vacio"><strong>No hay cursos que coincidan</strong>
        Prueba con otra palabra o quita el filtro.</div>`;

    document.querySelectorAll('[data-curso]').forEach(b =>
      b.onclick = () => ir('curso', b.dataset.curso));
  };

  const caja = document.getElementById('qc');
  caja.oninput = e => { S.qCurso.texto = e.target.value; pintar(); };
  app.querySelectorAll('[data-tc]').forEach(b => b.onclick = () => {
    S.qCurso.tipo = b.dataset.tc;
    app.querySelectorAll('[data-tc]').forEach(o => o.setAttribute('aria-pressed', o === b));
    pintar();
  });

  const bn = document.getElementById('nuevo');
  if (bn) bn.onclick = () => crearCurso();
  const bsol = document.getElementById('aSolicitudes');
  if (bsol) bsol.onclick = () => ir('solicitudes');
  document.getElementById('aMisCursos').onclick = () => ir('yo');

  pintar();
}


/* ============================================================
   La escuela — el curso, como lo ve quien lo estudia
   ============================================================ */
async function vCursoAlumno(arg){
  cargando();
  const id = typeof arg === 'string' ? arg : arg.id;
  const yo = V();

  const [{ data:c }, { data:ses }, { data:cert }] = await Promise.all([
    SB.from('mi_curso').select('*').eq('id', id).maybeSingle(),
    SB.from('mis_sesiones').select('*').eq('ruta_id', id).order('orden'),
    SB.from('certificados').select('*').eq('ruta_id', id).maybeSingle()
  ]);
  if (!c) return app.innerHTML = `<div class="error">No se encontró ese curso.</div>`;

  const sesiones = ses || [];
  const hechas = sesiones.filter(x => x.hecha).length;
  const pct = sesiones.length ? Math.round(hechas * 100 / sesiones.length) : 0;
  const faltan = sesiones.length - hechas;
  const puedeDictar = yo.es_admin || yo.ve_todo;

  // La primera sin hacer es por donde sigue.
  const siguiente = sesiones.find(x => !x.hecha);
  const tope = c.sesiones_por_dia;
  const frenado = tope != null && c.hechas_hoy >= tope;

  let html = `<button class="volver" id="atras">← Volver a la escuela</button>
    <div class="portada" ${c.imagen ? `style="background-image:url('${esc(c.imagen)}')"` : ''}></div>` +
    cabeza(esc(c.nombre), c.programa ? esc(c.programa) : '',
      puedeDictar ? `<button class="btn seco" id="administrar">Administrar</button>` : '');

  if (c.descripcion)
    html += `<div class="tarjeta"><div class="tarjeta-cuerpo">
      <p style="margin:0;font-size:15.5px;line-height:1.6">${esc(c.descripcion)}</p></div></div>`;

  // ---------- no está dentro todavía ----------
  if (!c.inscrito){
    html += `<div class="tarjeta"><div class="tarjeta-cuerpo" style="text-align:center;padding:30px 22px">
      ${c.mi_solicitud === 'pendiente'
        ? `<p class="remate-texto">Ya pediste acceso. Quien dicta el curso lo va a revisar.</p>
           <button class="btn seco" id="retirar">Retirar la solicitud</button>`
        : c.mi_solicitud === 'negada'
        ? `<p class="remate-texto">Esta vez no te dieron acceso. Puedes volver a pedirlo.</p>
           <button class="btn" id="pedir">Pedir acceso otra vez</button>`
        : c.acceso === 'abierto'
        ? `<p class="remate-texto">Este curso lo puedes empezar cuando quieras.</p>
           <button class="btn" id="entrar">Empezar el curso</button>`
        : `<p class="remate-texto">Para entrar a este curso alguien tiene que darte acceso.</p>
           <button class="btn" id="pedir">Pedir acceso</button>`}
    </div></div>`;
  } else {
    // ---------- su avance ----------
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Tu avance</h2>
        <span class="sello">${hechas} de ${sesiones.length}</span></div>
      <div class="tarjeta-cuerpo">
        <div class="barra-prog" style="margin:0 0 14px"><i style="width:${pct}%"></i></div>
        ${frenado ? `<p class="prog-ritmo">Por hoy ya hiciste ${c.hechas_hoy} ${
            c.hechas_hoy === 1 ? 'clase' : 'clases'}. Este proceso se hace con calma: sigue mañana.</p>` : ''}
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          ${siguiente ? `<button class="btn" id="seguir">${
            hechas ? 'Seguir en' : 'Empezar por'} ${esc(siguiente.nombre)}</button>` : ''}
          ${!faltan && c.preguntas > 0 && !c.paso_el_quiz
            ? `<button class="btn" id="alQuiz">Presentar el quiz</button>` : ''}
          ${c.paso_el_quiz ? `<span class="marca-est m-cuidado">quiz aprobado · ${c.mejor_pct}%</span>` : ''}
        </div>
      </div></div>`;

    // ---------- las clases ----------
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Las clases</h2></div>
      <div class="tarjeta-cuerpo" style="padding-top:4px"><ul class="registro">
      ${sesiones.map((x, n) => `<li><a class="fila" href="#/clase/${x.id}" data-clase="${x.id}">
        <span class="fila-alto">
          <span class="clase-num ${x.hecha ? 'hecha' : ''}">${x.hecha ? '✓' : n + 1}</span>
          <span class="nombre">${esc(x.nombre)}</span>
          ${x.video_id ? '' : `<span class="marca-est m-alerta">sin video</span>`}
        </span>
        <span class="sub">
          ${x.video_segs ? `<span>${Math.round(x.video_segs / 60)} min</span>` : ''}
          ${x.material_url ? `<span>· con material</span>` : ''}
          ${x.pct && !x.hecha ? `<span>· vas en ${x.pct}%</span>` : ''}
        </span>
        ${x.pct && !x.hecha ? `<span class="barra-prog"><i style="width:${x.pct}%"></i></span>` : ''}
      </a></li>`).join('')}
      </ul></div></div>`;

    if (c.preguntas > 0)
      html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>El quiz</h2>
          <span class="sello">${c.preguntas} ${c.preguntas === 1 ? 'pregunta' : 'preguntas'}</span></div>
        <div class="tarjeta-cuerpo">
          <p class="prog-desc">Se pasa con ${c.nota_minima}%. Llevas ${c.intentos_usados} de ${
            c.intentos_quiz} intentos${c.mejor_pct != null ? ` · tu mejor nota: ${c.mejor_pct}%` : ''}.</p>
          ${faltan
            ? `<p class="prog-ritmo">Te ${faltan === 1 ? 'falta 1 clase' : `faltan ${faltan} clases`} antes del quiz.</p>`
            : c.paso_el_quiz
            ? `<span class="marca-est m-cuidado">aprobado</span>`
            : c.intentos_usados >= c.intentos_quiz
            ? `<p class="prog-ritmo">Se acabaron los intentos. Habla con quien dicta el curso.</p>`
            : `<button class="btn" id="alQuiz2">Presentar el quiz</button>`}
        </div></div>`;

    if (cert)
      html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Tu certificado</h2>
          <span class="sello">${esc(cert.codigo)}</span></div>
        <div class="tarjeta-cuerpo"><button class="btn" id="verCert">Verlo</button></div></div>`;
  }

  app.innerHTML = html + '<div style="height:28px"></div>';

  document.getElementById('atras').onclick = () => ir('procesos');
  const ba = document.getElementById('administrar');
  if (ba) ba.onclick = () => ir('cursoAdmin', id);

  const bs = document.getElementById('seguir');
  if (bs) bs.onclick = () => ir('clase', siguiente.id);
  app.querySelectorAll('[data-clase]').forEach(b =>
    b.onclick = () => ir('clase', b.dataset.clase));

  ['alQuiz','alQuiz2'].forEach(x => {
    const b = document.getElementById(x);
    if (b) b.onclick = () => ir('quiz', id);
  });

  const bc = document.getElementById('verCert');
  if (bc) bc.onclick = () => ir('certificado', cert.id);

  const be = document.getElementById('entrar');
  if (be) be.onclick = async () => {
    const { error } = await SB.rpc('entrar_a_curso', { p_ruta:id });
    if (error) return mostrar('No se pudo', error.message);
    avisar('Ya estás dentro.');
    ir('curso', id);
  };

  const bp = document.getElementById('pedir');
  if (bp) bp.onclick = async () => {
    const motivo = await pedirTexto('¿Por qué quieres entrar?', {
      texto:'Esto lo lee quien dicta el curso.', marcador:'Me quiero poner al día…' });
    if (motivo === null) return;
    const { error } = await SB.from('solicitudes').insert({
      ruta_id:id, persona_id:S.yo.persona_id, motivo:motivo || null });
    if (error) return mostrar('No se pudo', error.message);
    avisar('Solicitud enviada.');
    ir('curso', id);
  };

  const br = document.getElementById('retirar');
  if (br) br.onclick = async () => {
    if (!await confirmar('¿Retirar la solicitud?', 'Puedes volver a pedirla después.')) return;
    const { error } = await SB.from('solicitudes').delete()
      .eq('ruta_id', id).eq('persona_id', S.yo.persona_id).eq('estado','pendiente');
    if (error) return mostrar('No se pudo', error.message);
    ir('curso', id);
  };
}

  function candidatos(){
    const q = normaliza(V_('qa'));
    const fArea = V_('aArea'), fAreaNo = V_('aAreaNo'), fRan = V_('aRan'), fRanNo = V_('aRanNo');
    const fCur = V_('aCur'), fCurNo = V_('aCurNo'), fSit = V_('aSit'), fEst = V_('aEst');
    return (todos || []).filter(g => {
      if (yaDentro.has(g.id)) return false;
      const areas = String(g.areas || ''), cursos = String(g.cursos || '');
      if (fArea === '__sin' ? areas : fArea && !areas.includes(fArea)) return false;
      if (fAreaNo && areas.includes(fAreaNo)) return false;
      if (fRan === '__sin' ? g.rango : fRan && g.rango !== fRan) return false;
      if (fRanNo && g.rango === fRanNo) return false;
      if (fCur && !cursos.includes(fCur)) return false;
      if (fCurNo && cursos.includes(fCurNo)) return false;
      if (fSit && g.situacion !== fSit) return false;
      if (fEst && g.estado !== fEst) return false;
      if (q){
        const t = normaliza([g.nombre, g.areas, g.rango, g.correo].join(' '));
        if (!q.split(/\s+/).filter(Boolean).every(x => t.includes(x))) return false;
      }
      return true;
    });
  }

  function pintarCand(){
    const lista = candidatos();
    document.getElementById('candidatos').innerHTML = lista.length ? lista.map(g => `
      <label class="asignar-fila"><input type="checkbox" data-sel="${g.id}" ${sel.has(g.id) ? 'checked' : ''}>
        <b>${esc(g.nombre)}</b>
        <span>${esc(mayus(g.rango) || 'Sin rango')}${g.areas ? ' · ' + esc(String(g.areas).split(' · ')[0]) : ''}</span>
      </label>`).join('')
      : `<p style="margin:10px;color:var(--suave);font-size:14px">Nadie coincide con esos filtros.</p>`;
    document.querySelectorAll('[data-sel]').forEach(ch => ch.onchange = () => {
      ch.checked ? sel.add(ch.dataset.sel) : sel.delete(ch.dataset.sel);
      contar();
    });
    contar();
  }

  function contar(){
    const n = sel.size, v = candidatos().length;
    document.getElementById('contSel').textContent =
      `${n} ${n === 1 ? 'marcado' : 'marcados'} · ${v} a la vista`;
  }

  document.getElementById('qa').oninput = pintarCand;
  app.querySelectorAll('[data-af]').forEach(el => el.onchange = pintarCand);

  document.getElementById('marcarTodos').onclick = () => {
    candidatos().forEach(g => sel.add(g.id)); pintarCand();
  };
  document.getElementById('desmarcarTodos').onclick = () => { sel.clear(); pintarCand(); };

  document.getElementById('confirmarAsig').onclick = async () => {
    if (!sel.size) return avisar('No has marcado a nadie.', true);
    let limite = null;
    if (!c.plazo_estricto){
      const f = V_('aFecha'), d = parseInt(V_('aDias'), 10);
      if (f) limite = f;
      else if (Number.isFinite(d) && d > 0){
        const x = new Date(hoy() + 'T12:00:00');
        x.setDate(x.getDate() + d);
        limite = x.toLocaleDateString('en-CA');
      }
    }
    const filas = [...sel].map(pid => ({
      ruta_id:id, persona_id:pid, asignado_por:S.yo.persona_id,
      estado:'inscrito', fecha_limite:limite }));
    const { error } = await SB.from('inscripciones').upsert(filas, { onConflict:'ruta_id,persona_id' });
    if (error) return avisar(error.message, true);
    avisar(`${sel.size} ${sel.size === 1 ? 'persona asignada' : 'personas asignadas'}.`);
    ir('curso', id);
  };

  /* ---------- inscritos: terminar y quitar ---------- */
  app.querySelectorAll('[data-term]').forEach(b => b.onclick = async () => {
    const { error } = await SB.from('inscripciones')
      .update({ estado:'completado', fecha_fin:hoy() }).eq('id', b.dataset.term);
    if (error) return avisar(error.message, true);
    avisar('Marcado como terminado.');
    ir('curso', id);
  });
  app.querySelectorAll('[data-quitarins]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Quitar del curso?', `${b.dataset.nomq} sale del curso. Los pasos que haya marcado se quedan.`)) return;
    const { error } = await SB.from('inscripciones').delete().eq('id', b.dataset.quitarins);
    if (error) return avisar(error.message, true);
    avisar('Quitado del curso.');
    ir('curso', id);
  });

  /* ---------- sesiones ---------- */
  const as = document.getElementById('addSesion');
  if (as) as.onclick = async () => {
    const nombre = document.getElementById('sn').value.trim();
    if (!nombre) return avisar('Ponle nombre a la sesión.', true);
    const min = parseInt(document.getElementById('smin').value, 10);
    const { error } = await SB.from('pasos').insert({
      ruta_id:id, nombre,
      descripcion: document.getElementById('sd').value.trim() || null,
      // El trigger de la base extrae el id de YouTube del enlace, sea
      // cual sea la forma en que lo peguen.
      video_id:    document.getElementById('sv').value.trim()   || null,
      video_segs:  Number.isFinite(min) && min > 0 ? min * 60 : null,
      material_url:    document.getElementById('smat').value.trim()  || null,
      material_nombre: document.getElementById('smatn').value.trim() || null,
      orden: (sesiones || []).length + 1 });
    if (error) return avisar(error.message, true);
    avisar('Clase agregada.');
    ir('cursoAdmin', id);
  };

  /* ---------- editar una clase ---------- */
  app.querySelectorAll('[data-es]').forEach(b => b.onclick = async () => {
    const x = (sesiones || []).find(y => y.id === b.dataset.es);
    if (!x) return;
    const r = await dialogo({
      titulo:'Editar la clase', ancho:true, aceptar:'Guardar',
      cuerpo:`
        <label style="margin-top:0" for="en">Nombre</label>
        <input id="en" type="text" value="${esc(x.nombre)}">
        <label for="ed">De qué se trata</label>
        <input id="ed" type="text" value="${esc(x.descripcion || '')}">
        <div class="par">
          <div><label for="ev">Video de YouTube</label>
            <input id="ev" type="text" value="${esc(x.video_id || '')}"></div>
          <div><label for="emin">Duración en minutos</label>
            <input id="emin" type="text" inputmode="numeric" value="${x.video_segs ? Math.round(x.video_segs/60) : ''}"></div>
        </div>
        <div class="par">
          <div><label for="emat">Enlace al material</label>
            <input id="emat" type="text" value="${esc(x.material_url || '')}"></div>
          <div><label for="ematn">Cómo se llama</label>
            <input id="ematn" type="text" value="${esc(x.material_nombre || '')}"></div>
        </div>
        <div class="par">
          <div><label for="epct">% que hay que ver</label>
            <input id="epct" type="text" inputmode="numeric" value="${x.minimo_pct}"></div>
        </div>
        <label for="etexto">Texto de la clase (opcional)</label>
        <textarea id="etexto">${esc(x.texto || '')}</textarea>`,
      alMontar: () => () => {
        const v = i => (document.getElementById(i)?.value || '').trim();
        const min = parseInt(v('emin'), 10), pct = parseInt(v('epct'), 10);
        if (!v('en')) return undefined;
        return { nombre:v('en'), descripcion:v('ed') || null,
                 video_id:v('ev') || null,
                 video_segs: Number.isFinite(min) && min > 0 ? min * 60 : null,
                 material_url:v('emat') || null, material_nombre:v('ematn') || null,
                 minimo_pct: Number.isFinite(pct) ? Math.min(100, Math.max(0, pct)) : 90,
                 texto:v('etexto') || null };
      }
    });
    if (!r) return;
    const { error } = await SB.from('pasos').update(r).eq('id', x.id);
    if (error) return mostrar('No se pudo', error.message);
    avisar('Clase actualizada.');
    ir('cursoAdmin', id);
  });
  app.querySelectorAll('[data-bs]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar esta sesión?', 'Se van los avances que tenga marcados.')) return;
    const { error } = await SB.from('pasos').delete().eq('id', b.dataset.bs);
    if (error) return avisar(error.message, true);
    avisar('Sesión eliminada.');
    ir('curso', id);
  });

  /* ---------- editar ---------- */
  const ec = document.getElementById('editarC');
  if (ec) ec.onclick = () => {
    const f = document.getElementById('formEd');
    f.hidden = !f.hidden; ec.textContent = f.hidden ? 'Editar' : 'Cerrar';
  };

  const si = document.getElementById('subirImg');
  if (si) si.onclick = async () => {
    const f = document.getElementById('efile').files[0];
    if (!f) return avisar('Elige primero una imagen.', true);
    si.disabled = true; si.textContent = 'Subiendo…';
    const ruta = `${id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
    const { error } = await SB.storage.from('cursos').upload(ruta, f, { upsert:true });
    if (error){
      avisar('No se pudo subir: ' + error.message + '. Puedes pegar una dirección de imagen en el campo de arriba.', true);
      si.disabled = false; si.textContent = 'Subir imagen';
      return;
    }
    const { data } = SB.storage.from('cursos').getPublicUrl(ruta);
    document.getElementById('eimg').value = data.publicUrl;
    si.disabled = false; si.textContent = 'Subir imagen';
    avisar('Imagen lista. Dale a Guardar cambios.');
  };

  const ge = document.getElementById('guardarEd');
  if (ge) ge.onclick = async () => {
    ge.disabled = true;
    const { error } = await SB.from('rutas').update({
      nombre:      document.getElementById('en2').value.trim(),
      tipo:        document.getElementById('et2').value,
      descripcion: document.getElementById('ed2').value.trim()   || null,
      duracion:    document.getElementById('edur2').value.trim() || null,
      responsable: document.getElementById('eresp2').value       || null,
      imagen:      document.getElementById('eimg').value.trim()  || null,
      auto_marca:  document.getElementById('eq2').value === 'true',
      activa:      document.getElementById('eact').value === 'true',
      dias_plazo:  parseInt(document.getElementById('eplazo').value, 10) || null,
      plazo_estricto: document.getElementById('eestr').value === 'true'
    }).eq('id', id);
    if (error){ avisar(error.message, true); ge.disabled = false; return; }
    avisar('Curso actualizado.');
    ir('curso', id);
  };

  const bc = document.getElementById('borrarCurso');
  if (bc) bc.onclick = async () => {
    if (!await confirmar('¿Eliminar este curso?', `«${c.nombre}» se va con sus sesiones, sus inscritos y los avances de todos.`)) return;
    const { error } = await SB.from('rutas').delete().eq('id', id);
    if (error) return avisar(error.message, true);
    avisar('Curso eliminado.');
    ir('procesos');
  };
}

async function marcarPaso(personaId, pasoId, estado, ruta, primero, volverA){
  const { data:ya } = await SB.from('avances').select('id,estado')
    .eq('persona_id', personaId).eq('paso_id', pasoId).maybeSingle();

  let error, quitado = false;
  if (ya && ya.estado === estado){
    ({ error } = await SB.from('avances').delete().eq('id', ya.id));
    quitado = true;
  } else if (ya){
    ({ error } = await SB.from('avances')
      .update({ estado, fecha:hoy(), registrado_por:S.yo.persona_id, actualizado_en:new Date().toISOString() })
      .eq('id', ya.id));
  } else {
    ({ error } = await SB.from('avances').insert({
      persona_id:personaId, paso_id:pasoId, estado, registrado_por:S.yo.persona_id }));
  }
  if (error) return avisar(error.message, true);

  const esEncuentro = !quitado && estado === 'completado' && ruta && !ruta.auto_marca
                      && personaId !== S.yo.persona_id && S.contarEncuentro !== false;

  if (esEncuentro){
    const { data:paso } = await SB.from('pasos').select('nombre').eq('id', pasoId).maybeSingle();
    const { error:e2 } = await SB.from('contactos').insert({
      persona_id:personaId, lider_id:S.yo.persona_id, fecha:hoy(),
      tipo:'reunion', medio:'otro',
      tema:`${ruta.nombre}: ${paso?.nombre || 'un paso'}`,
      resumen:'Registrado al marcar el paso como completado.' });
    avisar(e2 ? 'Paso marcado, pero el encuentro no se guardó: ' + e2.message
              : `Paso marcado y encuentro guardado con ${primero}.`, !!e2);
  } else {
    avisar(quitado ? 'Marca quitada.' : 'Paso marcado.');
  }
  volverA === 'ficha' ? ir('ficha', personaId) : ir('procesos');
}

      </div>

      </div>
      <div class="par">
        <div><label for="cint">Intentos del quiz</label>
          <input id="cint" type="text" inputmode="numeric" value="3"></div>
        <div><label for="cdia">Clases por día (vacío = sin tope)</label>
          <input id="cdia" type="text" inputmode="numeric" placeholder=""></div>
      </div>
      <label class="casilla"><input type="checkbox" id="ccert"><div><b>Da certificado al terminar</b></div></label>`,
    alMontar: () => () => {
      const v = i => (document.getElementById(i)?.value || '').trim();
      if (!v('cn')) return undefined;
      const n = x => { const k = parseInt(v(x), 10); return Number.isFinite(k) ? k : null; };
      return { nombre:v('cn'), descripcion:v('cd') || null, tipo:v('ct'),
               programa_id:v('cp') || null, acceso:v('ca'),
               nota_minima: Math.min(100, Math.max(0, n('cnota') ?? 70)),
               intentos_quiz: Math.max(1, n('cint') ?? 3),
               sesiones_por_dia: n('cdia'),
               da_certificado: document.getElementById('ccert').checked,
               activa:true };
    }
  });
  if (!r) return;

  const { data, error } = await SB.from('rutas').insert(r).select('id').single();
  if (error) return mostrar('No se pudo crear', error.message);
  avisar('Curso creado.');
  ir('cursoAdmin', data.id);
}

   La escuela — quién está pidiendo entrar
   ============================================================ */
async function vSolicitudes(){
  cargando();
  const { data:sol, error } = await SB.from('solicitudes_abiertas').select('*').order('pedida_en');
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;
  const lista = sol || [];

  app.innerHTML = `<button class="volver" id="atras">← Volver a la escuela</button>` +
    cabeza('Solicitudes', 'Quién está pidiendo entrar a un curso') +
    (lista.length
      ? `<div class="tarjeta"><div class="tarjeta-cuerpo" style="padding-top:4px"><ul class="registro">
          ${lista.map(x => `<li><div class="fila" style="cursor:default">
            <span class="fila-alto">
              <span class="nombre">${esc(x.alumno)}</span>
              <span class="marca-est m-alerta">${esc(x.curso)}</span>
            </span>
            <span class="sub">
              ${x.programa ? `<span>${esc(x.programa)}</span>` : ''}
              ${x.rango ? `<span class="sello">${esc(mayus(x.rango))}</span>` : ''}
              <span>· pidió el ${fechaCorta(String(x.pedida_en).slice(0,10))}</span>
            </span>
            ${x.motivo ? `<span class="sub"><span style="font-style:italic">«${esc(x.motivo)}»</span></span>` : ''}
            <span style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
              <button class="btn chico" data-si="${x.id}" data-nom="${esc(x.alumno)}" data-curso="${esc(x.curso)}">Darle acceso</button>
              <button class="btn seco chico" data-no="${x.id}" data-nom="${esc(x.alumno)}">No por ahora</button>
            </span></div></li>`).join('')}
        </ul></div></div>`
      : `<div class="vacio"><strong>No hay solicitudes pendientes</strong>
          Cuando alguien pida entrar a un curso tuyo, aparece aquí.</div>`);

  document.getElementById('atras').onclick = () => ir('procesos');

  const resolver = async (id, aprobar, respuesta) => {
    const { error } = await SB.rpc('resolver_solicitud',
      { p_solicitud:id, p_aprobar:aprobar, p_respuesta:respuesta || null });
    if (error) return mostrar('No se pudo', error.message);
    avisar(aprobar ? 'Ya puede entrar.' : 'Solicitud cerrada.');
    ir('solicitudes');
  };

  app.querySelectorAll('[data-si]').forEach(b => b.onclick = async () => {
    if (!await confirmar(`¿Darle acceso a ${b.dataset.nom}?`,
      `Queda inscrito en ${b.dataset.curso} y puede empezar las clases.`, false)) return;
    resolver(b.dataset.si, true, null);
  });

  app.querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
    const motivo = await pedirTexto(`No por ahora`, {
      texto:`${b.dataset.nom} va a ver lo que escribas aquí.`,
      marcador:'Primero termina el curso anterior…' });
    if (motivo === null) return;
    resolver(b.dataset.no, false, motivo);
  });
}


/* ============================================================
   La escuela — armar el quiz
   ============================================================ */
async function vQuizEditor(arg){
  cargando();
  const id = typeof arg === 'string' ? arg : arg.id;

  const [{ data:c }, { data:preg }, { data:ops }, { data:ses }] = await Promise.all([
    SB.from('cursos').select('*').eq('id', id).maybeSingle(),
    SB.from('preguntas').select('*').eq('ruta_id', id).order('orden'),
    SB.from('opciones_completas').select('*').order('orden'),
    SB.from('pasos').select('id,nombre,orden').eq('ruta_id', id).order('orden')
  ]);
  if (!c) return app.innerHTML = `<div class="error">No se encontró ese curso.</div>`;

  const preguntas = preg || [];
  const deLa = q => (ops || []).filter(o => o.pregunta_id === q);

  app.innerHTML = `<button class="volver" id="atras">← ${esc(c.nombre)}</button>` +
    cabeza('El quiz de ' + esc(c.nombre),
      `${preguntas.length} ${preguntas.length === 1 ? 'pregunta' : 'preguntas'} · se pasa con ${c.nota_minima}%`,
      `<button class="btn" id="nuevaP">Agregar pregunta</button>`) +

    (preguntas.length
      ? preguntas.map((q, n) => `
        <div class="tarjeta"><div class="tarjeta-cuerpo">
          <div class="fila-alto" style="margin-bottom:8px">
            <span class="num-preg" style="flex:1">Pregunta ${n + 1} · ${
              q.tipo === 'abierta' ? 'la lee un maestro'
              : q.tipo === 'multiple' ? 'varias correctas' : 'una correcta'} · ${q.puntos} ${
              q.puntos === 1 ? 'punto' : 'puntos'}</span>
            <button class="btn rojo chico" data-bq="${q.id}">✕</button>
          </div>
          <p class="enunciado">${esc(q.enunciado)}</p>
          ${q.tipo === 'abierta' ? '' : `<ul class="registro" style="margin-top:8px">
            ${deLa(q.id).map(o => `<li class="op-lista ${o.correcta ? 'buena' : ''}">
              <span>${o.correcta ? '✓' : '·'}</span><span>${esc(o.texto)}</span></li>`).join('')}
          </ul>`}
        </div></div>`).join('')
      : `<div class="vacio"><strong>Este curso todavía no tiene quiz</strong>
          Sin preguntas, el curso se da por terminado al ver todas las clases.</div>`) +
    '<div style="height:28px"></div>';

  document.getElementById('atras').onclick = () => ir('cursoAdmin', id);

  app.querySelectorAll('[data-bq]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar esta pregunta?',
      'Se va con sus opciones. Las respuestas ya dadas se quedan.')) return;
    const { error } = await SB.from('preguntas').delete().eq('id', b.dataset.bq);
    if (error) return mostrar('No se pudo', error.message);
    ir('quizEditor', id);
  });

  document.getElementById('nuevaP').onclick = async () => {
    const r = await dialogo({
      titulo:'Nueva pregunta', ancho:true, aceptar:'Agregar',
      cuerpo:`
        <label style="margin-top:0" for="pe">La pregunta</label>
        <textarea id="pe" placeholder="¿Qué significa Kairós?"></textarea>
        <div class="par">
          <div><label for="pt">Tipo</label>
            <select id="pt">
              <option value="opcion">Una sola correcta</option>
              <option value="multiple">Varias correctas</option>
              <option value="abierta">Abierta, la lee un maestro</option>
            </select></div>
          <div><label for="pp">Puntos</label>
            <input id="pp" type="text" inputmode="numeric" value="1"></div>
        </div>
        <div id="zonaOps">
          <label for="po">Las opciones, una por renglón</label>
          <textarea id="po" placeholder="Tiempo medido&#10;Tiempo oportuno&#10;Tiempo perdido"></textarea>
          <label for="pc">¿Cuáles son correctas? (los números, separados por coma)</label>
          <input id="pc" type="text" inputmode="numeric" placeholder="2">
        </div>`,
      alMontar: velo => {
        const tipo = velo.querySelector('#pt');
        const zona = velo.querySelector('#zonaOps');
        tipo.onchange = () => { zona.hidden = tipo.value === 'abierta'; };
        return () => {
          const v = i => (velo.querySelector('#' + i)?.value || '').trim();
          if (!v('pe')) return undefined;
          const puntos = parseInt(v('pp'), 10);
          const res = { enunciado:v('pe'), tipo:v('pt'),
                        puntos: Number.isFinite(puntos) && puntos > 0 ? puntos : 1 };
          if (res.tipo !== 'abierta'){
            res.opciones = v('po').split('\n').map(x => x.trim()).filter(Boolean);
            if (res.opciones.length < 2) return undefined;
            const buenas = new Set(v('pc').split(/[,\s]+/).map(x => parseInt(x,10)).filter(Number.isFinite));
            if (!buenas.size) return undefined;
            res.buenas = buenas;
          }
          return res;
        };
      }
    });
    if (!r) return;

    const { data:nueva, error } = await SB.from('preguntas').insert({
      ruta_id:id, enunciado:r.enunciado, tipo:r.tipo, puntos:r.puntos,
      orden: preguntas.length + 1 }).select('id').single();
    if (error) return mostrar('No se pudo', error.message);

    if (r.opciones){
      const filas = r.opciones.map((t, n) => ({
        pregunta_id:nueva.id, texto:t, correcta:r.buenas.has(n + 1), orden:n + 1 }));
      const { error:e2 } = await SB.from('opciones').insert(filas);
      if (e2) return mostrar('La pregunta quedó, pero sin opciones', e2.message);
    }
    avisar('Pregunta agregada.');
    ir('quizEditor', id);
  };
}

          Cuando alguien entregue una actividad de un curso tuyo, aparece aquí.</div>`);

  document.getElementById('atras').onclick = () => ir('procesos');

  app.querySelectorAll('[data-cal]').forEach(b => b.onclick = async () => {
    const max = Number(b.dataset.max);
    const r = await dialogo({
      titulo:`Calificar a ${b.dataset.nom}`, aceptar:'Guardar la nota',
      cuerpo:`
        <label style="margin-top:0" for="gn">Nota sobre ${max}</label>

      alMontar: velo => () => {

        return { nota:n, comentario:(velo.querySelector('#gc')?.value || '').trim() || null };
      }

    if (!r) return;
    const { error } = await SB.from('entregas').update({
      nota:r.nota, comentario:r.comentario, estado:'revisada',
      calificado_por:S.yo.persona_id, calificado_en:new Date().toISOString()
    }).eq('id', b.dataset.cal);
    if (error) return mostrar('No se pudo', error.message);
    avisar('Nota guardada.');
    ir('revisar');
  });
}


/* ============================================================
   La escuela — ver una clase
   ------------------------------------------------------------
   El video va embebido con la API de YouTube. La pagina no se cree
   lo que diga el alumno: cuenta los segundos que de verdad corrieron
   (si salta adelante, ese salto no suma) y manda el conteo a la base
   cada tanto. Quien decide si la clase quedo vista es la base.
   ============================================================ */
let ytListo = null;
function cargarYT(){
  if (ytListo) return ytListo;
  ytListo = new Promise(resolver => {
    if (window.YT && window.YT.Player) return resolver(window.YT);
    const t = document.createElement('script');
    t.src = 'https://www.youtube.com/iframe_api';
    window.onYouTubeIframeAPIReady = () => resolver(window.YT);
    document.head.appendChild(t);
    // Si YouTube no carga (sin internet, bloqueado), no dejamos la
    // pantalla colgada esperando.
    setTimeout(() => resolver(null), 9000);
  });
  return ytListo;
}

async function vClase(arg){
  cargando();
  const pasoId = typeof arg === 'string' ? arg : arg.id;

  const { data:ses } = await SB.from('mis_sesiones').select('*').eq('id', pasoId).maybeSingle();
  if (!ses) return app.innerHTML = `<div class="error">No se encontró esa clase.</div>`;

  const [{ data:curso }, { data:hermanas }] = await Promise.all([
    SB.from('mi_curso').select('*').eq('id', ses.ruta_id).maybeSingle(),
    SB.from('mis_sesiones').select('*').eq('ruta_id', ses.ruta_id).order('orden')
  ]);

  const lista = hermanas || [];
  const idx  = lista.findIndex(x => x.id === pasoId);
  const sig  = lista[idx + 1];

  app.innerHTML = `<button class="volver" id="atras">← ${esc(curso?.nombre || 'Volver')}</button>` +
    cabeza(esc(ses.nombre), `Clase ${idx + 1} de ${lista.length}${curso?.programa ? ' · ' + esc(curso.programa) : ''}`) + `

    ${ses.video_id ? `
      <div class="marco-video"><div id="reproductor"></div></div>
      <div class="progreso-clase">
        <div class="barra-prog"><i id="barraVideo" style="width:${ses.pct}%"></i></div>
        <span id="pctVideo">${ses.pct}%</span>
      </div>
      <p class="estado-clase" id="estadoClase">${ses.hecha
        ? 'Clase vista.'
        : `Hay que ver el ${ses.minimo_pct}% para que cuente.`}</p>
    ` : `<div class="vacio"><strong>Esta clase no tiene video</strong>
          Léela y márcala cuando termines.</div>`}

    ${ses.descripcion || ses.texto ? `<div class="tarjeta"><div class="tarjeta-cuerpo">
      ${ses.descripcion ? `<p style="margin:0 0 10px;font-size:15.5px">${esc(ses.descripcion)}</p>` : ''}
      ${ses.texto ? `<div style="white-space:pre-wrap;font-size:15px;line-height:1.65">${esc(ses.texto)}</div>` : ''}
    </div></div>` : ''}

    ${ses.material_url ? `<div class="tarjeta"><div class="tarjeta-alto"><h2>Material</h2></div>
      <div class="tarjeta-cuerpo">
        <a class="btn seco" href="${esc(ses.material_url)}" target="_blank" rel="noopener">
          Descargar ${esc(ses.material_nombre || 'el material')}</a>
      </div></div>` : ''}

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px">
      ${!ses.video_id && !ses.hecha ? `<button class="btn" id="marcarClase">Ya la leí</button>` : ''}
      ${sig ? `<button class="btn${ses.hecha ? '' : ' seco'}" id="sigue">Siguiente clase</button>` : ''}
      <button class="btn seco" id="alCurso">Ver el curso</button>
    </div>`;

  const irAlCurso = () => ir('curso', ses.ruta_id);
  document.getElementById('atras').onclick   = irAlCurso;
  document.getElementById('alCurso').onclick = irAlCurso;
  const bs = document.getElementById('sigue');
  if (bs) bs.onclick = () => ir('clase', sig.id);

  const bm = document.getElementById('marcarClase');
  if (bm) bm.onclick = async () => {
    const { error } = await SB.rpc('guardar_vista', { p_paso:pasoId, p_segs:0, p_tope:0 });
    if (error) return mostrar('No se pudo', error.message);
    avisar('Clase marcada.');
    ir('clase', pasoId);
  };

  if (!ses.video_id) return;

  // ---------- el reproductor ----------
  const YT = await cargarYT();
  if (!YT){
    document.querySelector('.marco-video').innerHTML =
      `<div class="vacio" style="margin:0"><strong>No se pudo cargar el video</strong>
        Revisa tu conexión y vuelve a entrar.</div>`;
    return;
  }

  let segs = ses.segs_vistos || 0;
  let tope = ses.tope_segs   || 0;
  let anterior = null;
  let hecha = ses.hecha;
  let guardando = false;

  const barra  = document.getElementById('barraVideo');
  const marca  = document.getElementById('pctVideo');
  const estado = document.getElementById('estadoClase');
  const dur    = ses.video_segs || 0;

  const pintar = () => {
    const pct = dur ? Math.min(100, Math.round(segs * 100 / dur)) : 0;
    barra.style.width = pct + '%';
    marca.textContent = pct + '%';
  };

  const guardar = async () => {
    if (guardando) return;
    guardando = true;
    const { data, error } = await SB.rpc('guardar_vista',
      { p_paso:pasoId, p_segs:Math.round(segs), p_tope:Math.round(tope) });
    guardando = false;
    if (error) return;
    const r = Array.isArray(data) ? data[0] : data;
    if (!r) return;
    if (r.completo && !hecha){
      hecha = true;
      if (r.marcada){
        estado.textContent = 'Clase vista. Ya quedó registrada.';
        estado.classList.add('ok');
        avisar('Clase vista.');
        if (bs) bs.classList.remove('seco');
      } else {
        // El freno del ritmo: lo visto quedó guardado, lo que se
        // aplaza es darla por hecha.
        estado.textContent = r.aviso || 'Clase vista, pero todavía no cuenta.';
        estado.classList.add('aviso-ritmo');
      }
    }
  };

  // Se usa e.target y no la variable de afuera: si YouTube avisa que
  // está listo antes de terminar de construirse, la variable todavía
  // no existe y la pantalla se cae.
  let player = null;
  player = new YT.Player('reproductor', {
    videoId: ses.video_id,
    playerVars: { rel:0, modestbranding:1, playsinline:1, origin:location.origin },
    events: {
      onReady: e => { const pl = (e && e.target) || player; if (pl && tope > 5) pl.seekTo(Math.max(0, tope - 3), true); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) guardar(); }
    }
  });

  // Cada segundo: cuenta lo que de verdad corrió y frena los saltos.
  let desdeGuardado = 0;
  const reloj = setInterval(() => {
    if (S.vista !== 'clase'){ clearInterval(reloj); return; }
    if (!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime();
    const tocando = player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;

    if (anterior !== null){
      const salto = t - anterior;
      // Entre 0 y 2 segundos es reproducción normal; más que eso es
      // que arrastró la barra, y eso no se cuenta como visto.
      if (tocando && salto > 0 && salto <= 2){
        segs += salto;
        desdeGuardado += salto;
      }
    }
    anterior = t;
    tope = Math.max(tope, t);

    // No se puede saltar más allá de lo ya visto (con medio minuto
    // de holgura, para no pelear con quien solo quiere repasar).
    if (!hecha && t > tope + 30){
      player.seekTo(tope, true);
      avisar('Hay que ver la clase completa, sin saltar.', true);
    }

    pintar();
    if (desdeGuardado >= 15){ desdeGuardado = 0; guardar(); }
  }, 1000);
}

async function vQuiz(arg){
  cargando();
  const rutaId = typeof arg === 'string' ? arg : arg.id;

  const { data:curso } = await SB.from('mi_curso').select('*').eq('id', rutaId).maybeSingle();
  if (!curso) return app.innerHTML = `<div class="error">No se encontró ese curso.</div>`;

  // Abrir el intento es lo que valida que ya vio las clases y que le
  // quedan intentos. Si no deja, lo dice la base, no la pantalla.
  const { data:intentoId, error:eAbrir } = await SB.rpc('abrir_intento', { p_ruta:rutaId });
  if (eAbrir){
    return app.innerHTML = `<button class="volver" id="atras">← Volver</button>` +
      cabeza('Quiz de ' + esc(curso.nombre), '') +
      `<div class="vacio"><strong>Todavía no</strong>${esc(eAbrir.message)}</div>`,
      document.getElementById('atras').onclick = () => ir('curso', rutaId);
  }

  const [{ data:preg }, { data:ops }] = await Promise.all([
    SB.from('preguntas').select('*').eq('ruta_id', rutaId).order('orden'),
    SB.from('opciones').select('id,pregunta_id,texto,orden').order('orden')
  ]);
  const preguntas = preg || [];
  const porPregunta = q => (ops || []).filter(o => o.pregunta_id === q);

  const elegido = {};

  app.innerHTML = `<button class="volver" id="atras">← ${esc(curso.nombre)}</button>` +
    cabeza('Quiz de ' + esc(curso.nombre),
      `${preguntas.length} preguntas · se pasa con ${curso.nota_minima}% · te quedan ${
        curso.intentos_quiz - curso.intentos_usados} intentos`) + `

    ${preguntas.map((q, n) => `
      <div class="tarjeta"><div class="tarjeta-cuerpo">
        <p class="num-preg">Pregunta ${n + 1}${q.puntos > 1 ? ` · ${q.puntos} puntos` : ''}</p>
        <p class="enunciado">${esc(q.enunciado)}</p>
        ${q.tipo === 'abierta'
          ? `<textarea data-abierta="${q.id}" placeholder="Tu respuesta…"></textarea>
             <p class="ayuda-quiz">La lee un maestro y la califica aparte.</p>`
          : `<div class="opciones-quiz">
              ${porPregunta(q.id).map(o => `
                <button type="button" class="op-quiz" data-op="${o.id}" data-q="${q.id}"
                  data-multi="${q.tipo === 'multiple'}" aria-pressed="false">${esc(o.texto)}</button>`).join('')}
             </div>
             ${q.tipo === 'multiple' ? `<p class="ayuda-quiz">Puede haber más de una.</p>` : ''}`}
      </div></div>`).join('')}

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px">
      <button class="btn" id="entregar">Entregar</button>
      <button class="btn seco" id="dejarlo">Dejarlo para después</button>
    </div>`;

  const volver = () => ir('curso', rutaId);
  document.getElementById('atras').onclick    = volver;
  document.getElementById('dejarlo').onclick  = volver;

  app.querySelectorAll('[data-op]').forEach(b => b.onclick = () => {
    const q = b.dataset.q, multi = b.dataset.multi === 'true';
    elegido[q] = elegido[q] || [];
    if (multi){
      const i = elegido[q].indexOf(b.dataset.op);
      i >= 0 ? elegido[q].splice(i,1) : elegido[q].push(b.dataset.op);
    } else {
      elegido[q] = [b.dataset.op];
      app.querySelectorAll(`[data-q="${q}"]`).forEach(o => o.setAttribute('aria-pressed','false'));
    }
    b.setAttribute('aria-pressed', elegido[q].includes(b.dataset.op));
  });

  document.getElementById('entregar').onclick = async () => {
    const faltan = preguntas.filter(q =>
      q.tipo === 'abierta'
        ? !(document.querySelector(`[data-abierta="${q.id}"]`).value || '').trim()
        : !(elegido[q.id] || []).length);

    if (faltan.length && !await confirmar(
      faltan.length === 1 ? 'Falta 1 pregunta' : `Faltan ${faltan.length} preguntas`,
      'Las que dejes en blanco cuentan como malas. ¿Entregas así?', false)) return;

    const cuerpo = {};
    preguntas.forEach(q => {
      cuerpo[q.id] = q.tipo === 'abierta'
        ? { texto: document.querySelector(`[data-abierta="${q.id}"]`).value.trim() }
        : { opciones: elegido[q.id] || [] };
    });

    const b = document.getElementById('entregar');
    b.disabled = true; b.textContent = 'Calificando…';
    const { data, error } = await SB.rpc('calificar_quiz',
      { p_intento:intentoId, p_respuestas:cuerpo });
    if (error){
      b.disabled = false; b.textContent = 'Entregar';
      return mostrar('No se pudo calificar', error.message);
    }
    const r = Array.isArray(data) ? data[0] : data;
    S.resultado = { ...r, ruta_id:rutaId, curso:curso.nombre };
    ir('resultado', rutaId);
  };
}

      <div class="par"><div><label for="mtipo">Tipo</label>

        <div><label for="mtema">Tema</label><input id="mtema" type="text" placeholder="Integridad, paternidad…"></div></div>
      <div class="par"><div><label for="mautor">Autor</label><input id="mautor" type="text"></div>
        <div><label for="menlace">Enlace</label><input id="menlace" type="url" placeholder="https://"></div></div>
      <div style="margin-top:16px"><button class="btn" id="guardarMat">Guardar material</button></div>
    </div></div>`;

  if (!data.length){
    html += `<div class="vacio"><strong>Todavía no hay material</strong>
      Aquí van a estar las prédicas, los libros y los escritos que los líderes quieran tener a la mano.</div>`;
  } else {
    html += '<div class="tarjeta"><ul class="registro">' + data.map(m => `
      <li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(m.titulo)}</span></span>
        <span class="sub"><span class="sello">${esc(TIPOS_MAT[m.tipo] || m.tipo)}</span>
          ${m.tema ? `<span>${esc(m.tema)}</span>` : ''}${m.autor ? `<span>· ${esc(m.autor)}</span>` : ''}</span>
        <span style="display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap">
        ${m.enlace ? `<a href="${esc(m.enlace)}" target="_blank" rel="noopener"
           style="font-size:14px;font-weight:600">Abrir →</a>` : ''}
        ${puede ? `<button class="btn rojo chico" data-borrarmat="${m.id}">Eliminar</button>` : ''}</span>
      </div></li>`).join('') + '</ul></div>';
  }

  app.innerHTML = html;
  app.querySelectorAll('[data-borrarmat]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar este material?', 'No se puede deshacer.')) return;
    const { error } = await SB.from('materiales').delete().eq('id', b.dataset.borrarmat);
    if (error) return avisar(error.message, true);
    avisar('Material eliminado.'); ir('material');
  });
  const n = document.getElementById('nuevo');
  if (n) n.onclick = () => {
    const f = document.getElementById('formNuevo');
    f.hidden = !f.hidden; n.textContent = f.hidden ? 'Agregar' : 'Cancelar';
  };
  const g = document.getElementById('guardarMat');
  if (g) g.onclick = async () => {
    const titulo = document.getElementById('mt').value.trim();
    if (!titulo) return avisar('Ponle un título.', true);
    g.disabled = true;
    const { error } = await SB.from('materiales').insert({
      titulo, tipo:document.getElementById('mtipo').value,
      tema:  document.getElementById('mtema').value.trim()   || null,
      autor: document.getElementById('mautor').value.trim()  || null,
      enlace:document.getElementById('menlace').value.trim() || null,
      creado_por:S.yo.persona_id
    });
    if (error){ avisar(error.message, true); g.disabled = false; return; }
    avisar('Material guardado.');
    ir('material');
  };
}

          <select id="fPro" data-f="proceso">

  function tarjeta(g){

  function pintarKpis(){

        <span class="pie">${txt}</span>
      </button>`).join('');

      const v = b.dataset.kpi;
      S.filtros.situacion = (v === '' || S.filtros.situacion === v) ? '' : v;
      pintarKpis(); pintarLista();
    });

  function pintarLista(){
    const res = (gente || []).filter(pasa);
    document.getElementById('lista').innerHTML = res.length
      ? res.map(tarjeta).join('')
      : `<div class="vacio" style="grid-column:1/-1"><strong>Nadie coincide</strong>
         Prueba con menos filtros o con otra palabra.</div>`;

  /* ---------- enganches ---------- */
  const q  = document.getElementById('q');
  const lq = document.getElementById('limpiarQ');
  q.oninput = () => {
    S.filtros.texto = q.value;
    lq.hidden = !q.value;
    pintarLista();
  };
  lq.onclick = () => {
    S.filtros.texto = ''; q.value = ''; lq.hidden = true;
    pintarLista(); q.focus();
  };

  document.getElementById('avanzada').onclick = () => {
    const pa = document.getElementById('panelAvanzada');
    pa.hidden = !pa.hidden;
  };

  document.getElementById('limpiarTodo').onclick = () => {
    S.filtros = { ...FILTROS_VACIOS };
    q.value = ''; lq.hidden = true;
    app.querySelectorAll('[data-f]').forEach(el => el.value = '');
    pintarKpis(); pintarLista();
  };

  /* ---------- descargar, eligiendo campos ---------- */
  document.getElementById('bajarCsv').onclick = () => descargar((gente || []).filter(pasa));
  document.getElementById('verListas').onclick = () => ir('listas');

  /* ---------- listas guardadas ---------- */

      marcador: 'Legendarios sin caballeros' });

      nombre, filtros: S.filtros, creado_por: S.yo.persona_id });

    ir('listas');
  };



  app.querySelectorAll('[data-f]').forEach(el => {
    const k = el.dataset.f;
    if (el.tagName === 'SELECT') el.value = S.filtros[k] || '';
    const manejar = () => { S.filtros[k] = el.value; pintarLista(); };
    el.onchange = manejar;
    if (el.tagName === 'INPUT') el.oninput = manejar;
  });

  if (hayFiltros()) document.getElementById('panelAvanzada').hidden = false;

  const nb = document.getElementById('nuevo');
  if (nb) nb.onclick = () => ir('nuevaPersona');
}

const FILTROS_VACIOS = { texto:'', excluir:'', situacion:'', rango:'', rangoNo:'',
                         area:'', areaNo:'', proceso:'', curso:'', estado:'',
                         edadMin:'', edadMax:'', lider:'', anio:'' };

function hayFiltros(){
  return Object.keys(FILTROS_VACIOS).some(k => S.filtros[k]);
}

/* ============================================================
   Descargar, eligiendo qué campos
   ============================================================ */
const CAMPOS = [
  ['nombre','Nombre'], ['nombre_completo','Nombre completo'], ['rango','Rango'],
  ['situacion','Estado de cuidado'], ['dias','Días sin verse'], ['ultima_reunion','Último encuentro'],
  ['gestion','Gestión'], ['lider','Lo cuida'], ['areas','Áreas'], ['areas_todas','Áreas (incluidas las pasadas)'],
  ['cursos','Cursos'], ['cursos_hechos','Cursos terminados'], ['rutas_completas','Cursos completos'],
  ['pasos_hechos','Sesiones completadas'], ['edad','Edad'], ['fecha_nacimiento','Fecha de nacimiento'],
  ['celular','Celular'], ['telefono','Teléfono fijo'], ['correo','Correo'],
  ['documento','Cédula'], ['estado','Estado'], ['fecha_ingreso','Fecha de ingreso'],
  ['como_llego','Cómo llegó'], ['anios','Años en el sistema']
];
const CAMPOS_BASE = ['nombre','rango','situacion','dias','lider','areas','celular','correo'];

function descargar(filas){
  if (!filas.length) return avisar('No hay nada que descargar.', true);
  const puede = V().es_admin;
  const disponibles = CAMPOS.filter(c => c[0] !== 'documento' || puede);
  const marcados = new Set(CAMPOS_BASE);

  dialogo({
    titulo: 'Descargar',
    texto: `${filas.length} ${filas.length === 1 ? 'persona' : 'personas'}. Elige qué datos quieres.`,
    aceptar: 'Descargar',
    ancho: true,
    cuerpo: `
      <div class="buscador"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/>
        <path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>
        <input id="qCampo" type="text" placeholder="Buscar un campo…" autocomplete="off"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button type="button" class="btn seco chico" id="todosCampos">Todos</button>
        <button type="button" class="btn seco chico" id="ningunCampo">Ninguno</button>
        <span class="ruta-conteo" id="contCampos"></span></div>
      <div class="campos-lista" id="listaCampos"></div>`,
    alMontar: velo => {
      const caja = velo.querySelector('#listaCampos');
      const q    = velo.querySelector('#qCampo');
      const cont = velo.querySelector('#contCampos');

      const pintar = () => {
        const t = normaliza(q.value);
        const vis = disponibles.filter(c => !t || normaliza(c[1]).includes(t));
        caja.innerHTML = vis.length ? vis.map(([k,n]) => `
          <label class="campo-op"><input type="checkbox" data-c="${k}" ${marcados.has(k) ? 'checked' : ''}>
            ${esc(n)}</label>`).join('')
          : `<p style="margin:10px;color:var(--suave);font-size:14px">Ningún campo se llama así.</p>`;
        caja.querySelectorAll('[data-c]').forEach(ch => ch.onchange = () => {
          ch.checked ? marcados.add(ch.dataset.c) : marcados.delete(ch.dataset.c);
          cont.textContent = `${marcados.size} elegidos`;
        });
        cont.textContent = `${marcados.size} elegidos`;
      };
      pintar();
      q.oninput = pintar;
      velo.querySelector('#todosCampos').onclick = () => {
        disponibles.forEach(c => marcados.add(c[0])); pintar();
      };
      velo.querySelector('#ningunCampo').onclick = () => { marcados.clear(); pintar(); };

      return () => {
        if (!marcados.size){ avisar('Elige al menos un campo.', true); return undefined; }
        return [...marcados];
      };
    }
  }).then(elegidos => {
    if (!elegidos) return;
    const cols = disponibles.filter(c => elegidos.includes(c[0]));
    const limpia = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
    const csv = '﻿' + [cols.map(c => limpia(c[1])).join(';')]
      .concat(filas.map(g => cols.map(c => limpia(g[c[0]])).join(';'))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = `personas-${hoy()}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
    avisar(`${filas.length} ${filas.length === 1 ? 'persona descargada' : 'personas descargadas'}.`);
  });
}

    ${menor ? `<div class="tarjeta"><div class="tarjeta-alto"><h2>Acudiente</h2></div>
      <div class="tarjeta-cuerpo">
        <div class="par"><div><label for="an" style="margin-top:0">Nombre del acudiente</label>

        <div class="par"><div><label for="acel">Celular del acudiente</label>
          <input id="acel" type="text" inputmode="numeric"></div>
          <div><label for="acor">Correo del acudiente</label><input id="acor" type="email"></div></div>

        <select id="amed"><option>WhatsApp</option><option>Firmó en papel</option>
          <option>Correo</option><option>En persona</option></select>
        <div class="tarjeta" style="margin:16px 0 0;box-shadow:none;background:var(--alto)">
          <div class="tarjeta-cuerpo"><p style="margin:0;font-size:14px;line-height:1.6">${esc(AUTORIZACION_MENOR)}</p></div></div>
        <label class="casilla"><input type="checkbox" id="aok">
          <div><b>El acudiente autorizó</b></div></label>
      </div></div>` : ''}

    <div class="tarjeta"><div class="tarjeta-alto"><h2>Tratamiento de datos</h2></div>
      <div class="tarjeta-cuerpo">
        <div class="tarjeta" style="margin:0;box-shadow:none;background:var(--alto)">
          <div class="tarjeta-cuerpo"><p style="margin:0;font-size:14px;line-height:1.6">${esc(AUTORIZACION)}</p></div></div>
        <div class="par" style="margin-top:14px"><div><label for="dmed" style="margin-top:0">¿Cómo autorizó?</label>
          <select id="dmed"><option>En persona</option><option>WhatsApp</option>
            <option>Firmó en papel</option><option>Correo</option><option>Formulario</option></select></div></div>
        <label class="casilla"><input type="checkbox" id="dok">
          <div><b>${menor ? 'El acudiente autorizó el tratamiento de datos' : 'Autorizó el tratamiento de datos'}</b></div></label>
      </div></div>

    <div class="tarjeta"><div class="tarjeta-alto"><h2>En el ministerio</h2></div>
