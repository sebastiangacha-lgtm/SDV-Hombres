const TIPOS_EV = { oracion:'Oración', mesa:'Mesa', legendarios:'Legendarios',
                   grupo_vida:'Grupo de vida', otro:'Otro' };

async function vEventos(){
  cargando();
  const yo = V();
  const puede = yo.es_admin || yo.puede_cuidar;

  const [{ data:evs, error }, { data:vis }] = await Promise.all([
    SB.from('eventos_resumen').select('*').order('fecha', { ascending:false }),
    puede ? SB.from('visitantes').select('*').order('dias_desde', { ascending:true })
          : Promise.resolve({ data:[] })
  ]);
  if (error) return app.innerHTML = `<div class="error">${esc(error.message)}</div>`;

  const hoyF = hoy();
  const proximos = (evs || []).filter(e => e.fecha >= hoyF).reverse();
  const pasados  = (evs || []).filter(e => e.fecha <  hoyF);
  const delAnio  = pasados.filter(e => e.fecha.startsWith(hoyF.slice(0,4)));
  const asistTot = delAnio.reduce((a,e) => a + Number(e.asistieron), 0);

  let html = cabeza('Eventos', 'Reuniones, mesas y actividades del ministerio',
    puede ? `<button class="btn" id="nuevo">Crear evento</button>` : '');

  html += cifras([
    { icono:'eventos',    color:'azul',  valor:proximos.length,       texto:'por venir' },
    { icono:'reloj',      color:'verde', valor:delAnio.length,        texto:'hechos este año' },
    { icono:'ministerio', color:'verde', valor:asistTot,              texto:'asistencias del año' },
    { icono:'puerta',     color:'ambar', valor:(vis || []).length,    texto:'visitantes por vincular' }
  ]);

  if (puede) html += `<div id="formNuevo" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="par"><div><label for="en">Nombre</label>
        <input id="en" type="text" placeholder="Mesa de caballeros · octubre"></div>
        <div><label for="et">Tipo</label><select id="et">
          ${Object.entries(TIPOS_EV).map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select></div></div>
      <div class="par"><div><label for="ef">Fecha</label><input id="ef" type="date" value="${hoyF}"></div>
        <div><label for="eh">Hora</label><input id="eh" type="text" placeholder="7:00 pm"></div></div>
      <label for="el">Lugar</label><input id="el" type="text" placeholder="Auditorio, casa de alguien, en línea…">
      <label for="ed">De qué se trata</label><input id="ed" type="text">
      <div style="margin-top:16px"><button class="btn" id="guardarEv">Crear evento</button></div>
    </div></div>`;

  const tarjetaEv = e => `<li><button class="fila" data-ev="${e.id}">
      <span class="fila-alto"><span class="nombre">${esc(e.nombre)}</span>
        <span class="cuenta ${e.asistieron ? 'v-cuidado' : ''}">${e.asistieron}<small>${e.asistieron === 1 ? 'fue' : 'fueron'}</small></span></span>
      <span class="sub"><span class="sello">${esc(TIPOS_EV[e.tipo] || e.tipo)}</span>
        <span>${fechaCorta(e.fecha)}${e.hora ? ' · ' + esc(e.hora.slice(0,5)) : ''}</span>
        ${e.lugar ? `<span>· ${esc(e.lugar)}</span>` : ''}
        ${e.visitantes ? `<span style="color:var(--ambar)">· ${e.visitantes} ${e.visitantes === 1 ? 'visitante' : 'visitantes'}</span>` : ''}</span>
    </button></li>`;

  if (proximos.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Por venir</h2></div>
      <ul class="registro">${proximos.map(tarjetaEv).join('')}</ul></div>`;

  if (pasados.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Ya pasaron</h2></div>
      <ul class="registro">${pasados.map(tarjetaEv).join('')}</ul></div>`;

  if (!evs.length)
    html += `<div class="vacio"><strong>Todavía no hay eventos</strong>
      Crea una mesa, una noche de oración o una actividad, y después toma la asistencia.
      Los invitados que lleguen quedan registrados para poder buscarlos luego.</div>`;

  if (puede && vis && vis.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Van llegando</h2>
        <span class="ruta-conteo">Fueron a un evento y todavía no entran al ministerio</span></div>
      <ul class="registro">${vis.map(v => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre">${esc(v.nombre)}</span>
          <span class="cuenta ${v.eventos_asistidos > 1 ? 'v-cuidado' : ''}">${v.eventos_asistidos}<small>${v.eventos_asistidos === 1 ? 'vez' : 'veces'}</small></span></span>
        <span class="sub">${v.ultima_vez ? `<span>Última vez ${haceCuanto(v.dias_desde)}</span>` : '<span>Aún no ha venido</span>'}
          ${v.celular ? `<span>· <a href="https://wa.me/57${esc(v.celular)}">${esc(v.celular)}</a></span>` : ''}</span>
      </div></li>`).join('')}</ul>
      </div>`;

  app.innerHTML = html;
  app.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => ir('evento', b.dataset.ev));

  const n = document.getElementById('nuevo');
  if (n) n.onclick = () => {
    const f = document.getElementById('formNuevo');
    f.hidden = !f.hidden; n.textContent = f.hidden ? 'Crear evento' : 'Cancelar';
  };
  const g = document.getElementById('guardarEv');
  if (g) g.onclick = async () => {
    const nombre = document.getElementById('en').value.trim();
    if (!nombre) return avisar('Ponle nombre al evento.', true);
    g.disabled = true;
    const { error } = await SB.from('eventos').insert({
      nombre, tipo:document.getElementById('et').value,
      fecha: document.getElementById('ef').value,
      hora:  document.getElementById('eh').value.trim() || null,
      lugar: document.getElementById('el').value.trim() || null,
      descripcion: document.getElementById('ed').value.trim() || null,
      creado_por: S.yo.persona_id });
    if (error){ avisar(error.message, true); g.disabled = false; return; }
    avisar('Evento creado.');
    ir('eventos');
  };
}

            evento_id:id, persona_id:pid, area_id:aid, rol:'servidor', creado_por:S.yo.persona_id });
      if (error) return avisar(error.message, true);
      ir('evento', id);

  const ae = document.getElementById('addEnc');

      evento_id:id, persona_id:document.getElementById('encP').value,

    ir('evento', id);

  app.querySelectorAll('[data-quitar]').forEach(b => b.onclick = async () => {

  app.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
    const x = (equipo || []).find(q => q.id === b.dataset.wa);
    if (!x || !x.celular) return;
    const rol = x.rol === 'encargado' ? 'encargado' : (x.area ? `servidor de ${x.area}` : 'servidor');

      + `${fechaCorta(e.fecha)}${e.hora ? ' a las ' + e.hora.slice(0,5) : ''}`

  app.querySelectorAll('[data-as]').forEach(b => b.onclick = async () => {
    const pid = b.dataset.as, fue = b.dataset.fue === '1';

      ({ error } = await SB.from('asistencias').update({ asistio:fue }).eq('id', ya.id));

      ({ error } = await SB.from('asistencias').insert({
        evento_id:id, persona_id:pid, asistio:fue, invitado_por:S.yo.persona_id }));
    }
    if (error) return avisar(error.message, true);
    ir('evento', id);
  });

  const av = document.getElementById('addVis');
  if (av) av.onclick = async () => {
    const nombre = document.getElementById('vn').value.trim();

      p_evento:id, p_nombre:nombre, p_celular:document.getElementById('vc').value.trim() || null });

    avisar(`${nombre.split(' ')[0]} quedó registrado.`);
    ir('evento', id);
  };
}

// Un archivo .ics: cada uno lo abre y el evento le queda en SU
// calendario. Si la persona tiene rol en el evento, va en el título.
function descargarIcs(e, rol){
  const f = e.fecha.replace(/-/g,'');
  const h = (e.hora || '19:00').slice(0,5).replace(':','') + '00';
  const limpio = t => String(t || '').replace(/[\n,;]/g,' ');
  const titulo = rol ? `${e.nombre} — ${rol}` : e.nombre;
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SDV//Cuidado//ES','BEGIN:VEVENT',
    `UID:${e.id}-${(rol||'asiste').replace(/\s/g,'')}@sdv`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
    `DTSTART;TZID=America/Bogota:${f}T${h}`,
    `SUMMARY:${limpio(titulo)}`,
    e.lugar ? `LOCATION:${limpio(e.lugar)}` : '',
    `DESCRIPTION:${limpio((rol ? 'Tu rol: ' + rol + '. ' : '') + (e.descripcion || ''))}`,
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar' }));
  a.download = limpio(e.nombre).replace(/[^\wáéíóúñ ]/gi,'').trim() + '.ics';
  a.click();
  URL.revokeObjectURL(a.href);
  avisar('Archivo descargado.');
}

    if (!titulo) return avisar('Ponle título.', true);
    const { error } = await SB.from('materiales').insert({
      titulo, area_id:id, tipo:document.getElementById('amtipo').value,
      tema:  document.getElementById('amtema').value.trim()   || null,
      enlace:document.getElementById('amenlace').value.trim() || null,
      creado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Material guardado.');
    ir('area', id);
  };
}

/* ============================================================
   Yo
   ============================================================ */
async function vYo(){
  cargando();
  const { data:p } = await SB.from('ficha_persona').select('*').eq('id', S.yo.persona_id).maybeSingle();
  const c = claseEstado(p?.situacion);

  app.innerHTML = cabeza(esc(S.yo.nombre),
    `${esc(S.yo.rango || 'sin rango')}${p?.lider ? ` · cuidado por ${esc(p.lider)}` : ''}`) + `
    ${p ? `<div class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="fila-alto"><div style="flex:1">
        <span class="marca-est m-${c.slice(2)}">${esc(p.situacion)}</span>
        <p class="ayuda">${p.ultima_reunion
          ? `Tu líder y tú se vieron ${haceCuanto(p.dias)}.`
          : 'Todavía no hay un encuentro registrado contigo.'}</p></div>
        <span class="cuenta ${c}">${p.dias}<small>días</small></span></div>
      <span class="medida ${c}" style="margin-top:14px"><i style="width:${Math.min(100,Math.round(p.dias/90*100))}%"></i><b style="left:33.3%"></b></span>
    </div></div>` : ''}

    <div class="tarjeta"><div class="tarjeta-alto"><h2>Lo que puedes hacer</h2></div>
      <div class="tarjeta-cuerpo"><ul class="datos">
        <li><span>Hombres a tu cargo</span><b>${S.yo.a_cargo}</b></li>
        <li><span>Registrar cuidado</span><b>${S.yo.puede_cuidar ? 'Sí' : 'Todavía no'}</b></li>
        ${S.yo.ve_todo  ? '<li><span>Ver todo el ministerio</span><b>Sí</b></li>' : ''}
        ${S.yo.es_admin ? '<li><span>Administrar la plataforma</span><b>Sí</b></li>' : ''}
      </ul>
      </div></div>

    <div class="tarjeta"><div class="tarjeta-alto"><h2>Apariencia</h2>
      <button class="btn seco chico" id="cambiarTema">${
        document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'Pasar a claro' : 'Pasar a oscuro'}</button></div>
      </div>

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px">
      <button class="btn seco" id="miProc">Ver mi proceso</button>
      <button class="btn seco" id="salir">Cerrar sesión</button></div>`;

  document.getElementById('cambiarTema').onclick = () => { girarTema(); ir('yo'); };
  document.getElementById('miProc').onclick = () => { S.procPersona = S.yo.persona_id; ir('procesos'); };
  document.getElementById('salir').onclick = () => SB.auth.signOut();
}

arrancar();
</script>
