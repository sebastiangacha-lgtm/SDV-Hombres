  app.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
    const x = (equipo || []).find(q => q.id === b.dataset.wa);
    if (!x || !x.celular) return;
    const rol = x.rol === 'encargado' ? 'encargado' : (x.area ? `servidor de ${x.area}` : 'servidor');

    const pid = b.dataset.as, fue = b.dataset.fue === '1';

  });

    avisar(`${nombre.split(' ')[0]} quedó registrado.`);

  };
}

// Un archivo .ics: cada uno lo abre y el evento le queda en SU
// calendario. Si la persona tiene rol en el evento, va en el título.
function descargarIcs(e, rol){
  const f = e.fecha.replace(/-/g,'');
  const h = (e.hora || '19:00').slice(0,5).replace(':','') + '00';
  const limpio = t => String(t || '').replace(/[\n,;]/g,' ');
  const titulo = rol ? `${e.nombre} — ${rol}` : e.nombre;
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SDV//Cuidado//ES','BEGIN:VEVENT',
    `UID:${e.id}-${(rol||'asiste').replace(/\s/g,'')}@sdv`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
    `DTSTART;TZID=America/Bogota:${f}T${h}`,
    `SUMMARY:${limpio(titulo)}`,
    e.lugar ? `LOCATION:${limpio(e.lugar)}` : '',
    `DESCRIPTION:${limpio((rol ? 'Tu rol: ' + rol + '. ' : '') + (e.descripcion || ''))}`,
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar' }));
  a.download = limpio(e.nombre).replace(/[^\wáéíóúñ ]/gi,'').trim() + '.ics';
  a.click();
  URL.revokeObjectURL(a.href);
  avisar('Archivo descargado.');
}

async function vServicio(){

      </div></li>`).join('')}</ul></div>`;
  } else {
    html += `<div class="vacio"><strong>No tienes fechas por venir</strong>

    avisar('Confirmado.');
    ir('servicio');

  app.querySelectorAll('[data-ics]').forEach(b => b.onclick = async () => {
    const f = (fechas || []).find(x => x.evento_id === b.dataset.ics);
    const { data:ev } = await SB.from('eventos').select('*').eq('id', b.dataset.ics).maybeSingle();

  const aa = document.getElementById('admAreas');
  if (aa){
    aa.onclick = () => {
      const f = document.getElementById('formArea');

      if (error) return avisar(error.message, true);
      avisar('Área creada.');

      const { error } = await SB.from('persona_area').insert({

      if (error) return avisar(error.message, true);
      avisar('Listo, quedó en el área.');
      ir('servicio');
    };
  }
}

async function vArea(id){
  cargando();
  const [{ data:area, error }, { data:novs }, { data:mats }, { data:equipo }] = await Promise.all([
    SB.from('areas').select('*').eq('id', id).maybeSingle(),
    SB.from('novedades').select('*').eq('area_id', id).order('creado_en', { ascending:false }),
    SB.from('materiales').select('*').eq('area_id', id).order('creado_en', { ascending:false }),
    SB.from('servidores_por_area').select('*').eq('area_id', id).order('nombre')
  ]);
  if (error || !area) return app.innerHTML = `<div class="error">No se encontró esa área.</div>`;

  const soyLider = (equipo || []).some(e => e.persona_id === S.yo.persona_id && e.rol_en_area === 'lider');
  const puede = V().es_admin || soyLider;

  let html = `<button class="volver" id="atras">← Volver a mi servicio</button>` +
    cabeza(esc(area.nombre), `${(equipo || []).length} ${(equipo || []).length === 1 ? 'persona' : 'personas'} en el área`,
      puede ? `<button class="btn" id="nuevaNov">Publicar novedad</button>` : '');

  if (puede) html += `<div id="formNov" hidden class="tarjeta"><div class="tarjeta-cuerpo">
      <label for="nt" style="margin-top:0">Título</label><input id="nt" type="text" placeholder="Cambio de horario del domingo">
      <label for="nc">Qué pasó</label><textarea id="nc"></textarea>
      <div style="margin-top:16px"><button class="btn" id="guardarNov">Publicar</button></div>
    </div></div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Novedades</h2></div>
    <div class="tarjeta-cuerpo">`;
  if (!novs || !novs.length){
    html += `<p style="margin:0;color:var(--suave);font-size:14.5px">Todavía no hay novedades del área.</p>`;
  } else {
    html += '<ul class="hilo">' + novs.map(n => `<li class="anota es-reunion">
      <div class="anota-alto"><span class="anota-fecha">${fechaCorta(n.creado_en.slice(0,10))}</span>
        ${n.creado_por ? `<span class="anota-fecha">· ${esc(S.nombres.get(n.creado_por) || 'Un líder')}</span>` : ''}</div>
      <p class="anota-tema">${esc(n.titulo)}</p>
      ${n.cuerpo ? `<p class="anota-cuerpo">${esc(n.cuerpo)}</p>` : ''}
      ${puede ? `<div style="margin-top:9px"><button class="btn rojo chico" data-borrarnov="${n.id}">Eliminar</button></div>` : ''}
      </li>`).join('') + '</ul>';
  }
  html += `</div></div>`;

  html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Material del área</h2>
      ${puede ? `<button class="btn seco chico" id="nuevoMat">Agregar</button>` : ''}</div>`;
  if (puede) html += `<div id="formMatA" hidden class="tarjeta-cuerpo" style="border-bottom:1px solid var(--linea-suave)">
      <div class="par"><div><label for="amt" style="margin-top:0">Título</label><input id="amt" type="text"></div>
        <div><label for="amtipo" style="margin-top:0">Tipo</label><select id="amtipo">
          ${Object.entries(TIPOS_MAT).map(([v,t]) => `<option value="${v}">${t}</option>`).join('')}</select></div></div>
      <div class="par"><div><label for="amtema">Tema</label><input id="amtema" type="text" placeholder="Capacitación, manual…"></div>
        <div><label for="amenlace">Enlace</label><input id="amenlace" type="url" placeholder="https://"></div></div>
      <div style="margin-top:14px"><button class="btn" id="guardarMatA">Guardar</button></div>
    </div>`;
  if (!mats || !mats.length){
    html += `<div class="tarjeta-cuerpo"><p style="margin:0;color:var(--suave);font-size:14.5px">
      Todavía no hay material de esta área.</p></div>`;
  } else {
    html += '<ul class="registro">' + mats.map(m => `<li><div class="fila" style="cursor:default">
      <span class="fila-alto"><span class="nombre">${esc(m.titulo)}</span></span>
      <span class="sub"><span class="sello">${esc(TIPOS_MAT[m.tipo] || m.tipo)}</span>
        ${m.tema ? `<span>${esc(m.tema)}</span>` : ''}${m.autor ? `<span>· ${esc(m.autor)}</span>` : ''}</span>
      <span style="display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap">
      ${m.enlace ? `<a href="${esc(m.enlace)}" target="_blank" rel="noopener"
         style="font-size:14px;font-weight:600">Abrir →</a>` : ''}
      ${puede ? `<button class="btn rojo chico" data-borrarmat="${m.id}">Eliminar</button>` : ''}</span>
    </div></li>`).join('') + '</ul>';
  }
  html += `</div>`;

  if (equipo && equipo.length)
    html += `<div class="tarjeta"><div class="tarjeta-alto"><h2>Quiénes sirven aquí</h2></div>
      <ul class="registro">${equipo.map(e => `<li><div class="fila" style="cursor:default">
        <span class="fila-alto"><span class="nombre" style="font-size:17px">${esc(e.nombre)}</span>
          ${e.rol_en_area === 'lider' ? '<span class="sello">Líder</span>' : ''}</span>
      </div></li>`).join('')}</ul></div>`;

  app.innerHTML = html;
  document.getElementById('atras').onclick = () => ir('servicio');

  app.querySelectorAll('[data-borrarnov]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar esta novedad?', 'No se puede deshacer.')) return;
    const { error } = await SB.from('novedades').delete().eq('id', b.dataset.borrarnov);
    if (error) return avisar(error.message, true);
    avisar('Novedad eliminada.'); ir('area', id);
  });
  app.querySelectorAll('[data-borrarmat]').forEach(b => b.onclick = async () => {
    if (!await confirmar('¿Eliminar este material?', 'No se puede deshacer.')) return;
    const { error } = await SB.from('materiales').delete().eq('id', b.dataset.borrarmat);
    if (error) return avisar(error.message, true);
    avisar('Material eliminado.'); ir('area', id);
  });

  const nn = document.getElementById('nuevaNov');
  if (nn) nn.onclick = () => {
    const f = document.getElementById('formNov');
    f.hidden = !f.hidden; nn.textContent = f.hidden ? 'Publicar novedad' : 'Cancelar';
  };
  const gn = document.getElementById('guardarNov');
  if (gn) gn.onclick = async () => {
    const titulo = document.getElementById('nt').value.trim();
    if (!titulo) return avisar('Ponle título.', true);
    const { error } = await SB.from('novedades').insert({
      area_id:id, titulo, cuerpo:document.getElementById('nc').value.trim() || null,
      creado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Novedad publicada.');
    ir('area', id);
  };

  const nm = document.getElementById('nuevoMat');
  if (nm) nm.onclick = () => {
    const f = document.getElementById('formMatA');
    f.hidden = !f.hidden; nm.textContent = f.hidden ? 'Agregar' : 'Cancelar';
  };
  const gm = document.getElementById('guardarMatA');
  if (gm) gm.onclick = async () => {
    const titulo = document.getElementById('amt').value.trim();
    if (!titulo) return avisar('Ponle título.', true);
    const { error } = await SB.from('materiales').insert({
      titulo, area_id:id, tipo:document.getElementById('amtipo').value,
      tema:  document.getElementById('amtema').value.trim()   || null,
      enlace:document.getElementById('amenlace').value.trim() || null,
      creado_por:S.yo.persona_id });
    if (error) return avisar(error.message, true);
    avisar('Material guardado.');
    ir('area', id);
  };
}

/* ============================================================
   Yo
   ============================================================ */
async function vYo(){
  cargando();
  const { data:p } = await SB.from('ficha_persona').select('*').eq('id', S.yo.persona_id).maybeSingle();
  const c = claseEstado(p?.situacion);

  app.innerHTML = cabeza(esc(S.yo.nombre),
    `${esc(S.yo.rango || 'sin rango')}${p?.lider ? ` · cuidado por ${esc(p.lider)}` : ''}`) + `
    ${p ? `<div class="tarjeta"><div class="tarjeta-cuerpo">
      <div class="fila-alto"><div style="flex:1">
        <span class="marca-est m-${c.slice(2)}">${esc(p.situacion)}</span>
        <p class="ayuda">${p.ultima_reunion
          ? `Tu líder y tú se vieron ${haceCuanto(p.dias)}.`
          : 'Todavía no hay un encuentro registrado contigo.'}</p></div>
        <span class="cuenta ${c}">${p.dias}<small>días</small></span></div>
      <span class="medida ${c}" style="margin-top:14px"><i style="width:${Math.min(100,Math.round(p.dias/90*100))}%"></i><b style="left:33.3%"></b></span>
    </div></div>` : ''}

    <div class="tarjeta"><div class="tarjeta-alto"><h2>Lo que puedes hacer</h2></div>
      <div class="tarjeta-cuerpo"><ul class="datos">
        <li><span>Hombres a tu cargo</span><b>${S.yo.a_cargo}</b></li>
        <li><span>Registrar cuidado</span><b>${S.yo.puede_cuidar ? 'Sí' : 'Todavía no'}</b></li>
        ${S.yo.ve_todo  ? '<li><span>Ver todo el ministerio</span><b>Sí</b></li>' : ''}
        ${S.yo.es_admin ? '<li><span>Administrar la plataforma</span><b>Sí</b></li>' : ''}
      </ul>
      </div></div>

    <div class="tarjeta"><div class="tarjeta-alto"><h2>Apariencia</h2>
      <button class="btn seco chico" id="cambiarTema">${
        document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'Pasar a claro' : 'Pasar a oscuro'}</button></div>
      </div>

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px">
      <button class="btn seco" id="miProc">Ver mi proceso</button>
      <button class="btn seco" id="salir">Cerrar sesión</button></div>`;

  document.getElementById('cambiarTema').onclick = () => { girarTema(); ir('yo'); };
  document.getElementById('miProc').onclick = () => { S.procPersona = S.yo.persona_id; ir('procesos'); };
  document.getElementById('salir').onclick = () => SB.auth.signOut();
}

arrancar();
</script>
</body>
</html>
